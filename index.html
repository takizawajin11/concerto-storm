/* ---- 巡演：見せ場が来る ---- */
const _uSimS=uSim;
uSim=function(B,encore){
  try{B.sigUsed=B.sigUsed||[];
    if((!B.practice||B.challenge)&&Math.random()<(encore?.35:.45)){
      const cand=B.us.filter(u=>u.hp>0&&sigOf(u.id)&&!B.sigUsed.includes(u.i)&&uhs(u.id,u.hp,u.max)<3);
      if(cand.length){cand.sort((a,b)=>(UHIST[sigKey(b.id)]||urar(b.id))-(UHIST[sigKey(a.id)]||urar(a.id)));const u=Math.random()<.7?cand[0]:pick(cand);const s=sigOf(u.id);B.sigUsed.push(u.i);
        B.ev.push({k:'phase',txt:`見せ場《${s.n}》`,sig:u.i});B.ev.push({k:'skip',txt:`${nameOf(u.id)}「${s.l}」`});
        for(const e of B.en.filter(e=>e.hp>0)){const d=Math.max(2,Math.round(uAtk(B,u)*.42+rnd(0,4)-e.def));e.hp=Math.max(0,e.hp-d);u.dealt+=d;
          B.ev.push({k:'hit',u:u.i,e:B.en.indexOf(e),d,crit:true,txt:`見せ場《${s.n}》`,kill:e.hp<=0});}}}}catch(e){}
  return _uSimS(B,encore);
};
const _uRenderBS=uRenderB;
uRenderB=function(B,cont){
  _uRenderBS(B,cont);
  const ph=$('#bph'),box=document.querySelector('#scene .battle');if(!ph||!box)return;
  const queue=B.ev.slice(cont?B.encFrom:0).filter(v=>v.k==='phase'&&v.sig!=null);let shown=0;
  const mo=new MutationObserver(()=>{if(!/^見せ場/.test(ph.textContent)||shown>=queue.length)return;const v=queue[shown++];const u=B.us[v.sig];if(!u)return;const s=sigOf(u.id);
    cutin(sigKey(u.id),`「${s.l}」`,`見せ場《${s.n}》`);if(typeof sfx==='function')sfx('fanfare');fxPlay(box,s.fx);
    const el=$('#bu'+v.sig);if(el){el.classList.add('sigglow');setTimeout(()=>el.classList.remove('sigglow'),2400);}
});
  mo.observe(ph,{childList:true,characterData:true,subtree:true});setTimeout(()=>mo.disconnect(),90000);
};

/* ---- 演奏会：見せ場で評判が少し上がる ---- */
const _evalLineupS=evalLineup;
evalLineup=function(p,L,opt){const r=_evalLineupS(p,L,opt);opt=opt||{};
  const on=L.map((id,i)=>opt.standIn===i?null:id).filter(Boolean);let n=0;
  for(const id of on){const s=sigOf(id);if(!s||n>=2)continue;if(isDud(sigKey(id))||sigKey(id)==='donner')continue;n++;r.q+=.8;r.notes.push(`${nameOf(id)}の見せ場《${s.n}》（+0.8）`);}
  if(n)r.stars=r.q<13?1:r.q<17?2:r.q<21?3:r.q<25?4:5;return r;};
const _performS=perform;
perform=function(){
  _performS();
  const stage=document.querySelector('#scene .stage');if(!stage||!PR)return;
  const seen=new Set();let cut=false;
  const mo=new MutationObserver(ms=>{for(const m of ms){const el=m.target;if(!el.classList||!el.classList.contains('hl'))continue;const id=el.dataset.pid;if(!id||seen.has(id))continue;
    const s=sigOf(id);if(!s)continue;seen.add(id);
    setTimeout(()=>{animSay(el,`「${s.l}」`,'sig');fxPlay(stage,s.fx);el.classList.add('sigglow');setTimeout(()=>el.classList.remove('sigglow'),2000);
      if(!cut&&el.classList.contains('soloist')){cut=true;cutin(sigKey(id),`「${s.l}」`,`見せ場《${s.n}》`);}},350);}});
  stage.querySelectorAll('.perf').forEach(el=>mo.observe(el,{attributes:true,attributeFilter:['class']}));
  setTimeout(()=>mo.disconnect(),20000);
};

};

function cutinR(id,text,sub,era){

/* ---- 巡演：大御所（ライバルの楽長）の見せ場 ---- */
const _uSimR=uSim;
uSim=function(B,encore){
  const ret=_uSimR(B,encore);
  try{if(!encore&&(!B.practice||B.challenge)&&!B.rsigDone){
    const bi=B.en.findIndex(e=>e.boss&&e.pt&&rsigOf(e.pt));
    if(bi>=0){const e=B.en[bi],s=rsigOf(e.pt);
      for(let j=0;j<(B.sets&&B.sets.length?4:2);j++)B.ev.unshift({k:'phase',txt:'開演'});
      const pos=B.ev.findIndex(v=>v.k==='phase'&&v.txt==='第1楽章');
      const deadBefore=pos<0||B.ev.slice(0,pos).some(v=>v.k==='hit'&&v.e===bi&&v.kill);
      if(!deadBefore&&Math.random()<.75){B.rsigDone=1;
        const ins=[{k:'phase',txt:`${e.n}の見せ場《${s.n}》`,rsig:bi},{k:'skip',txt:`<b>${e.n}</b>「${s.l}」`}];
        for(const u of B.us){if(u.hp<=0)continue;const d=Math.max(1,Math.round(e.atk*.55+rnd(0,4)-udef(u.id)*.5));u.hp=Math.max(1,u.hp-d);ins.push({k:'hurt',e:bi,u:u.i,d,txt:`見せ場《${s.n}》`});}
        ins.push({k:'phase',txt:'第1楽章'});
        B.ev.splice(pos+1,0,...ins);}}}}catch(err){}
  return ret;
};
const _uRenderBR=uRenderB;
uRenderB=function(B,cont){
  _uRenderBR(B,cont);
  const ph=$('#bph'),box=document.querySelector('#scene .battle');if(!ph||!box)return;
  const bi=B.en.findIndex(e=>e.boss&&e.pt&&rsigOf(e.pt));if(bi<0)return;const e=B.en[bi],s=rsigOf(e.pt);
  const bel=$('#be'+bi);if(bel)bel.classList.add('rboss');
  /* 登場 */
  if(!cont){setTimeout(()=>{if(!$('#bph'))return;cutinR(e.pt,`「${s.e}」`,`${e.n}、登場`,e.era);if(bel){const t=document.createElement('div');t.className='rquote';t.textContent=`「${s.e}」`;bel.appendChild(t);setTimeout(()=>t.remove(),3200);}},B.sets&&B.sets.length?1900:120);}
  /* 見せ場 */
  let fired=false;
  const mo=new MutationObserver(()=>{if(fired||ph.textContent.indexOf(`の見せ場《${s.n}》`)<0)return;fired=true;
    cutinR(e.pt,`「${s.l}」`,`${e.n}の見せ場《${s.n}》`,e.era);if(typeof sfx==='function')sfx('gong');fxPlay(box,s.fx);
    if(bel){bel.classList.add('sigglow','rsig');setTimeout(()=>bel.classList.remove('sigglow','rsig'),2400);}
    box.classList.add('fxdark');setTimeout(()=>box.classList.remove('fxdark'),1600);});
  mo.observe(ph,{childList:true,characterData:true,subtree:true});
  /* 倒れたら負け台詞 */
  let lost=false;
  const mo2=bel&&new MutationObserver(()=>{if(lost||!bel.classList.contains('down'))return;lost=true;
    setTimeout(()=>{cutinR(e.pt,`「${s.lose}」`,`${e.n}、陥落`,e.era);},250);});
  if(mo2)mo2.observe(bel,{attributes:true,attributeFilter:['class']});
  setTimeout(()=>{mo.disconnect();if(mo2)mo2.disconnect();},90000);
};

const _rtStartR=rtStart;
rtStart=function(){
  _rtStartR();
  const R=RTS;if(!R)return;const s=rsigOf(R.t.id);if(!s)return;R.rs=s;
  setTimeout(()=>{if(RTS===R&&!R.over)rtSay(`${R.t.name}「${s.e}」`,'tell');},400);
  const iv=setInterval(()=>{if(RTS!==R||R.over){clearInterval(iv);return;}
    const m=Math.min(R.hp/R.hpMax,R.mp/R.mpMax);
    if(!R.sigDone&&(m<.55||R.time<22)&&!R.tell){R.sigDone=1;clearInterval(iv);

function bondMap(){
  const ms=['you'].concat(G.members).slice(0,14),n=ms.length,W=360,H=360,cx=180,cy=180,R=n<=6?110:135;
  const pos=ms.map((id,i)=>{const a=-Math.PI/2+i*2*Math.PI/n;return[cx+R*Math.cos(a),cy+R*Math.sin(a)];});
  const rid=id=>id==='you'?G.pid:id;let lines='',tags=[];
  for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){const v=bondOf(rid(ms[i]),rid(ms[j]));if(Math.abs(v)<15)continue;const lb=bondLabel(rid(ms[i]),rid(ms[j]));
    const col=/夫婦|恋/.test(lb)?'#e05a8a':v>0?(v>=60?'#d4a020':'#4aa070'):'#c03030';const w=Math.min(6,1+Math.abs(v)/20);
    lines+=`<line x1="${pos[i][0]}" y1="${pos[i][1]}" x2="${pos[j][0]}" y2="${pos[j][1]}" stroke="${col}" stroke-width="${w}" ${v<0?'stroke-dasharray="6 4"':''} opacity=".85"/>`;
    tags.push([Math.abs(v),`<div class="btag"><i style="background:${col}"></i><b>${nameOf(ms[i])}</b>と<b>${nameOf(ms[j])}</b>：${lb}${(BOND_H.find(x=>bkey(x[0],x[1])===bkey(rid(ms[i]),rid(ms[j])))||[])[4]?`<br><span class="pmeta">${BOND_H.find(x=>bkey(x[0],x[1])===bkey(rid(ms[i]),rid(ms[j])))[4]}</span>`:''}</div>`]);}
  const pts=ms.map((id,i)=>`<div class="bnode" style="left:${pos[i][0]/W*100}%;top:${pos[i][1]/H*100}%">${portrait(rid(id),40,'#c9a24a')}<span>${nameOf(id)}</span></div>`).join('');
  tags.sort((a,b)=>b[0]-a[0]);
  modal('人間関係図',`<div class="bmap"><svg viewBox="0 0 ${W} ${H}">${lines}</svg>${pts}</div><div class="pmeta" style="margin:4px 0">金＝固い絆　緑＝友情　桃＝恋・夫婦　赤の点線＝不仲</div>${tags.slice(0,10).map(x=>x[1]).join('')||'<div class="pmeta">まだ目立った関係はない。共演を重ねると縁が生まれる。</div>'}`,null,'paper');
}

/* =====================================================================
   師弟の系譜図：史実の師弟と、楽団で育てた弟子・卒業生を一本の系図に
   G.lineage = [[師, 弟子], ...]（楽団で生まれた師弟）
   ===================================================================== */
const LIN_H=[['bach','jcbach'],['haydn','beethoven'],['beethoven','czerny'],['czerny','liszt'],['salieri','beethoven'],['salieri','liszt'],['mozart','hummel'],['leopold','mozart'],
 ['liszt76','sauer'],['liszt76','rosenthal'],['leschetizky','paderewski'],['auer05','elman'],['auer05','zimbalist'],['joachim','huberman'],['hubay','vecsey'],['rimsky05','stravinsky'],
 ['taneyev','rachmaninoff'],['taneyev','scriabin'],['faure','ravel'],['faure','nboulanger'],['faure','enescu'],['mahler','walter'],['hasselmans','renie'],['porpora','farinelli'],['viotti','rode'],['regis','haru']];
const linRec=(t,s)=>{G.lineage=G.lineage||[];if(!G.lineage.some(([a,b])=>a===t&&b===s))G.lineage.push([t,s]);};
const _deshiMonthlyLN=deshiMonthly;
deshiMonthly=function(){const snap=Object.entries(G.deshi||{}).map(([s,d])=>[s,d.t]);_deshiMonthlyLN();try{for(const [s,t] of snap)if(!(G.deshi||{})[s]&&(G.deshiDone||{})[realId(s)])linRec(t==='you'?G.pid:realId(t),realId(s));}catch(e){}};
const _consGradLN=consGrad;
consGrad=function(k){const n=(G.grads||[]).length;const r=_consGradLN(k);try{const g=(G.grads||[])[n];const d=(G.consv||{})[k]&&G.consv[k].dir;if(g&&d)linRec(realId(d),g.id);}catch(e){}return r;};
function linName(id){if(id===G.pid)return P().name;const c=charById(id);if(c)return c.name;for(const s of Object.values(SCEN)){const x=s.chars.find(c=>c.id===id)||(s.players||{})[id];if(x)return x.name;}return null;}
function lineageOpen(){
  const mine=G.lineage||[];const known=new Set(['you',...G.members].map(x=>x==='you'?G.pid:realId(x)));
  const hist=LIN_H.filter(([a,b])=>known.has(a)||known.has(b));const edges=[...hist.map(e=>[...e,0]),...mine.map(e=>[...e,1])].filter(([a,b])=>linName(a)&&linName(b));
  if(!edges.length)return modal('師弟の系譜図','<div class="pmeta">まだ系図がない。弟子入りで免許皆伝を受けたり、音楽院から卒業生が出たりすると、ここに枝が伸びる。楽団にいる人の、史実の師弟も載る。</div>',null,'paper');
  const kids={},par={};for(const [a,b] of edges){(kids[a]=kids[a]||[]).push(b);par[b]=1;}
  const roots=[...new Set(edges.map(e=>e[0]))].filter(a=>!par[a]);const mk=new Set(mine.map(e=>e[1]));const seen=new Set();
  const node=(id,d)=>{if(seen.has(id)||d>6)return '';seen.add(id);const cs=(kids[id]||[]);
    return`<li><span class="ln${mk.has(id)?' mine':''}${known.has(id)?' here':''}">${portrait(id,26,'#c9a24a')}${linName(id)}</span>${cs.length?`<ul>${cs.map(c=>node(c,d+1)).join('')}</ul>`:''}</li>`;};
  modal('師弟の系譜図',`<div class="pmeta">金の枠＝楽団にいる人　赤い印＝楽団で育った弟子</div><ul class="lintree">${roots.map(r=>node(r,0)).join('')}</ul><div class="pmeta">楽団で生まれた師弟：${mine.length}組</div>`,null,'paper');
}

/* =====================================================================
   地図の「遊びの棚」：人間関係図・新作・大勝負・クイズ・系譜・年間まとめ・宿敵の批評家
   ===================================================================== */
const _mapHTMLHB=mapHTML;
mapHTML=function(){let h=_mapHTMLHB();try{
  const C0=typeof crit==='function'?crit():null,s=C0?critSt():null;const cm=G.compM!=null&&G.month-G.compM<3?`あと${3-(G.month-G.compM)}か月`:'書ける';
  const qn=G.quiz&&G.quiz.m===G.month?3-G.quiz.n:3;
  const hub=`<div class="hub">
    <button class="btn" data-hub="bond">👥 人間関係図</button>
    <button class="btn" data-hub="comp">✒️ 新作を書く<small>${cm}</small></button>
    <button class="btn" data-hub="bet">🎲 大勝負${G.bet?'<small>勝負中</small>':''}</button>
    <button class="btn" data-hub="quiz">🎵 聴き当て<small>残り${qn}問</small></button>
    <button class="btn" data-hub="lin">🌳 師弟の系譜</button>
    <button class="btn" data-hub="yr">📊 今年のまとめ</button>
  </div>${C0?`<button class="btn critbtn" data-hub="crit">${portrait(C0.id,24,'#8a2a3a')}宿敵の批評家 ${C0.n}<div class="cbar"><i style="width:${s.v}%"></i><span>評価 ${s.v}/100${s.won?'・唸らせた':''}</span></div></button>`:''}`;
  const m=h.match(/<button class="btn zkbtn"[\s\S]*?<\/button>/);h=m?h.replace(m[0],m[0]+hub):hub+h;}catch(e){}return h;};
const _renderHB=render;
render=function(){_renderHB();document.querySelectorAll('[data-hub]').forEach(b=>b.onclick=()=>({bond:bondMap,comp:composeOpen,bet:betOpen,quiz:quizOpen,lin:lineageOpen,yr:yrOpen,crit:criticInfo})[b.dataset.hub]());};


document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{TAB=b.dataset.t;render();});
$('#hFame').onclick=fameHelp;$('#hStC').onclick=staminaHelp;
$('#sndBtn').onclick=()=>{soundOn=!soundOn;updSnd();if(soundOn)ac();};
title();shBoot();
</script>
</body>
