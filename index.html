<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>協奏の嵐 統合版</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700;800&family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#15110c; --bg2:#1f1913; --panel:#2a221a; --line:#4a3c2c;
  --ink:#2b2117; --gold:#cfa84f; --gold2:#f0d58a; --text:#f2e8d4; --mute:#b5a586;
  --classic:#5a86b8; --roman:#b5506a; --virt:#cfa84f;
  --serif:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --latin:"Cormorant Garamond",Georgia,serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--serif);font-size:15px;line-height:1.6}
button{font-family:inherit;cursor:pointer}
.hidden{display:none!important}
#app{max-width:760px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
#hud{position:sticky;top:0;z-index:5;background:linear-gradient(#1b150f,#15110c);border-bottom:1px solid var(--line);padding:8px 12px 6px}
#hud .row1{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
#hud .date{font-weight:800;font-size:17px;letter-spacing:.04em}
#hud .date small{font-family:var(--latin);font-style:italic;color:var(--mute);font-weight:500;margin-left:6px}
#hud .who{font-size:13px;color:var(--gold2)}
#hud .stats{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:5px;font-size:11.5px;color:var(--mute)}
#hud .stats b{display:block;color:var(--text);font-size:14px;font-weight:700}
.bar{height:5px;background:#3a2f23;border-radius:3px;overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;background:var(--gold)}
#sndBtn{background:none;border:1px solid var(--line);color:var(--mute);border-radius:14px;font-size:12px;padding:2px 9px}
#tabs{display:flex;border-bottom:1px solid var(--line);background:var(--bg2)}
#tabs button{flex:1;background:none;border:0;color:var(--mute);padding:9px 0;font-size:14px;border-bottom:2px solid transparent}
#tabs button.on{color:var(--gold2);border-bottom-color:var(--gold)}
main{flex:1;padding:10px 12px 40px}
#mapWrap{background:radial-gradient(ellipse at 40% 40%,#f3e8cf,#d9c59b 75%,#c2aa7a);border-radius:10px;border:1px solid #8a7550;box-shadow:inset 0 0 40px rgba(80,50,10,.35);overflow:hidden}
#map{display:block;width:100%;height:auto}
.legend{display:flex;gap:4px 12px;flex-wrap:wrap;font-size:11.5px;color:var(--mute);margin:6px 2px 10px}
.legend .d::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:-1px;background:var(--c)}
.legend .r::before{content:"";display:inline-block;width:9px;height:9px;border:2px dashed var(--c);margin-right:4px;vertical-align:-1px;border-radius:50%}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
.city-h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.city-h h2{margin:0;font-size:21px;letter-spacing:.05em}
.city-h h2 small{font-family:var(--latin);font-style:italic;color:var(--mute);font-size:15px;margin-left:6px;font-weight:500}
.inst{font-size:13px;color:var(--mute)}
.chip{display:inline-block;font-size:11px;padding:1px 8px;border-radius:10px;border:1px solid var(--c);color:var(--c);white-space:nowrap}
.chip.solid{background:var(--c);color:#1a140e;font-weight:700}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.btn{background:#3a2e21;border:1px solid #6d5a3e;color:var(--text);border-radius:8px;padding:9px 6px;font-size:14px;line-height:1.3}
.btn small{display:block;font-size:10.5px;color:var(--mute)}
.btn.gold{background:linear-gradient(#d9b55d,#a9812f);color:#1d150b;border-color:#e6c56f;font-weight:700}
.btn.gold small{color:#3b2a10}
.btn.crim{background:linear-gradient(#a83a40,#7a2328);border-color:#c35a5f}
.btn:disabled{opacity:.38;cursor:default}
.sec-t{font-size:13px;color:var(--gold2);margin:14px 2px 6px;letter-spacing:.1em}
.person{display:flex;gap:10px;align-items:center;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:9px;margin-bottom:8px}
.medal{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:19px;color:var(--ink);background:radial-gradient(circle at 35% 30%,#fff6dd,#d7c191);border:3px solid var(--c);box-shadow:0 0 0 1px #000 inset}
.medal.big{width:64px;height:64px;font-size:26px}
.pinfo{flex:1;min-width:0}
.pname{font-weight:700;font-size:15.5px}
.pname .lat{font-family:var(--latin);font-style:italic;color:var(--mute);font-weight:500;font-size:13px;margin-left:4px}
.pmeta{font-size:11.5px;color:var(--mute)}
.trust{height:4px;background:#3a2f23;border-radius:2px;margin-top:4px;position:relative;overflow:hidden}
.trust i{position:absolute;top:0;bottom:0}
.pbtns{display:flex;flex-direction:column;gap:5px}
.pbtns .btn{padding:5px 10px;font-size:12.5px}
.trivia{font-size:12px;color:#d8c9a8;background:#1a150f;border-left:2px solid var(--gold);padding:6px 9px;margin:6px 0;border-radius:0 6px 6px 0}
.tag{font-size:10px;color:#1a140e;background:#9fd0c7;border-radius:4px;padding:0 5px;margin-left:4px;vertical-align:2px;font-family:var(--serif);font-style:normal}
.tag.rv{background:var(--c);color:#fff}
.seat{display:flex;justify-content:space-between;align-items:center;padding:8px 4px;border-bottom:1px dashed var(--line);font-size:14px}
.seat .r{color:var(--mute);font-size:12.5px;width:7.5em;flex:none}
.seat .n{flex:1;font-weight:700}
.seat .n.empty{color:#6b5c47;font-weight:500}
.log p{margin:0 0 8px;font-size:13px;border-bottom:1px dotted var(--line);padding-bottom:6px}
.log p b{color:var(--gold2);font-weight:700;margin-right:6px;font-size:12px}
.fac{border-left:4px solid var(--c)}
.fac h3{margin:0;font-size:17px}
.fac .row{font-size:13px;color:#d8c9a8;margin-top:3px}
#scene{position:fixed;inset:0;z-index:20;background:radial-gradient(ellipse at 50% 0%,#3a2a1a,#120e0a 70%);overflow-y:auto}
.sc{max-width:620px;margin:0 auto;padding:14px 14px 30px}
.sc h3{margin:4px 0 2px;font-size:19px;text-align:center;letter-spacing:.08em}
.sc .subt{text-align:center;font-family:var(--latin);font-style:italic;color:var(--mute);font-size:14px}
.vs{display:flex;justify-content:space-between;align-items:center;margin:12px 4px 6px}
.vs .side{text-align:center;width:40%}
.vs .side div:last-child{font-size:13px;margin-top:3px}
.vs .mid{font-family:var(--latin);font-style:italic;font-size:26px;color:var(--gold)}
.meter{position:relative;height:16px;border-radius:8px;background:linear-gradient(90deg,#5a1d22,#2a1f17 50%,#5a4a1d);border:1px solid #6d5a3e;margin:8px 0 2px}
.meter .ndl{position:absolute;top:-5px;width:4px;height:24px;background:#fff3cf;border-radius:2px;box-shadow:0 0 8px #ffe08a;transition:left .5s cubic-bezier(.3,1.6,.5,1)}
.meter .c0{position:absolute;left:50%;top:0;bottom:0;width:1px;background:#8a7550}
.mlab{display:flex;justify-content:space-between;font-size:11px;color:var(--mute)}
.bubbles{min-height:210px;max-height:260px;overflow-y:auto;padding:8px 2px;display:flex;flex-direction:column;gap:7px;margin:8px 0;background:rgba(0,0,0,.18);border-radius:8px}
.bub{max-width:82%;padding:7px 11px;border-radius:14px;line-height:1.45;animation:pop .35s ease-out;word-break:break-word}
.bub.you{align-self:flex-end;background:#f1e3bf;color:var(--ink);border-bottom-right-radius:3px}
.bub.them{align-self:flex-start;background:#4a2a2c;color:#f6e3e3;border-bottom-left-radius:3px}
.bub .k{display:block;font-size:10.5px;opacity:.7}
.bub .fx{display:block;font-size:11.5px;font-weight:800;margin-top:2px}
.bub.weak{box-shadow:0 0 0 2px var(--gold),0 0 14px rgba(240,200,90,.6)}
.bub.resist{opacity:.75}
.bub.back{box-shadow:0 0 0 2px #d24}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.insp{position:relative;height:12px;border-radius:6px;background:#2b231a;border:1px solid #5d4c36;overflow:hidden}
.insp i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#6f8fd8,#c9a3ff,#ffe08a);transition:width .4s}
.insp.full{animation:glow 1s infinite alternate}
@keyframes glow{to{box-shadow:0 0 12px #ffe08a}}
.cmds{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}
.cmds .btn{padding:8px 2px;font-size:15px}
.cmds .btn small{font-size:10px}
.rinfo{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);margin-top:8px}
.cards3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.pc{background:linear-gradient(#f6ecd2,#dcc89c);color:var(--ink);border:2px solid #8a7550;border-radius:10px;padding:12px 4px;text-align:center;font-size:17px;font-weight:800}
.pc small{display:block;font-size:10.5px;font-weight:500;color:#5b4a33;margin-top:3px;line-height:1.35}
.pc .ic{font-family:var(--latin);font-size:24px;display:block;line-height:1}
.pc:disabled{opacity:.4}
.tell{text-align:center;font-size:13.5px;color:#e9d9b8;background:rgba(0,0,0,.25);border-radius:8px;padding:8px;margin:8px 0}
.score{display:flex;justify-content:center;gap:22px;font-size:28px;font-family:var(--latin);margin:4px 0}
.score span{color:var(--mute);font-size:13px;font-family:var(--serif);display:block;text-align:center}
.mvlog p{font-size:13px;margin:4px 0;padding:6px 9px;background:rgba(0,0,0,.2);border-radius:6px}
.piece{display:block;width:100%;text-align:left;margin-bottom:8px}
#modal{position:fixed;inset:0;z-index:40;background:rgba(5,3,1,.72);display:flex;align-items:center;justify-content:center;padding:16px}
#modal .box{background:linear-gradient(#f3e8cf,#e0cea6);color:var(--ink);border-radius:12px;max-width:440px;width:100%;padding:18px 16px 14px;border:2px solid #8a7550;box-shadow:0 10px 40px #000;max-height:86vh;overflow-y:auto}
#modal h4{margin:0 0 8px;font-size:18px;border-bottom:1px solid #b39c6c;padding-bottom:6px}
#modal .body{font-size:14px}
#modal .body .trivia{color:#3b2e1d;background:#fff6dc}
#modal .body [style*="var(--gold2)"]{color:#8a6420!important;font-weight:800}
#modal .body [style*="var(--mute)"]{color:#6d5a3e!important}
#modal .mb{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
#modal .mb .btn{flex:1;min-width:40%}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:50;background:#f0d58a;color:#1d150b;padding:8px 16px;border-radius:20px;font-size:13.5px;font-weight:700;box-shadow:0 4px 18px #000;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1}
.title{text-align:center;padding:26px 6px 10px}
.title .logo{font-size:44px;font-weight:800;letter-spacing:.18em;margin:0;background:linear-gradient(#fff2c4,#cfa84f 60%,#8a6420);-webkit-background-clip:text;background-clip:text;color:transparent}
.title .en{font-family:var(--latin);font-style:italic;color:var(--mute);font-size:18px;letter-spacing:.12em}
.title .staff{height:34px;margin:14px auto;max-width:300px;background:repeating-linear-gradient(transparent 0 6px,#6d5a3e 6px 7px)}
.hero{display:flex;gap:12px;text-align:left;align-items:center;margin:8px 0;width:100%;padding:12px}
.hero p{margin:2px 0 0;font-size:12px;color:var(--mute)}
.scen{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px}
.scen .y{font-family:var(--latin);font-size:26px;color:var(--gold2);font-weight:700;line-height:1}
.scen b{font-size:16px}
.scen p{margin:4px 0 0;font-size:12px;color:var(--mute)}
.howto{text-align:left;font-size:13px;color:#d8c9a8}
.howto li{margin-bottom:5px}
.prog{font-size:14px;line-height:1.9}
.prog i{font-family:var(--latin);color:var(--mute)}
.credit{font-size:11px;color:#7d6e55;margin-top:14px}
.credit a{color:#9c8b6c}
.pt{display:block;flex:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,.45))}
.vs .side .pt{margin:auto}
.cutin{position:fixed;inset:0;z-index:60;pointer-events:none;display:flex;align-items:center;background:rgba(0,0,0,.35);animation:cfade 1.75s forwards}
.cutin .band{width:100%;background:linear-gradient(100deg,#6a141a,#a8323a 40%,#cfa84f);padding:10px 18px;display:flex;align-items:center;gap:14px;box-shadow:0 0 30px #000;animation:cslide 1.75s cubic-bezier(.2,.9,.2,1) forwards}
.cutin .ct b{display:block;font-size:34px;color:#fff;font-weight:800;text-shadow:0 3px 0 #000,0 0 18px #ffd27a;letter-spacing:.06em}
.cutin .ct span{color:#fff3cf;font-size:14px}
@keyframes cslide{0%{transform:translateX(-110%) skewY(-6deg)}14%{transform:translateX(0) skewY(-6deg)}84%{transform:translateX(0) skewY(-6deg)}100%{transform:translateX(110%) skewY(-6deg)}}
@keyframes cfade{0%,85%{opacity:1}100%{opacity:0}}
.stage{position:relative;border-radius:10px;overflow:hidden;border:1px solid #6d5a3e}
.stage .stbg{display:block;width:100%;height:auto}
.stage .perf{position:absolute;transform:translateX(-50%);text-align:center;animation:bob 1.2s ease-in-out infinite alternate}
.stage .perf span{display:block;font-size:10px;color:#fff3cf;text-shadow:0 1px 2px #000;white-space:nowrap}
@keyframes bob{to{transform:translateX(-50%) translateY(-3px)}}
.stage .spot{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 30%,rgba(255,236,170,.32),transparent 55%);animation:spot 2.5s ease-in-out infinite alternate;pointer-events:none}
@keyframes spot{from{background-position:-40px 0}to{background-position:40px 0}}
.stage .nt{position:absolute;bottom:20%;color:#ffe08a;font-size:18px;opacity:0;animation:nt 2.6s ease-out infinite;text-shadow:0 0 6px #ffcf5a}
@keyframes nt{0%{opacity:0;transform:translateY(0)}20%{opacity:1}100%{opacity:0;transform:translateY(-120px) rotate(20deg)}}
.aud{display:flex;justify-content:space-between;align-items:flex-end;height:22px;margin-top:-1px;background:#0c0806;padding:0 6px}
.aud i{display:block;width:12px;border-radius:6px 6px 0 0;background:#2a1f17}
.aud i.clap{animation:clap .25s ease-in-out infinite alternate}
@keyframes clap{to{transform:translateY(-4px)}}
.applause{height:14px;border-radius:7px;background:#2b231a;border:1px solid #5d4c36;overflow:hidden}
.applause i{display:block;height:100%;width:0;background:linear-gradient(90deg,#9a2f35,#cfa84f,#fff3cf);transition:width 1.1s ease-out}
.prog-c b{font-size:14.5px}.prog-c small{margin-top:2px}
.pf-form{font-size:10.5px;background:#5a4630;border-radius:4px;padding:0 5px;color:#f0d58a}
.slot{cursor:pointer}
.empty-pt{width:44px;height:53px;border-radius:50%;border:2px dashed #6d5a3e;display:grid;place-items:center;color:#6d5a3e;font-size:20px;flex:none}
#modal .box.paper{background:#f5f0e3;font-family:var(--serif);border:1px solid #2b2117;box-shadow:0 10px 40px #000,inset 0 0 0 4px #f5f0e3,inset 0 0 0 5px #2b2117}
#modal .box.paper h4{font-family:var(--latin);font-size:24px;text-align:center;border-bottom:3px double #2b2117;font-style:italic;letter-spacing:.04em}
#modal .headline{font-size:21px;font-weight:800;text-align:center;margin:4px 0;letter-spacing:.06em}
#modal .dateline{font-size:11.5px;text-align:center;color:#6d5a3e;border-bottom:1px solid #b39c6c;padding-bottom:4px;margin-bottom:6px}
#modal .stars{text-align:center;font-size:22px;color:#8a6420;letter-spacing:.12em}
#modal .box.paper p{margin:6px 0;text-align:justify}
.diffb{display:block;width:100%;text-align:left;margin-bottom:8px}
.sec2{display:flex;gap:6px;flex-wrap:wrap}
.sec2 .btn{padding:4px 8px;font-size:12px;display:flex;align-items:center;gap:4px}
.sec2 .btn.on{border-color:var(--gold);background:#5a4630}
.seat .pt{margin-right:8px}
@media (max-width:420px){#hud .date small{display:none}}
.sk{display:inline-block;font-size:10.5px;background:linear-gradient(#e6c56f,#a9812f);color:#1d150b;border-radius:4px;padding:0 5px;margin:2px 3px 0 0;font-weight:700}
.qk{display:inline-block;font-size:10.5px;border:1px solid #8a7550;color:#d8c9a8;border-radius:4px;padding:0 5px;margin:2px 3px 0 0}
.qk.q-sickly,.qk.q-temper,.qk.q-greedy,.qk.q-debtor,.qk.q-diva,.qk.q-flirt,.qk.q-lazy,.qk.q-shy,.qk.q-reviser{border-color:#b55;color:#f2b0b0}
.qk.q-loyal,.qk.q-star,.qk.q-fast{border-color:#5a9;color:#a8e0c8}
.qrow{line-height:1.2;margin-top:2px}
.hallc{display:flex;gap:10px;align-items:center;width:100%;text-align:left;margin-bottom:8px}
.hallc small{display:block}
.fillbar{height:5px;background:#3a2f23;border-radius:3px;overflow:hidden;margin-top:4px}.fillbar i{display:block;height:100%;background:var(--gold)}
.audwrap{position:relative;margin-top:-1px;border-radius:0 0 10px 10px;overflow:hidden;border:1px solid #6d5a3e;border-top:0}
.aud2{display:block;width:100%;height:auto}
.aud2 .who{transform-box:fill-box;transform-origin:50% 100%}
.aud2.r-listen .who{animation:sway 3s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
.aud2.r-clap .who,.aud2.r-polite .who{animation:hop .35s ease-in-out infinite alternate}
.aud2.r-polite .who{animation-duration:.8s}
.aud2.r-cheer .who{animation:hop2 .25s ease-in-out infinite alternate}
.aud2.r-ovation .who{animation:stand .25s ease-in-out infinite alternate}
.aud2.r-boo .who{animation:shake .12s linear infinite alternate}
@keyframes hop{to{transform:translateY(-2px)}}@keyframes hop2{to{transform:translateY(-5px)}}
@keyframes stand{from{transform:translateY(-6px) scale(1.08)}to{transform:translateY(-10px) scale(1.08)}}
@keyframes shake{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}
.aud2 .who.leave{opacity:0;transition:opacity 1.6s}
.aud2 .who.faint{animation:faint 1s forwards!important}
@keyframes faint{to{transform:rotate(85deg) translateY(3px)}}
.rb{position:absolute;transform:translate(-50%,-50%);font-size:12px;font-weight:800;color:#fff3cf;background:rgba(40,25,15,.85);border:1px solid #cfa84f;border-radius:10px;padding:1px 7px;white-space:nowrap;animation:rbp 2.2s ease-out forwards;pointer-events:none}
.rb.good{background:#a8323a;color:#fff}.rb.bad{background:#333;color:#ccc;border-color:#666}.rb.faintb{background:#f7c;color:#fff;border-color:#fff}
@keyframes rbp{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-120%)}}
.flower{position:absolute;bottom:-20px;font-size:20px;animation:fly 1.4s ease-out forwards;opacity:0}
@keyframes fly{0%{opacity:1;transform:translateY(0) rotate(0)}100%{opacity:1;transform:translateY(-120px) rotate(300deg)}}
.stage .perf{transition:transform .25s,filter .25s}
.stage .perf.hl{transform:translateX(-50%) scale(1.22);z-index:3;filter:drop-shadow(0 0 12px #ffe08a)}
.stage .perf .pop{position:absolute;left:50%;top:-6px;transform:translateX(-50%);font-size:18px;font-weight:800;color:#ffe08a;text-shadow:0 2px 0 #000,0 0 8px #000;animation:popup 1.3s ease-out forwards;white-space:nowrap;pointer-events:none}
.stage .perf .pop.big{font-size:24px;color:#fff3cf}.stage .perf .pop.low{color:#bbb;font-size:15px}
.stage .perf .pop small{display:block;font-size:10px;color:#fff;background:#a8323a;border-radius:4px;padding:0 4px}
@keyframes popup{0%{opacity:0;transform:translate(-50%,10px)}20%{opacity:1;transform:translate(-50%,-14px)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-34px)}}
.critic{display:flex;gap:10px;align-items:center;background:#f3e8cf;color:#2b2117;border-radius:10px;padding:8px 10px;margin-top:8px;animation:pop .4s}

let G=null,SC=null,TAB='map';
const P=()=>G.P;
const lvOf=xp=>{let l=0;for(const t of XPT)if(xp>=t)l++;return l;};
const plv=()=>lvOf(P().xp);
const PL=()=>SC.players[G.pid];
const flab=f=>SC.flabel[f]||f;
const ci=k=>Object.assign({},BASE[k],SC.cityOv[k]||{});
const cityLv=k=>ci(k).lv+(G.cityLvB[k]||0)+(G.owner&&G.owner[k]!=='player'?Math.floor(SC.cities.filter(x=>x!==k&&G.owner[x]==='player').length*(DF().cr||1)*.5):0);
const mIdx=(y,m)=>(y*12+m-1)-(SC.start.y*12+SC.start.m-1);
const ymd=mo=>{const t=SC.start.y*12+SC.start.m-1+mo;return{y:Math.floor(t/12),mo:t%12+1};};
const rivalsActive=()=>SC.rivals.filter(r=>(!r.onlyFor||r.onlyFor===G.pid)&&r.id!==G.pid&&!(G.dead||[]).includes(r.id));
const rivalById=id=>rivalsActive().find(r=>r.id===id);
const charById=id=>SC.chars.find(c=>c.id===id);
const isMember=id=>G.members.includes(id);
const owned=who=>SC.cities.filter(k=>G.owner[k]===who);
const myCities=()=>owned('player');
const rcol=rid=>RIVALCOL[rivalsActive().findIndex(r=>r.id===rid)]||'#555';
function likesOf(t){return Object.assign({},t.likes,(t.likesBy&&t.likesBy[G.pid])||{});}
function poolChars(){const rv=rivalsActive().map(r=>r.id);return SC.chars.filter(c=>!(G.dead||[]).includes(c.id)&&c.id!==G.pid&&!rv.includes(c.id)&&!isMember(c.id)&&!G.lostTo.includes(c.id)&&(!c.from||G.month>=mIdx(c.from.y,c.from.m)));}
const freeChars=()=>poolChars().filter(c=>!G.charOwner[c.id]);
function save(){try{localStorage.setItem('concertoStorm5',JSON.stringify(G));}catch(e){}}
function load(){try{const s=localStorage.getItem('concertoStorm5');return s?JSON.parse(s):null;}catch(e){return null;}}
function newGame(sc,pid,diff){
  SC=SCEN[sc];const b=SC.players[pid];
  G={sc,pid,P:{name:b.name,faction:b.faction,xp:XPT[Math.max(0,XPT_OLD.filter(t=>b.xp>=t).length-1)],tech:b.tech,expr:b.expr,impro:b.impro,theory:b.theory,money:Math.round(b.money*DIFF[diff||'normal'].mo),stamina:100,city:b.start},
    month:0,owner:{},members:[],charOwner:{},rv:{},trust:{},cityF:{},cityLvB:{},flags:{},log:[],salonInsp:0,lostTo:[],over:false,diff:diff||'normal',cond:{},bond:{},boost:{}};
  for(const k of SC.cities)G.cityF[k]=ci(k).faction;
  for(const k of (b.own||[])){G.owner[k]='player';G.cityF[k]=b.faction;}
  for(const r of rivalsActive()){G.rv[r.id]={lv:r.lv+DIFF[diff||'normal'].lvB};G.owner[r.city]=r.id;G.cityF[r.city]=r.faction;}
  const d=ymd(0);
  addLog(`${d.y}年${d.mo}月、${b.name}、${ci(b.start).name}に立つ。目標は5都市の支配と、9席中7席を埋めたドリームオーケストラ。`);
}
function addLog(s){const d=ymd(G.month);G.log.unshift({d:`${d.y}.${d.mo}`,s});if(G.log.length>150)G.log.pop();if(HISTRE.test(s))hpush(s);}
function toast(s){const t=$('#toast');t.textContent=s;t.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('on'),2300);}
function addXP(n){
  const before=plv();P().xp+=n;xpFlash(n);const after=plv();
  for(let l=before+1;l<=after;l++){const k3=['tech','expr','impro'][l%3];P()[k3]++;if(l%3===0)P().theory++;addLog(`名声がLv${l}に上がった（${CARD[k3].t}+1${l%3===0?'・楽理+1':''}）`);toast(`名声 Lv${l}！ 格上とも交渉できる`);}
}
function seatMap(){const m={};for(const s of SEATS)m[s]=null;const extra=[];for(const id of G.members){const c=charById(id);if(!m[c.seat])m[c.seat]=c;else extra.push(c);}return{m,extra};}
function seatsFilled(){const {m}=seatMap();return SEATS.filter(s=>m[s]).length;}
function income(){let v=myCities().reduce((a,k)=>a+((G.fire&&G.fire[k]>G.month)?0:ci(k).size*80),0)+lessonIncome();v+=(G.flags.noBonus?0:PL().bonus||0);if(G.flags.coffee)v+=250;if(G.flags.casino)v+=600;return v;}
function upkeep(){return G.members.reduce((a,id)=>a+salaryOf(id),0);}
function factionMult(a,b){if(a===b)return 1.3;if(OPP[a]===b)return .7;return 1;}
function rivalLeader(rid){const r=rivalById(rid);return Object.assign({},r,{lv:G.rv[rid].lv});}

const MQ=[];let mOpen=false;
let PAPERMODE=false;
function modal(title,body,btns,cls){if(PAPERMODE&&!cls){hpush('【史実】'+title);cls='paper';body=`<div class="headline">${title}</div><div class="dateline">号外</div>`+body;title=paperOf(P().city);}MQ.push({title,body,btns:btns||[{t:'閉じる'}],cls});if(!mOpen)nextModal();}
function nextModal(){
  const q=MQ.shift();if(!q){$('#modal').classList.add('hidden');mOpen=false;return;}
  mOpen=true;$('#modal .box').className='box '+(q.cls||'');$('#mT').textContent=q.title;$('#mB').innerHTML=q.body;const box=$('#mBtns');box.innerHTML='';
  q.btns.forEach(b=>{const e=document.createElement('button');e.className='btn'+(b.cls?' '+b.cls:'');e.innerHTML=b.t;if(b.dis)e.disabled=true;e.onclick=()=>{nextModal();if(b.f)b.f();};box.appendChild(e);});
  $('#modal').classList.remove('hidden');
}

/* ======================= 月の進行（ライバルAI含む） ======================= */
function rivalAI(){
  for(const r of rivalsActive()){
    const R=G.rv[r.id];const nC=owned(r.id).length;
    const nM=Object.values(G.charOwner).filter(x=>x===r.id).length;
    if(G.month%DF().rg===DF().rg-1)R.lv=Math.min(30,Math.max(R.lv,Math.min(R.lv+1,plv()+1+Math.ceil(Math.max(0,DF().lvB)/2))));
    const unhappy=G.members.filter(id=>moodOf(id)<40&&!hasQ(id,'loyal')&&!isAway(id));
    if(unhappy.length&&Math.random()<.06*DF().rv){const id=pick(unhappy);(G.alumni=G.alumni||[]).push(id);G.members=G.members.filter(x=>x!==id);G.charOwner[id]=r.id;modal('引き抜かれた！',`${portraitRow(id)}不満を募らせていた${charById(id).name}が、${r.name}陣営に引き抜かれた。`);addLog(`${charById(id).name}が${r.name}陣営に移籍した。`);}
    if(nM<4&&Math.random()<(.07+.01*nC)*DF().rv){
      const pool=freeChars();if(pool.length){
        const same=pool.filter(c=>c.faction===r.faction);const c=pick(same.length&&Math.random()<.7?same:pool);
        G.charOwner[c.id]=r.id;addLog(`${r.name}陣営が${c.name}を引き抜いた。`);}}
    if(nC<5&&Math.random()<.06*DF().rv){
      const free=SC.cities.filter(k=>!G.owner[k]&&cityLv(k)<=R.lv+1);
      if(free.length){const k=pick(free);G.owner[k]=r.id;G.cityF[k]=r.faction;addLog(`${r.name}陣営が${ci(k).name}の${ci(k).inst}を掌握した。`);}}
    const mine=myCities();
    if(mine.length&&G.month>2&&Math.random()<(.035+.01*nC)*DF().rv){
      const k=pick(mine);const c=ci(k);const pay=c.size*400;
      modal(`興行戦争！ ${c.name}`,`${r.name}陣営が、${c.inst}に同じ夜の公演をぶつけてきた。聴衆と楽団員を奪う気だ。`,
       [{t:'迎え撃つ（演奏対決）',cls:'crim',f(){const L=rivalLeader(r.id);L.city=k;openDuel(L,{noAdvance:true,title:'興行戦争・防衛',
          onWin(){addXP(25);addLog(`${c.name}で${r.name}陣営を撃退した。`);return`${c.name}の聴衆は、あなたの楽団を選んだ。`;},
          onLose(){G.owner[k]=r.id;G.cityF[k]=r.faction;addLog(`${c.name}を${r.name}陣営に奪われた。`);return`${c.inst}は${r.name}陣営の手に落ちた。`;}});}},
        {t:`和解金 ${fmt(pay)}fr`,dis:P().money<pay,f(){P().money-=pay;addLog(`${r.name}陣営に和解金${fmt(pay)}を払い、${c.name}を守った。`);render();}},
        {t:'明け渡す',f(){G.owner[k]=r.id;G.cityF[k]=r.faction;addLog(`${c.name}を${r.name}陣営に明け渡した。`);render();}}]);
    }
  }
}
function advance(n=1){
  for(let i=0;i<n;i++){
    G.month++;
    P().money+=income()-upkeep();
    P().stamina=clamp(P().stamina+8,0,100);
    if(G.pid==='bach'&&Math.random()<.15){P().money-=150;addLog('子どもたちの養育費と学費で150フランの出費。');}
    if(G.pid==='handel'&&Math.random()<.1){P().money-=300;addLog('看板歌手がギャラの値上げを要求。300フランの出費。');}
    if(G.sc==='s1905'&&plv()>=4&&Math.random()<.06){P().money+=1200;addLog('レコード会社から録音の依頼。1,200フランの収入。');}
    if(G.pid==='mozart'&&Math.random()<.18){const s=Math.round(rnd(150,450));P().money-=s;addLog(`ビリヤードと夜会で${s}フラン散財した。`);}
    if(Math.random()<.25){const free=SC.cities.filter(k=>!G.owner[k]);if(free.length){const k=pick(free),f=pick(['古典','ロマン','名人芸']);if(G.cityF[k]!==f){G.cityF[k]=f;addLog(`${ci(k).name}で${flab(f)}が勢力を伸ばした。`);}}}
    rivalAI();memberMonthly();growthMonthly();historicalDeaths();happenings();
    const d=ymd(G.month);
    checkAch();
    for(const e of EV[G.sc])if(e.y===d.y&&e.m===d.mo&&(!e.c||e.c())){PAPERMODE=true;try{e.run();}finally{PAPERMODE=false;}}
  }
  save();
}
function checkEnd(){
  if(G.over)return true;
  if(G.flags.pdeath){G.over=true;save();ending(G.pid==='mahler'?'大地の歌':'ヴェネツィアに死す',((DEATH[G.pid]||{}).t||'')+'大演奏会は未完に終わった。');return true;}
  if(!G.flags.endless&&myCities().length>=DF().wc&&seatsFilled()>=DF().ws&&!G.flags.bossDone&&!(G.flags.bossRetry>G.month)&&$('#scene').classList.contains('hidden')){bossIntro();return true;}
  if(P().money<-2000){G.over=true;save();ending('破産','借金が2,000フランを超え、楽団は解散した。');return true;}
  if(!G.flags.endless&&G.month>=DF().lim){G.over=true;save();const d=ymd(G.month);ending('時代の幕切れ',`${d.y}年が終わった。大演奏会は実現しなかったが、あなたの名は音楽史に刻まれた。`);return true;}
  return false;
}
function endAction(n=1){advance(n);render();checkEnd();}

/* ======================= 画面 ======================= */
function renderHUD(){
  const d=ymd(G.month);
  $('#hDate').innerHTML=`${d.y}年${d.mo}月<small>Anno ${d.y}</small>`;
  $('#hWho').textContent=`${P().name}／${ci(P().city).name}`;
  $('#hMoney').textContent=fmt(P().money)+'fr';
  $('#hLv').textContent='Lv'+plv();{const l=plv(),a=XPT[l-1]||0,b=XPT[l],x=P().xp;$('#hLvBar').style.width=(b?clamp((x-a)/(b-a)*100,0,100):100)+'%';$('#hLvNext').textContent=b?`次まで${Math.ceil(b-x)}`:'最高';}
  $('#hSt').textContent=Math.round(P().stamina);
  $('#hStBar').style.width=P().stamina+'%';
  $('#hCity').textContent=myCities().length+'/'+DF().wc;$('#hCityBar').style.width=clamp(myCities().length/DF().wc*100,0,100)+'%';
  $('#hOrch').textContent=seatsFilled()+'/'+DF().ws;$('#hOrchBar').style.width=clamp(seatsFilled()/DF().ws*100,0,100)+'%';
}
function render(){
  if(!G)return;renderHUD();
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===TAB));
  const m=$('#main');
  if(TAB==='map')m.innerHTML=mapHTML()+cityHTML();
  else if(TAB==='orch')m.innerHTML=orchHTML();
  else if(TAB==='fac')m.innerHTML=facHTML();
  else m.innerHTML=`<div class="card log">${G.log.map(l=>`<p><b>${l.d}</b>${l.s}</p>`).join('')}</div>`;
  bind();
}
function dist(a,b){const A=BASE[a],B=BASE[b];const dx=(A.lon-B.lon)*Math.cos((A.la+B.la)/2*Math.PI/180);return Math.hypot(dx,A.la-B.la);}
function mapHTML(){
  let routes='';
  for(const [a,b] of ROUTES){if(!SC.cities.includes(a)||!SC.cities.includes(b))continue;const p=POS[a],q=POS[b];routes+=`<line x1="${p[0]}" y1="${p[1]}" x2="${q[0]}" y2="${q[1]}" stroke="#8a7550" stroke-width=".8" stroke-dasharray="2 3" opacity=".75"/>`;}
  let staff='';for(let g=0;g<4;g++)for(let l=0;l<5;l++){const y=40+g*70+l*5;staff+=`<line x1="0" y1="${y}" x2="360" y2="${y}" stroke="#a88f62" stroke-width=".4" opacity=".35"/>`;}
  let nodes='';
  for(const k of SC.cities){const c=ci(k),[x,y]=POS[k],f=FHEX[G.cityF[k]],own=G.owner[k],here=P().city===k;
    const ppl=poolChars().filter(p=>p.city===k).length;
    let ring='';
    if(own==='player')ring=`<circle cx="${x}" cy="${y}" r="10.5" fill="none" stroke="#7a5a18" stroke-width="2.6"/><circle cx="${x}" cy="${y}" r="10.5" fill="none" stroke="#f0d58a" stroke-width="1"/>`;
    else if(own)ring=`<circle cx="${x}" cy="${y}" r="10.5" fill="none" stroke="${rcol(own)}" stroke-width="2.4" stroke-dasharray="3 2"/><text x="${x+11}" y="${y-7}" font-size="8.5" font-weight="800" fill="${rcol(own)}">${rivalById(own).name[0]}</text>`;
    nodes+=`<g class="cnode" data-c="${k}" style="cursor:pointer"><circle cx="${x}" cy="${y}" r="17" fill="transparent"/>
      ${here?`<circle cx="${x}" cy="${y}" r="12" fill="none" stroke="#9a2f35" stroke-width="1.6"><animate attributeName="r" values="9;15;9" dur="1.8s" repeatCount="indefinite"/></circle>`:''}
      ${ring}<circle cx="${x}" cy="${y}" r="6.5" fill="${f}" stroke="#2b2117" stroke-width="1.2"/>
      ${here?`<text x="${x}" y="${y-14}" text-anchor="middle" font-size="12" fill="#9a2f35" font-weight="800">♪</text>`:''}
      <text x="${x}" y="${y+18}" text-anchor="middle" font-size="10" fill="#2b2117" font-weight="700" font-family="Shippori Mincho B1,serif">${c.name}${ppl?` <tspan fill="#9a2f35">${'•'.repeat(Math.min(ppl,4))}</tspan>`:''}</text></g>`;}
  const d=ymd(G.month);
  return `<div id="mapWrap"><svg id="map" viewBox="0 0 360 300">${staff}
    <text x="10" y="22" font-family="Cormorant Garamond,serif" font-style="italic" font-size="13" fill="#6d5a3e">Europa Musicalis, Anno ${d.y}</text>${routes}${nodes}</svg></div>
    <div class="legend">${['古典','ロマン','名人芸'].map(f=>`<span class="d" style="--c:${FCSS[f]}">${flab(f)}</span>`).join('')}<span>◎ あなたの支配</span>${rivalsActive().map(r=>`<span class="r" style="--c:${rcol(r.id)}">${r.name}陣営</span>`).join('')}<span style="color:#d77">• 音楽家</span></div>`;
}
function personHTML(c,mode){
  const isCity=mode==='city',rv=!isCity&&G.charOwner[c.id];
  const tr=(G.trust[c.id]||0)-(rv?40:0),L=c.lv,gate=gateFor(c);
  const bar=tr>=0?`<i style="left:50%;width:${Math.min(tr,100)/2}%;background:var(--gold)"></i>`:`<i style="left:${50+Math.max(tr,-100)/2}%;width:${-Math.max(tr,-100)/2}%;background:#c33"></i>`;
  const fc=FCSS[c.faction];
  return `<div class="person">${portrait(c.id,46,fc)}
    <div class="pinfo"><div class="pname">${c.name}<span class="lat">${c.lat}</span>${c.drift?'<span class="tag">時代越境</span>':''}${rv?`<span class="tag rv" style="--c:${rcol(rv)}">${rivalById(rv).name}陣営</span>`:''}</div>
      <div class="pmeta">${isCity?c.sub:SL(c.seat)}・Lv${L}・<span style="color:${fc}">${flab(c.faction)}</span>${gate?'・<span style="color:#e77">格上</span>':''}</div>
      <div class="trust">${bar}</div></div>
    <div class="pbtns"><button class="btn gold" data-p="${c.id}" ${P().stamina<10?'disabled':''}>${rv?'引き抜く':'説得'}</button>

   [{t:'出発',cls:'gold',dis:P().money<cost,f(){P().money-=cost;P().city=k;addLog(`${c.name}へ移った。`);endAction(mo);window.scrollTo(0,0);}},{t:'やめる'}]);

/* ======================= 説得 ======================= */
let S=null;
function openPersuade(t){
  if(gateFor(t)){modal('門前払い',`<b>${t.name}</b>「格が違う。名を上げてから出直してきたまえ。」<br><br><span style="font-size:12.5px">音楽家は相手のLvが自分の名声Lv+1を超えると（劇場・宮廷は+2）、話を聞いてもらえません。演奏会で名声を上げましょう。</span>`);return;}
  ac();const rv=!t.isCity&&G.charOwner[t.id];
  const ally=!t.isCity&&allyOf(t.id);
  S={t,rv,ally,meter:clamp((G.trust[t.id]||0)-(rv?40:0)+(ally?25:0),-60,85),round:0,max:8,insp:G.salonInsp||0,last:null,busy:false,done:false};
  G.salonInsp=0;
  $('#scene').innerHTML=`<div class="sc"><h3>${rv?'引き抜き':'説得'}</h3><div class="subt">Persuasione</div>
    <div class="vs"><div class="side">${portrait(G.pid,72,'var(--gold)')}<div>${P().name}</div></div><div class="mid">vs</div>
      <div class="side">${portrait(t.id,72,FCSS[t.faction])}<div>${t.name}<br><span style="font-size:11px;color:var(--mute)">Lv${t.lv}・${flab(t.faction)}</span></div></div></div>
    <div class="meter"><div class="c0"></div><div class="ndl" id="ndl"></div></div><div class="mlab"><span>決裂</span><span>共鳴度</span><span>心服</span></div>
    <div class="bubbles" id="bubs"></div>
    <div class="insp" id="insp"><i id="inspI"></i></div><div class="mlab"><span>霊感</span><span id="inspT"></span></div>
    <div class="cmds" id="cmds">${CMDS.map(c=>`<button class="btn" data-c="${c.k}"><span style="font-family:var(--latin)">${c.ic}</span> ${c.t}<small>${c.k==='fee'?feeCost(t)+'fr':c.d}${likeMark(t,c.k)}</small></button>`).join('')}
      <button class="btn gold" id="cad">カデンツァ<small>霊感満タンで</small></button></div>
    ${!t.isCity&&!isScouted(t.id)?'<div class="pmeta" style="margin-top:6px">※下見していないので、どの口説き方が効いたか分からない。</div>':''}<div class="rinfo"><span id="rnd"></span><button class="btn" id="quit" style="padding:3px 10px;font-size:12px">引き下がる</button></div></div>`;
  $('#scene').classList.remove('hidden');$('#scene').scrollTop=0;
  document.querySelectorAll('#cmds [data-c]').forEach(b=>b.onclick=()=>doCmd(b.dataset.c));
  $('#cad').onclick=cadenza;$('#quit').onclick=()=>finish('hold');
  if(S.ally)setTimeout(()=>bub('you',`（${S.ally.name}が口添えしてくれた：「${t.name}、この人は信頼できる」）`,25,'weak','盟友の口添え +25'),300);
  bub('them',t.isCity?`${t.sub}「ご用件は手短に。」`:rv?`「${rivalById(rv).name}先生を裏切れと？」`:`「${t.quip}」`,0,'');
  upd();
}
const feeCost=t=>80*t.lv;
function cmdPower(k,t){
  const L=plv();
  switch(k){
    case'fee':return(20+t.lv*2)*(teamHas('persuade')?1.4:1);
    case'scandal':return 10+L*3;
    case'theory':return 6+P().theory*2.6;
    case'fame':return Math.max(4,8+(L-t.lv)*6+L*2);
    case'passion':return(8+P().expr*2.4)*factionMult(P().faction,t.faction);
  }
}
function lineFor(k,t){
  if(k==='fee')return(t.feeLine||pick(PLINES.fee)).replace('{fee}',fmt(feeCost(t)));
  if(k==='fame')return pick(PL().fame);
  return pick(PLINES[k]);
}
function bub(side,text,val,cls,label){
  const b=document.createElement('div');b.className=`bub ${side} ${cls||''}`;b.style.fontSize=(13+Math.min(Math.abs(val),50)*.17)+'px';
  b.innerHTML=(label?`<span class="k">${label}</span>`:'')+text+(cls==='weak'?'<span class="fx">― 効いている！</span>':cls==='resist'?'<span class="fx">― 響かない…</span>':cls==='back'?'<span class="fx" style="color:#c22">― 逆効果！</span>':'');
  const box=$('#bubs');box.appendChild(b);box.scrollTop=box.scrollHeight;
}
function upd(){
  $('#ndl').style.left=`calc(${50+S.meter/2}% - 2px)`;
  $('#inspI').style.width=S.insp+'%';$('#insp').classList.toggle('full',S.insp>=100);$('#inspT').textContent=Math.round(S.insp)+'%';
  $('#rnd').textContent=`第${Math.min(S.round+1,S.max)}小節／全${S.max}小節　共鳴度 ${Math.round(S.meter)}`;
  const lock=S.busy||S.done;
  document.querySelectorAll('#cmds [data-c]').forEach(b=>{b.disabled=lock||(b.dataset.c==='fee'&&P().money<feeCost(S.t));});
  $('#cad').disabled=lock||S.insp<100;
}
function doCmd(k){
  if(S.busy||S.done)return;const t=S.t;
  let pow=cmdPower(k,t),mult=likesOf(t)[k];
  if(k==='fee')P().money-=feeCost(t);
  if(S.last===k)pow*=.7;
  const val=Math.round(pow*mult*rnd(.85,1.15)*1.15);
  const cls=mult<0?'back':mult>=1.3?'weak':mult<.8?'resist':'';
  bub('you',lineFor(k,t),val,(t.isCity||isScouted(t.id))?cls:'',CMDS.find(c=>c.k===k).t);
  S.sy=(S.sy||0)+val;S.ny=(S.ny||0)+1;S.meter=clamp(S.meter+val,-100,100);S.insp=clamp(S.insp+14+(cls==='weak'?12:0),0,100);S.last=k;S.busy=true;upd();
  if(S.meter>=100)return setTimeout(()=>finish('win'),500);
  if(S.meter<=-100)return setTimeout(()=>finish('break'),500);
  setTimeout(counter,700);
}
function cadenza(){
  if(S.busy||S.done||S.insp<100)return;
  const val=Math.round(40+P().impro*2.2);playMotif(PL().motif,PL().tim);cutin(G.pid,'カデンツァ！','即興で一気に押し切る');
  bub('you','（即興のカデンツァを一気に弾き切る……♪）',val,'weak','カデンツァ');
  S.meter=clamp(S.meter+val,-100,100);S.insp=0;S.busy=true;upd();
  if(S.meter>=100)return setTimeout(()=>finish('win'),900);
  setTimeout(counter,1000);
}
function counter(){
  const t=S.t;const c=Math.round((3+t.lv*2.5+rnd(0,6))*(plv()>=t.lv?.85:1)*DF().ct*1.1);
  bub('them',`「${pick(t.isCity?CLINES.city:CLINES[t.faction])}」`,c,'',t.name);
  S.st=(S.st||0)+c;S.nt=(S.nt||0)+1;S.meter=clamp(S.meter-c,-100,100);S.round++;S.busy=false;upd();
  if(S.meter<=-100)return setTimeout(()=>finish('break'),500);
  if(S.round>=S.max)return setTimeout(()=>finish('hold'),500);
}
function finish(r){
  if(S.done)return;S.done=true;upd();const t=S.t;
  if(r==='win'){
    delete G.trust[t.id];addXP(15+t.lv*5);
    if(t.isCity){G.owner[t.city]='player';G.cityF[t.city]=P().faction;addLog(`${t.name}を掌握した！ ${ci(t.city).name}が支配下に入った。`);playMotif('fanfare','piano');
      modal('都市を掌握',`<b>${t.name}</b>があなたの後ろ盾となった。<br>毎月 <b>+${ci(t.city).size*80}フラン</b>の収入が入ります。`,[{t:'次の月へ',f(){closeScene();endAction();}}]);}
    else{contract(t,S.rv);}
  }else if(r==='break'){
    G.trust[t.id]=-30;const canDuel=!t.isCity&&!S.rv&&(t.duel||OPP[P().faction]===t.faction);
    addLog(`${t.name}との交渉が決裂した。`);
    modal('決裂',`${t.name}「話にならない。帰ってくれたまえ。」${pAnalysis(t)}${canDuel?'<br><br>……言葉で駄目なら、<b>音で分からせる</b>しかない。':''}`,
      canDuel?[{t:'演奏で分からせる',cls:'crim',dis:P().stamina<20,f(){openDuel(t);}},{t:'引き下がる',f(){closeScene();endAction();}}]:[{t:'次の月へ',f(){closeScene();endAction();}}]);
  }else{
    G.trust[t.id]=Math.round((S.meter+(S.rv?40:0))*.6);
    modal('保留',`${t.name}「少し考えさせてほしい。」${pAnalysis(t)}<br>共鳴度は <b>${Math.round(S.meter*.6)}</b> 前後から再開できます。`,[{t:'次の月へ',f(){closeScene();endAction();}}]);
  }
}

function openDuel(t,opts){
  ac();opts=opts||{};D={t,opts,mv:0,you:0,them:0,piece:null,log:[]};
  const judge=ci(t.city).judge;
  $('#scene').innerHTML=`<div class="sc"><h3>${opts.title||'演奏対決'}</h3><div class="subt">Duello musicale — ${ci(t.city).name}</div>

    <div class="side">${portrait(t.id,72,FCSS[t.faction])}<div>${t.name}<br><span style="font-size:11px;color:var(--mute)">Lv${t.lv}</span></div></div></div>
    <div class="tell">審判：<b>${judge}</b><br>相手の曲目：「${t.piece}」（得意：${CARD[t.style].t}）</div>
    ${G.members.length?`<div class="sec-t">— セコンド（舞台袖の助言役）—</div><div class="sec2">${G.members.map(id=>`<button class="btn" data-sec="${id}">${portrait(id,22)}${charById(id).name}<small>${CARD[charById(id).style].t}+${Math.ceil(mlv(id)/2)}</small></button>`).join('')}</div>`:''}

function evalLineup(p,L){
  let sum=0,best=-1,bestV=-99;const notes=[];
  p.slots.forEach((s,i)=>{const id=L[i];if(!id){sum-=6;notes.push(`${s.l}が空席（-6）`);return;}const v=slotVal(id,p);sum+=v;if(v>bestV){bestV=v;best=i;}});
  let q=sum/p.slots.length;
  const ids=L.filter(Boolean).map(realId);if(!ids.includes(G.pid))ids.push(G.pid);
  for(const [a,b,v,l] of SYN)if(ids.includes(a)&&ids.includes(b)){q+=v;notes.push(`${l}（${v>0?'+':''}${v}）`);}
  if(p.by){if(L.filter(Boolean).map(realId).includes(p.by)){q+=6;notes.push('作曲者自身が出演（+6）');}else if(isMember(p.by)||p.by===G.pid){q+=3;notes.push('作曲者が立ち会う（+3）');}}
  const cf=G.cityF[P().city];let mult=1;
  if(p.fav===cf){mult=1.15;notes.push(`${ci(P().city).name}の好みの曲（×1.15）`);}else if(OPP[p.fav]===cf){mult=.85;notes.push(`${ci(P().city).name}の好みに合わない（×0.85）`);}
  q*=mult;
  const stars=q<13?1:q<17?2:q<21?3:q<25?4:5;
  return{q,stars,notes,mvp:best};
}

function autoFill(){
  const p=PR.p;PR.L=p.slots.map(()=>null);const used=new Set();
  const order=p.slots.map((s,i)=>i).sort((a,b)=>candidates(p.slots[a]).length-candidates(p.slots[b]).length);
  for(const i of order){let best=null,bv=-99;for(const id of candidates(p.slots[i])){if(used.has(id))continue;const v=slotVal(id,p);if(v>bv){bv=v;best=id;}}if(best){PR.L[i]=best;used.add(best);}}
}

function pickSlot(i){

function concertResult(p,L,ev){

function candidates(s){const rs=[].concat(s.r);const out=[];if(rs.some(r=>ptypeOf().includes(r)))out.push('you');if(s.you)return out;for(const id of G.members)if(!isAway(id)&&typesOf(id).some(t=>rs.includes(t)))out.push(id);return out;}
function slotVal(id,p,L,i){
  let v=(mstat(id,'tech')*p.w[0]+mstat(id,'expr')*p.w[1]+mstat(id,'impro')*p.w[2])*1.6+mlv(id)+(condOf(id)-1)*3;
  if(id!=='you'){const sk=skillOf(id);if(sk&&sk.k==='self')v+=sk.v;const m=moodOf(id);if(m<40)v-=3;if(hasQ(id,'shy')&&PR&&PR.hall&&PR.hall.tier===2)v-=4;}
  if(L&&i!=null){const st=[].concat(p.slots[i].r);L.forEach((o,j)=>{if(!o||o==='you'||j===i)return;const sk=skillOf(o);if(sk&&sk.k==='section'&&sk.t.some(t=>st.includes(t)))v+=sk.v;});}
  return v;
}
function evalLineup(p,L,opt){
  opt=opt||{};let sum=0;const notes=[],contrib=[];
  p.slots.forEach((s,i)=>{const id=L[i];
    if(opt.standIn===i){sum+=9;return;}
    if(!id){sum-=6;notes.push(`${s.l}が空席（-6）`);contrib.push(null);return;}
    const v=slotVal(id,p,L,i);sum+=v;contrib.push({i,id,v,sk:[]});});
  let q=sum/p.slots.length;
  const on=L.map((id,i)=>opt.standIn===i?null:id).filter(Boolean);
  const ids=on.map(realId);if(!ids.includes(G.pid))ids.push(G.pid);
  for(const [a,b,v,l] of SYN)if(ids.includes(a)&&ids.includes(b)){q+=v;notes.push(`相性《${l}》（${v>0?'+':''}${v}）`);}
  const hall=PR&&PR.hall;
  const cbonus=on.some(id=>id!=='you'&&(skillOf(id)||{}).k==='composer')?2:1;
  if(p.by){if(on.map(realId).includes(p.by)){q+=6*cbonus;notes.push(`作曲者自身が出演（+${6*cbonus}）`);}else if(isMember(p.by)||p.by===G.pid){q+=3*cbonus;notes.push(`作曲者が立ち会う（+${3*cbonus}）`);}}
  for(const id of on){if(id==='you')continue;const sk=skillOf(id);if(!sk)continue;const nm=charById(id).name;let add=0;
    if(sk.k==='form'&&sk.f.includes(p.form))add=sk.v;
    else if(sk.k==='q')add=sk.v;
    else if(sk.k==='city'&&P().city===sk.c)add=sk.v;
    else if(sk.k==='hall'&&hall&&hall.tier===sk.h)add=sk.v;
    if(add){q+=add;notes.push(`★${nm}《${sk.n}》（+${add}）`);const c=contrib.find(x=>x&&x.id===id);if(c){c.v+=add;c.sk.push(sk.n);}}}
  if(hall){const a=hall.aud;if(a==='貴族'&&p.w[1]>=.5){q+=1.5;notes.push('貴族の客は表現豊かな曲を好む（+1.5）');}
    if(a==='市民'&&p.w[0]>=.5){q+=1.5;notes.push('市民の客は技巧の冴えを好む（+1.5）');}
    if(hall.tier===2&&['交響曲','オペラ','楽劇','宗教曲','バレエ'].includes(p.form)){q+=2;notes.push('大劇場に映える大作（+2）');}}
  const cb=chemBonus(L.map((id,i)=>opt.standIn===i?null:id));if(cb.det.length){q+=cb.tot;cb.det.slice(0,4).forEach(d=>notes.push(`連携 ${nameOf(d.a)}×${nameOf(d.b)} ${CMARK(d.cp)}Lv${d.lv}（${d.v>=0?'+':''}${d.v.toFixed(1)}）`));if(cb.det.length>4)notes.push(`ほか連携${cb.det.length-4}組（合計${cb.tot>=0?'+':''}${cb.tot.toFixed(1)}）`);}
  const cf=G.cityF[P().city];let mult=1;
  if(p.fav===cf){mult=1.15;notes.push(`${ci(P().city).name}の好みの曲（×1.15）`);}else if(OPP[p.fav]===cf){mult=.85;notes.push(`${ci(P().city).name}の好みに合わない（×0.85）`);}
  q*=mult;
  const stars=q<13?1:q<17?2:q<21?3:q<25?4:5;
  let mvp=-1,bv=-99;contrib.forEach(c=>{if(c&&c.v>bv){bv=c.v;mvp=c.i;}});
  return{q,stars,notes,mvp,contrib};
}

function autoFill(){
  const p=PR.p;PR.L=p.slots.map(()=>null);const used=new Set();
  const order=p.slots.map((s,i)=>i).sort((a,b)=>candidates(p.slots[a]).length-candidates(p.slots[b]).length);
  for(const i of order){let best=null,bv=-99;for(const id of candidates(p.slots[i])){if(used.has(id))continue;const v=slotVal(id,p);if(v>bv){bv=v;best=id;}}if(best){PR.L[i]=best;used.add(best);}}
}

/* ======================= v5：スカウト・成長タイプ・相性・連携 ======================= */
const GROW={liszt:'early',thalberg:'early',malibran:'early',bellini:'early',viotti:'early',storace:'early',aloysia:'early',stgeorges:'early',sarasate:'early',pasta:'early',patti:'early',
 bruckner:'late',beethoven:'late',haydn:'late',dvorak:'late',franchomme:'late',wagner:'late',tchaikovsky:'late',boehmfl:'late',richter:'late',schumann:'late',clara:'late',joachim:'late',stadler:'late',davydov:'late',muhlfeld:'late'};
const GLBL={early:'早熟',normal:'普通',late:'晩成'};
const growOf=id=>GROW[id]||'normal';
function potOf(id){const c=charById(id);if(!c)return 3;let h=0;for(const ch of id)h=(h*31+ch.charCodeAt(0))%97;return clamp(c.lv-2+(h%3),2,7);}
function ens5(){G.exp=G.exp||{};G.chem=G.chem||{};G.scout=G.scout||[];G.sal=G.sal||{};G.decl=G.decl||{};}
const isScouted=id=>{ens5();return G.scout.includes(id)||isMember(id);};
function phaseMult(id){const g=growOf(id),m=G.month;if(g==='early')return m<36?2:m<60?1:.3;if(g==='late')return m<30?.5:1.8;return 1;}
function gainExp(id,base){
  ens5();const c=charById(id);if(!c)return null;
  G.exp[id]=(G.exp[id]||0)+base*phaseMult(id);
  if(G.exp[id]>=30){G.exp[id]-=30;const pot=potOf(id);if((G.boost[id]||0)<pot){G.boost[id]=(G.boost[id]||0)+1;return`${c.name}（全能力+1）`;}}
  return null;
}
function growthMonthly(){
  ens5();if(G.month<60)return;
  for(const id of G.members){if(growOf(id)!=='early')continue;const last=G.decl[id]||0;
    if(G.month-Math.max(60,last)>=18||(!last&&G.month===60)){G.decl[id]=G.month;G.boost[id]=Math.max(-3,(G.boost[id]||0)-1);addLog(`《早熟》${charById(id).name}に衰えが見え始めた（全能力-1）。`);}}
}
/* ---- 相性 ---- */
function hash2(a,b){const s=[a,b].sort().join('|');let h=7;for(const ch of s)h=(h*131+ch.charCodeAt(0))%1009;return h;}
function compat(a,b){
  if(a==='you')a=G.pid;if(b==='you')b=G.pid;
  for(const [x,y,v] of SYN)if((x===a&&y===b)||(x===b&&y===a))return v>0?2:v<0?-2:0;
  const A=charById(a)||(a===G.pid?{faction:P().faction}:null),B=charById(b)||(b===G.pid?{faction:P().faction}:null);
  let s=0;if(A&&B){if(A.faction===B.faction)s+=.6;else if(OPP[A.faction]===B.faction)s-=.8;}
  if(hasQ(a,'temper')&&hasQ(b,'temper'))s-=1;if(hasQ(a,'diva')&&hasQ(b,'diva'))s-=1.2;
  if(hasQ(a,'loyal')||hasQ(b,'loyal'))s+=.4;
  s+=((hash2(a,b)%5)-2)*.45;
  return s>=.9?1:s<=-.9?-1:0;
}
const CMARK=v=>v>=2?'<span style="color:#7fe0b0">◎</span>':v===1?'<span style="color:#a8e0c8">○</span>':v<0?'<span style="color:#f88">✕</span>':'<span style="color:#aaa">－</span>';
const CLBL=v=>v>=2?'名コンビ':v===1?'相性良し':v<0?'相性悪し':'ふつう';
/* ---- 連携 ---- */
const ckey=(a,b)=>[a==='you'?G.pid:a,b==='you'?G.pid:b].sort().join('|');
function chemLv(a,b){ens5();return Math.min(5,Math.floor((G.chem[ckey(a,b)]||0)/2));}
function pairs(L){const on=L.filter(Boolean);const out=[];for(let i=0;i<on.length;i++)for(let j=i+1;j<on.length;j++)out.push([on[i],on[j]]);return out;}
function chemBonus(L){
  let tot=0;const det=[];
  for(const [a,b] of pairs(L)){const lv=chemLv(a,b),cp=compat(a,b);let v=lv*(cp>0?.6:cp<0?.3:.45);if(cp<0)v-=1.5;tot+=v;if(lv>0||cp!==0)det.push({a,b,lv,cp,v});}
  return{tot,det:det.sort((x,y)=>Math.abs(y.v)-Math.abs(x.v))};
}
function chemAfter(L){
  ens5();const ups=[];
  for(const [a,b] of pairs(L)){const k=ckey(a,b),cp=compat(a,b),before=chemLv(a,b);G.chem[k]=(G.chem[k]||0)+(cp>0?2:cp<0?.5:1);const after=chemLv(a,b);
    if(after>before)ups.push(`${nameOf(a)}×${nameOf(b)} 連携Lv${after}`);
    if(cp<0){for(const x of [a,b])if(x!=='you')setMood(x,moodOf(x)-3);}}
  return ups;
}

function feeOf(id){const c=charById(id);return Math.round(c.lv*c.lv*80*(hasQ(id,'star')?1.5:1)*(hasQ(id,'greedy')?1.3:1));}
function demandOf(id){const c=charById(id);return Math.round(c.lv*25*(hasQ(id,'greedy')?1.6:1)*(hasQ(id,'star')?1.3:1));}
const salaryOf=id=>{ens5();return G.sal[id]!=null?G.sal[id]:demandOf(id);};
function gateFor(t){const g=DF().gate||0;if(t.isCity)return t.lv>plv()+2+g;return t.lv>plv()+1+g;}
function likeMark(t,k){if(t.isCity||!isScouted(t.id))return'';const v=likesOf(t)[k];return v<0?' ✕':v>=1.3?' ◎':v<.8?' △':' ○';}
function scoutInfo(id){
  const c=charById(id),lk=likesOf(c);
  const mem=G.members.filter(x=>x!==id).map(x=>{const v=compat(id,x);return v!==0?`${charById(x).name}${CMARK(v)}`:'';}).filter(Boolean);
  return `<div class="scout"><b>スカウト・レポート</b><br>
   効く口説き方：${CMDS.map(k=>`${k.t}${likeMark(c,k.k)}`).join('　')}<br>
   成長タイプ：<b>${GLBL[growOf(id)]}</b>　伸びしろ：${'★'.repeat(potOf(id))}<br>
   契約金：<b>${fmt(feeOf(id))}fr</b>　年俸要求：月${fmt(demandOf(id))}fr<br>
   楽団員との相性：${mem.length?mem.join('　'):'特になし'}</div>`;
}
function scout(id){
  const c=charById(id);
  if(isScouted(id)){modal(`${c.name}のスカウト・レポート`,portraitRow(id)+scoutInfo(id));return;}
  modal(`${c.name}を下見する`,`${portraitRow(id)}演奏会に足を運び、人柄や好み、伸びしろ、契約条件を調べます。<br>費用：150fr・体力-5（月は進みません）`,
   [{t:'下見する',cls:'gold',dis:P().money<150||P().stamina<5,f(){P().money-=150;P().stamina-=5;ens5();G.scout.push(id);save();render();modal(`${c.name}のスカウト・レポート`,portraitRow(id)+scoutInfo(id));}},{t:'やめる'}]);
}
function contract(t,rv){
  const fee=feeOf(t.id),dem=demandOf(t.id);
  const join=(sal,fe)=>{ens5();P().money-=fe;G.sal[t.id]=sal;if(rv){delete G.charOwner[t.id];addLog(`${rivalById(rv).name}陣営から${t.name}を引き抜いた！`);}
    G.members.push(t.id);setMood(t.id,sal<dem?55:72);addLog(`${t.name}と契約。楽団に加わった（${SL(t.seat)}・月${fmt(sal)}fr）。`);playMotif(t.motif,t.tim);cutin(t.id,'契約成立！',`${t.name}が${SL(t.seat)}として加入`);
    modal(`${t.name}、加入`,`「${t.join}」<br><br><b>${SL(t.seat)}</b>として楽団に加わった。<br>契約金 ${fmt(fe)}fr／年俸 月${fmt(sal)}fr${skillOf(t.id)?`<br><span class="sk">★${skillOf(t.id).n}</span> ${skillOf(t.id).d}`:''}`,[{t:'次の月へ',f(){closeScene();endAction();}}]);};
  G.trust[t.id]=60;
  modal(`${t.name}との契約交渉`,`${portraitRow(t.id)}${t.name}は心を動かされた。あとは条件次第だ。<br><br>契約金：<b>${fmt(fee)}fr</b><br>年俸：<b>月${fmt(dem)}fr</b>${hasQ(t.id,'greedy')?'（守銭奴なので高め）':''}<br><span class="pmeta">いまの資金：${fmt(P().money)}fr</span>`,
   [{t:'条件をのむ',cls:'gold',dis:P().money<fee,f(){delete G.trust[t.id];join(dem,fee);}},
    {t:'値切る<small>半々の賭け。成功で契約金3割引・年俸2割引、失敗で交渉決裂</small>',dis:P().money<fee*.7,f(){if(Math.random()<(hasQ(t.id,'greedy')||hasQ(t.id,'diva')?.3:.55)){delete G.trust[t.id];join(Math.round(dem*.8),Math.round(fee*.7));}else{G.trust[t.id]=-20;addLog(`${t.name}との値切り交渉が決裂した。`);modal('交渉決裂',`${t.name}「私を安く見ないでいただきたい」`,[{t:'次の月へ',f(){closeScene();endAction();}}]);}}},
    {t:'見送る<small>共鳴度60で次回から再開</small>',f(){closeScene();endAction();}}]);
}
function chemList(){ens5();const ids=['you'].concat(G.members);const rows=[];for(const [a,b] of pairs(ids)){const lv=chemLv(a,b),cp=compat(a,b);if(lv>0||cp!==0)rows.push({a,b,lv,cp});}
  rows.sort((x,y)=>y.lv-x.lv||y.cp-x.cp);if(!rows.length)return'';
  return`<div class="sec-t">相性と連携</div>${rows.slice(0,14).map(r=>`<div style="font-size:12.5px;color:#d8c9a8">${CMARK(r.cp)} ${nameOf(r.a)}×${nameOf(r.b)}：${CLBL(r.cp)}${r.lv?`・<b style="color:var(--gold2)">連携Lv${r.lv}</b>`:''}</div>`).join('')}`;}

function hpush(s){G.hist=G.hist||[];const d=ymd(G.month);G.hist.push({d:`${d.y}.${d.mo}`,s});if(G.hist.length>400)G.hist.shift();}
function hallLoad(){try{return JSON.parse(localStorage.getItem('concertoStormHall')||'[]');}catch(e){return[];}}
function hallSave(a){try{localStorage.setItem('concertoStormHall',JSON.stringify(a.slice(0,30)));}catch(e){}}
function bestPair(id){ens5();let best=null,bl=0;for(const k in G.chem){const [a,b]=k.split('|');if(a!==id&&b!==id)continue;const lv=Math.min(5,Math.floor(G.chem[k]/2));if(lv>bl){bl=lv;best=a===id?b:a;}}return best?{id:best,lv:bl}:null;}
const nameAny=id=>id===G.pid?P().name:(charById(id)||{}).name||id;
function buildReport(){
  ens();ens5();
  const d0=ymd(0),d1=ymd(G.month),E=LASTEND||{title:'未完',txt:'',win:false};
  const cons=(G.cons||[]).slice();
  const mvpc={};cons.forEach(c=>{if(c.mvpId)mvpc[c.mvpId]=(mvpc[c.mvpId]||0)+1;});
  const ids=Array.from(new Set(G.members.concat(G.alumni||[])));
  const members=ids.filter(id=>charById(id)).map(id=>{const c=charById(id);const bp=bestPair(id);
    return{id,name:c.name,seat:SL(c.seat),bond:G.bond[id]||0,mvp:mvpc[id]||0,boost:G.boost[id]||0,stay:G.members.includes(id),dead:(G.dead||[]).includes(id),pair:bp?{name:nameAny(bp.id),lv:bp.lv}:null,skill:(skillOf(id)||{}).n||''};})
    .sort((a,b)=>b.mvp-a.mvp||b.bond-a.bond);
  const top=cons.slice().sort((a,b)=>b.s-a.s||b.inc-a.inc).slice(0,5);
  const rev=cons.reduce((a,c)=>a+c.inc,0);
  const cities=myCities().map(k=>ci(k).name);
  const star=members[0];
  let pairTop=null;for(const k in G.chem){const lv=Math.min(5,Math.floor(G.chem[k]/2));if(!pairTop||lv>pairTop.lv){const [a,b]=k.split('|');pairTop={a:nameAny(a),b:nameAny(b),lv};}}
  const orch=`${P().name}管弦楽団`;
  let epi='';
  if(E.win){epi=`${d1.y}年${d1.mo}月、${orch}は伝説の大演奏会を成功させた。`;}
  else epi=`${d1.y}年${d1.mo}月、${orch}の物語は「${E.title}」で幕を閉じた。${E.txt}`;
  if(cities.length)epi+=`楽団は${cities.join('、')}を拠点とした。`;
  if(star&&star.mvp)epi+=`楽団の顔は${star.name}で、${star.mvp}回MVPに輝いた。`;
  if(pairTop&&pairTop.lv>=3)epi+=`${pairTop.a}と${pairTop.b}の息の合った演奏は「伝説のコンビ」と語り継がれた（連携Lv${pairTop.lv}）。`;
  if(cons.length)epi+=`開いた演奏会は${cons.length}回、入場料の総額は${fmt(rev)}フランにのぼった。`;
  if(E.win)epi+=AFTER[G.sc]||'';
  const R={id:Date.now(),played:new Date().toISOString().slice(0,10),sc:G.sc,scTitle:`${SC.year}年 ${SC.title}`,period:`${d0.y}年${d0.mo}月〜${d1.y}年${d1.mo}月`,
    pid:G.pid,pname:P().name,diff:DF().n,result:E.title,win:!!E.win,score:score(),orch,lv:plv(),money:Math.round(P().money),
    hist:(G.hist||[]).slice(),members,cities,top,concerts:cons.length,rev,epi,note:HISTNOTE[G.pid]||''};
  return R;
}
function saveReport(){
  if(G.reportId){const h=hallLoad().find(r=>r.id===G.reportId);if(h)return h;}
  const R=buildReport();G.reportId=R.id;save();
  const a=hallLoad();a.unshift(R);hallSave(a);return R;
}
function reportText(R){
  const L=[`『${R.orch}史』`,`${R.scTitle}／${R.period}`,`結末：${R.result}（スコア${R.score}・難易度${R.diff}）`,'','■ その後',R.epi,R.note?'【史実】'+R.note:'','','■ 年表'];
  R.hist.forEach(h=>L.push(`${h.d}　${h.s}`));
  L.push('','■ 楽団の顔ぶれ');R.members.forEach(m=>L.push(`${m.name}（${m.seat}）出演${m.bond}回・MVP${m.mvp}回${m.boost?`・成長${m.boost>0?'+':''}${m.boost}`:''}${m.pair?`・名コンビ：${m.pair.name}（連携Lv${m.pair.lv}）`:''}${m.dead?'・在籍中に逝去':!m.stay?'・退団':''}`));
  L.push('','■ 名演の記録');R.top.forEach(c=>L.push(`${c.d}　${c.t}（${c.h}）${'★'.repeat(c.s)}　MVP：${c.mvp||'-'}`));
  return L.filter(x=>x!==undefined).join('\n');
}

const beatBy=k=>Object.keys(BEATS).find(c=>BEATS[c]===k);

    <div class="pmeta" style="margin-top:6px">ルール：相性で勝っていれば勝ち。ただし相手の力が5以上高いと覆される。同じカード同士は力の勝負。どちらにも「その場の出来」が0〜3加わる。</div>

function resolve(y){

   <br>${t.name} ${fmtParts(tp)}＋出来${rt.toFixed(1)}＝<b>${ts.toFixed(1)}</b>
   <br>判定：${how}<br><span class="pmeta">${ci(t.city).judge}：${cm}</span>`);
  D.mv++;

function duelAnalysis(won){
  const r=D.rec||[],t=D.t,out=[];
  const ay=avg(r.map(x=>x.yp)),at=avg(r.map(x=>x.tp));
  if(won){
    const rps=r.filter(x=>x.win&&x.type==='rps').length,up=r.filter(x=>x.win&&x.type==='upset').length;
    if(rps)out.push(`相性で上回った楽章が${rps}つ。`);if(up)out.push(`力の差で相性の不利を覆した楽章が${up}つ。`);
    if(D.second)out.push(`セコンドの${charById(D.second).name}が効いた。`);
    out.push(`力の平均：あなた${ay.toFixed(1)}／相手${at.toFixed(1)}。`);
    return`<div class="anl"><b>勝因</b><br>${out.join('<br>')}</div>`;
  }
  const lost=r.filter(x=>!x.win);
  const rpsL=lost.filter(x=>x.type==='rps'),upL=lost.filter(x=>x.type==='upset'),tieL=lost.filter(x=>x.type==='tie');
  if(rpsL.length){const lied=rpsL.filter(x=>!x.tellTrue).length,ignored=rpsL.filter(x=>x.tellTrue&&!x.followed).length;
    out.push(`・<b>相性負けが${rpsL.length}回</b>。${ignored?`本当だった予兆に逆らったのが${ignored}回。`:''}${lied?`予兆が嘘だった不運が${lied}回。`:''}`);}
  if(upL.length)out.push(`・<b>相性では勝ったのに力で覆されたのが${upL.length}回</b>。相手の力が5以上高かった。`);
  if(tieL.length)out.push(`・<b>同じカード同士の力勝負で${tieL.length}回負けた</b>。`);
  out.push(`・力の平均：あなた${ay.toFixed(1)}／${t.name}${at.toFixed(1)}${at-ay>=2?'。地力で劣っている':''}。`);
  const tips=[];
  tips.push(`${t.name}の得意は「${CARD[t.style].t}」で、半々の確率で出してくる。迷ったら「${CARD[beatBy(t.style)].t}」が安全。`);
  if(at-ay>=2)tips.push('演奏会で名声Lvを上げると、技巧・表現・即興がLvごとに+1される。');
  if(!D.second&&G.members.length)tips.push('セコンドを付けていなかった。付けるとその人の得意カードが強くなる。');
  if(D.second)tips.push(`セコンドの得意は「${CARD[charById(D.second).style].t}」だけに効く。相手に合わせて選び直そう。`);
  tips.push(`課題曲は得意カードに+2。第2楽章は表現、第3楽章は技巧に+2が付く。`);
  return`<div class="anl"><b>敗因</b><br>${out.join('<br>')}<br><b>次への助言</b><br>${tips.map(x=>'・'+x).join('<br>')}</div>`;
}

function howto(){return `<details class="card howto" style="margin-top:12px"><summary style="color:var(--gold2)">遊び方</summary><ol>

  <li>霊感が満タンになったら<b>カデンツァ</b>で大きく押せます。サロンに出ておくと、霊感を溜めた状態で始められます。</li>
  <li>交渉が決裂したら<b>演奏対決</b>で分からせることも。技巧・表現・即興の三すくみです。</li>

  <li>格上（相手のLvが自分の名声Lv+2より上）には門前払い。演奏会で名声を上げましょう。</li>
  <li>会場は<b>サロン・中ホール・大劇場</b>から選ぶ。大きいほど儲かるが空席も出やすい。客の反応（ブラヴォー、花束、失神、ブーイング、居眠り、退席）は評判しだい。</li>
  <li>楽団員にはそれぞれ<b>★特技</b>（客入り+20%、弦の力+3、レッスン収入など）と<b>個性</b>（病弱、守銭奴、気難しい、恋多き…）がある。満足度が下がると退団やライバルへの移籍も。盟友が楽団にいると説得で口添えしてくれる。</li>
  <li><b>スカウト</b>：まず🔍下見（150fr）で口説き方の効き目・成長タイプ（早熟／普通／晩成）・伸びしろ・契約条件・相性を調べる。下見なしだと、どの手が効いたか分からない。口説き落としたら契約金と年俸の交渉（値切りは賭け）。</li>
  <li><b>連携と相性</b>：一緒に出演するほど2人の連携Lvが上がり評判が伸びる。相性◎○の2人は早く育ち、✕の2人は足を引っ張り合い満足度も下がる。</li>
  <li><b>成長タイプ</b>：早熟は序盤によく伸びるが5年目から衰え、晩成は2年半を過ぎてから大きく伸びる。</li>
  <li>勝利条件を満たすと<b>最終決戦</b>（三番勝負）。勝てば大演奏会へ。</li>
  <li><b>演奏会</b>では演目を選び、サッカーの布陣のように各パートに楽団員を配置します。この曲に向く能力、毎月変わる調子、史実の名コンビ（相性）、作曲者の立ち会い、街の好みで評判（★）が決まります。</li>
  <li>演奏対決では楽団員を<b>セコンド</b>に付けると、その人の得意カードが強くなります。</li>
  <li>難易度は入門・普通・難しい・超難しい・地獄の5段階。勝利条件（支配都市と埋める席の数）と期限は難易度で変わる。都市を増やすほど、残りの都市の劇場・宮廷は警戒して格が上がる。</li>

  on('#uDev',()=>{P().money-=300;if(Math.random()<.3){save();render();return modal('工房から','届いたのは……ただの譜面台だった。');}
    const pool=ueqPool();const w=pool.map(k=>1/(UEQ[k].r>=5?4:UEQ[k].r>=4?2:1));let y=Math.random()*w.reduce((a,b)=>a+b,0),q=pool[0];for(let i=0;i<pool.length;i++){y-=w[i];if(y<=0){q=pool[i];break;}}
    newUEq(q);addLog(`楽器工房から${UEQ[q].n}が届いた。`);save();render();modal('工房から届いた！',`<b>${UEQ[q].n}</b>　${'★'.repeat(UEQ[q].r)}<br>${ueqTxt(q)}${UEQ[q].h?`<div class="trivia">${UEQ[q].h}</div>`:''}`);});
  on('#uInv',uInvite);

}
function ueqTxt(id){const e=UEQ[id];return['tech','expr','impro','def'].filter(k=>e[k]).map(k=>`${{tech:'技巧',expr:'表現',impro:'即興',def:'守り'}[k]}+${e[k]}`).join(' ')+`・${e.t.includes('*')?'全員':e.t.map(t=>U_TN[t]).join('／')}`;}

function uDetail(id){

   <span class="pmeta">技巧${st('tech')} 表現${st('expr')} 即興${st('impro')} 楽理${st('theory')}・守り${udef(id)}</span><br><span class="pmeta">気力 ${Math.round(uhp(id))}/${umax(id)}</span></div></div>
   ${sk?`<div class="pmeta" style="margin-top:4px"><span class="sk">★${sk.n}</span>${sk.d}</div>`:''}
   ${id!=='you'&&(QUIRK[realId(id)]||[]).length?`<div class="qrow">${QUIRK[realId(id)].map(q=>`<span class="qk q-${q}">${QDEF[q]||q}</span>`).join('')}</div>`:''}${id!=='you'&&charById(id)&&charById(id).trivia?`<div class="pmeta" style="margin-top:4px">${charById(id).trivia}</div>`:''}

  if(!u.kai)btns.push({t:`開眼させる<small>${ulv(id)>=20?'1,500fr':'Lv20で解放'}</small>`,cls:ulv(id)>=20?'gold':'',dis:ulv(id)<20||P().money<1500,f(){P().money-=1500;u.kai=1;u.hp=umax(id);addLog(`${nameOf(id)}が芸の境地に開眼した。`);hpush(`${nameOf(id)}、開眼`);cutin(realId(id),'開眼！',`${nameOf(id)}、新たな境地へ`);save();render();}});
  if(id!=='you')btns.push({t:'語らう<small>話を聞く・満足+2（月1回）</small>',f(){uTalk(id);}});
  btns.push({t:'閉じる'});modal(nameOf(id),body,btns);
}
function uTalk(id){
  const c=charById(id),u=ux(id),m=moodOf(id);G.talk=G.talk||{};const first=G.talk[id]!==G.month;
  const lines=[c.quip,c.trivia,`得意なのは${c.piece}。いつかあなたの楽団で、最高の形で弾きたい。`];
  if(u.lv>=20)lines.push('このごろ、音が自分の手を離れて鳴るような気がするんだ。');
  if(u.kai)lines.push('開眼してから、聴衆の呼吸までわかるようになった。');
  if(guestEra(id))lines.push(`${U_ERA[guestEra(id)]}の仲間たちが、この時代の音楽を聴いたらどう言うだろう。`);
  if(m<45)lines.push('……少し疲れている。給金のことも、考えてもらえないだろうか。');else if(m>=85)lines.push('いまの楽団は最高だ。どこへでもついていくよ。');
  if(first){G.talk[id]=G.month;setMood(id,m+2);}
  const real=realId(id);modal(`${c.name}との語らい`,`${portraitRow(real)}「${pick(lines)}」`,[{t:'♪ 一節を聴く',f(){playMotif(c.motif,c.tim);uTalk(id);}},{t:'戻る',f(){uDetail(id);}}]);
}
function bowed(id){return typesOf(id).some(t=>['vn','vc','cb'].includes(t));}
function slotLabel(id,i){const t=typesOf(id)[0];if(i===0)return t==='cond'?'指揮棒':t==='comp'?'筆と譜面':t==='voice'?'舞台衣装':'楽器';if(i===1)return bowed(id)?'弓':'小物';return'小物';}
function slotOK(id,i,e){const c=UEQ[e.id].cat||'acc';if(i===0)return c==='inst';if(i===1)return bowed(id)?c==='bow':c==='acc';return c==='acc';}
function uEquip(id,i){
  const types=typesOf(id);const used=new Set(Object.keys(G.ux).filter(x=>x!==id&&(x==='you'||G.members.includes(x))).flatMap(x=>G.ux[x].eq).filter(Boolean));
  const u=ux(id);const ok=G.ueq.filter(e=>(!used.has(e.uid)&&!u.eq.some((q,j)=>j!==i&&q===e.uid))&&slotOK(id,i,e)&&(UEQ[e.id].t.includes('*')||UEQ[e.id].t.some(t=>types.includes(t))));
  modal(`${slotLabel(id,i)}を選ぶ`,ok.length?'この枠に合うものだけ表示しています。':'合うものがありません。楽器商や楽器工房で手に入れましょう。',
    ok.map(e=>({t:`${eqName(e)}<small>${ueqTxt(e.id)}${UEQ[e.id].h?`<br>${UEQ[e.id].h}`:''}</small>`,f(){u.eq[i]=e.uid;save();render();uDetail(id);}})).concat([{t:'外す',f(){u.eq[i]=null;save();render();uDetail(id);}},{t:'戻る',f(){uDetail(id);}}]));
}
function uInvite(){
  const cand=[];for(const s of Object.keys(SCEN)){if(s===G.sc)continue;for(const c of SCEN[s].chars.concat(SCEN[s].rivals).concat(Object.keys(SCEN[s].players).map(id=>guestSrc(s,id)))){if(Math.max(UHIST[c.id]||0,c.lv>=7?5:c.lv>=6?4:c.lv===5?3:c.lv===4?2:1)<3||cand.some(x=>x.c.id===c.id)||SC.chars.some(x=>x.id===c.id)||c.id===G.pid)continue;if(Object.values(SCEN).some(S=>Object.keys(S.players||{}).includes(c.id))&&false)continue;cand.push({c,s});}}
  const h=hashS(String(G.month)+G.pid);const hr=c=>Math.max(UHIST[c.id]||0,c.lv>=7?5:c.lv>=6?4:c.lv===5?3:c.lv===4?2:1);const list=cand.sort((a,b)=>((hashS(a.c.id)+h)%97)-((hashS(b.c.id)+h)%97)).slice(0,8).sort((a,b)=>hr(b.c)-hr(a.c));

    G.uinv--;G.guests.push({id:c.id,era:s,city:P().city});syncGuests();ens5();G.members.push(c.id);G.sal[c.id]=demandOf(c.id);setMood(c.id,80);
    addLog(`時を越える招待状に応え、${U_ERA[s]}から${c.name}が客演に現れた！`);hpush(`${U_ERA[s]}から${c.name}が時を越えて客演`);playMotif(c.motif,c.tim);cutin(c.id,'時を越えて参上！',c.name);save();render();}};}).concat([{t:'やめる'}]));
}

start=function(){_startU();ensU();if(!G.flags.uIntro){G.flags.uIntro=1;save();modal('統合版の遊び方',`旅・説得・演奏対決・演奏会はこれまでどおり。そこに<b>楽団を育てて率いる巡演</b>が加わった。
 <div class="sec-p">稽古場</div>巡演楽団（あなた自身も入れる）を6人まで選ぶ。先頭はコンサートマスター。楽団員はLv1〜99に育ち、Lv20で<b>開眼</b>（能力と特技が伸びる）。楽器や道具を2つまで<b>愛用品</b>として持たせる（その時代に存在するものだけ）。史実の仲間をそろえると<b>史実の縁</b>が結ばれる。
 <div class="sec-p">巡演</div>いま居る都市の会場を一夜ずつ回る。毎晩、聴衆の顔ぶれを見て演奏スタイルを選び、序曲→第1楽章→第2楽章→アンコールと演奏が進む。街から街への道中では、旅のできごとが起こる。大御所の舞台で喝采を得るたびに<b>牙城</b>が崩れ、0になると<b>その都市を手に入れる</b>。旅先で音楽家が仲間入りを申し出ることも。<b>限界の団員を無理に舞台に立たせると、楽団を去ってしまう。</b>
 <div class="sec-p">派遣公演</div>派遣楽団を数か月の仕事に出して資金を稼ぐ。
 <div class="sec-p">時の扉</div>3都市を手に入れると開く。踏破すると「時を越える招待状」が手に入り、別の時代の音楽家（バッハやマーラーなど）を客演に招ける。`);}};

const _evalLineupV=evalLineup;
evalLineup=function(p,L,opt){
  const r=_evalLineupV(p,L,opt);opt=opt||{};
  if(p.form!=='協奏曲'||!p.slots[0]||!/独奏/.test(p.slots[0].l))return r;
  const sid=opt.standIn===0?null:L[0];
  if(!sid){r.q-=8;r.notes.unshift('協奏曲なのにソリストがいない（-8）');}
  else{
    const c=r.contrib.find(x=>x&&x.i===0);const others=r.contrib.filter(x=>x&&x.i!==0);const avg=others.length?others.reduce((a,x)=>a+x.v,0)/others.length:c.v;
    const add=(c.v-avg)*.8;r.q+=add/Math.max(1,p.slots.length/2);r.notes.unshift(`協奏曲の主役はソリスト：${nameOf(sid)}（${add>=0?'+':''}${(add/Math.max(1,p.slots.length/2)).toFixed(1)}）`);
    const real=realId(sid),cf=CONC[p.id];
    if(cf&&cf.sol.includes(real)){r.q+=4;r.notes.unshift(`★当たり役！ ${nameOf(sid)}の${p.t.replace(/（.*）/,'')}——${cf.t}（+4）`);c.v+=4;c.sk.push('当たり役');}
    const best=['tech','expr','impro'].sort((a,b)=>mstat(sid,b)-mstat(sid,a))[0];const need=['tech','expr','impro'][p.w.indexOf(Math.max(...p.w))];
    if(best===need){r.q+=1.5;r.notes.push(`ソリストの芸風が曲に合う（+1.5）`);}
    const inst=(typeof ueqOf==='function'&&G.ux&&G.ux[sid])?ueqOf(sid).filter(e=>UEQ[e.id].cat==='inst'||UEQ[e.id].cat==='bow'):[];
    const iv=inst.reduce((a,e)=>a+(eqStat(e,'tech',sid)+eqStat(e,'expr',sid)),0);
    if(iv){r.q+=iv*.5;r.notes.push(`ソリストの楽器が鳴る：${inst.map(e=>eqName(e)).join('＋')}（+${(iv*.5).toFixed(1)}）`);}
  }
  r.stars=r.q<13?1:r.q<17?2:r.q<21?3:r.q<25?4:5;
  let mvp=-1,bv=-99;r.contrib.forEach(c=>{if(c&&c.v>bv){bv=c.v;mvp=c.i;}});r.mvp=mvp;
  return r;
};

/* =====================================================================
   楽団史の共有：リンク・画像カード・データの書き出し／読み込み
   （サーバー不要。記録はURLの中に圧縮して入れる）

const SH_TITLES=[[0,'町の楽団'],[600,'宮廷に呼ばれる楽団'],[1200,'都の名門楽団'],[2000,'欧州に名だたる楽団'],[3000,'時代を代表する楽団'],[4500,'音楽史に刻まれる楽団'],[6500,'伝説の楽団']];

/* 総合点：都市・名声・楽団の育成・実績・難易度を合わせた点（将来のランキング用） */
function shScore(R){
  const dm={入門:.8,普通:1,難しい:1.3,超難しい:1.6,地獄:2}[R.diff]||1;
  const lvsum=(R.mem||[]).reduce((a,m)=>a+(m.lv||1),0);
  return Math.round(((R.score||0)+lvsum*4+(R.ach||[]).length*40+(R.caps||0)*60+(R.win?800:0))*dm);
}
/* 報告書に、楽団の育成の記録を足す */
const _buildReportS=buildReport;
buildReport=function(){
  const R=_buildReportS();ensU();

  R.sets=uSets(G.fleet[0]).map(s=>s.n);R.caps=G.ust.caps||0;R.lost=G.ust.lost||0;
  try{const got=JSON.parse(localStorage.getItem('concertoStormAch')||'{}');R.ach=ACH.filter(a=>got[a.id]).map(a=>a.n);}catch(e){R.ach=[];}
  R.total=shScore(R);R.title=shTitle(R.total);return R;

/* ---- URLへの詰め込み ---- */
function shPack(R){
  return{v:1,o:R.orch,n:R.byName||'',sc:R.sc,st:R.scTitle,pe:R.period,p:R.pid,pn:R.pname,df:R.diff,rs:R.result,w:R.win?1:0,s:R.score,t:R.total,ti:R.title,lv:R.lv,
    ci:R.cities,co:R.concerts,rv:R.rev,ep:R.epi,
    m:(R.mem||R.members.filter(m=>m.stay)).slice(0,12).map(m=>[m.id,m.name,m.lv||1,m.kai||0,m.ge||'',m.mvp||0]),
    tp:(R.top||[]).slice(0,3).map(c=>[c.d,c.t,c.h,c.s,c.mvp||'']),
    h:(R.hist||[]).filter(x=>!/^🏅/.test(x.s)).slice(-24).map(x=>[x.d,x.s]),a:(R.ach||[]).slice(0,30),se:R.sets||[],cp:R.caps||0,pl:R.played};
}
const b64u=b=>{let s='';const a=new Uint8Array(b);for(let i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');};
const ub64u=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const b=atob(s),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;};
async function shEncode(obj){
  const raw=new TextEncoder().encode(JSON.stringify(obj));
  if(typeof CompressionStream!=='undefined'){try{const cs=new CompressionStream('deflate-raw');const out=await new Response(new Blob([raw]).stream().pipeThrough(cs)).arrayBuffer();return'z'+b64u(out);}catch(e){}}
  return'j'+b64u(raw);
}
async function shDecode(s){
  const k=s[0],a=ub64u(s.slice(1));
  if(k==='z'){const ds=new DecompressionStream('deflate-raw');const out=await new Response(new Blob([a]).stream().pipeThrough(ds)).arrayBuffer();return JSON.parse(new TextDecoder().decode(out));}
  return JSON.parse(new TextDecoder().decode(a));
}
const shBase=()=>location.origin+location.pathname;
async function shLink(R){return`${shBase()}#r=${await shEncode(shPack(R))}`;}

/* ---- 画像カード（1080×1350） ---- */
async function shCard(D){
  const W=1080,H=1350,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#2a1d12');g.addColorStop(1,'#120c08');x.fillStyle=g;x.fillRect(0,0,W,H);
  x.strokeStyle='#c9a24a';x.lineWidth=6;x.strokeRect(30,30,W-60,H-60);x.lineWidth=2;x.strokeRect(46,46,W-92,H-92);
  const F='"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif';
  const txt=(s,X,Y,sz,col,al,wt)=>{x.font=`${wt||''} ${sz}px ${F}`;x.fillStyle=col;x.textAlign=al||'center';x.fillText(s,X,Y);};
  const wrap=(s,X,Y,maxW,sz,col,lh,maxL)=>{x.font=`${sz}px ${F}`;x.fillStyle=col;x.textAlign='left';let line='',n=0;for(const ch of s){if(x.measureText(line+ch).width>maxW){x.fillText(line,X,Y);Y+=lh;line=ch;if(++n>=maxL-1){line=line;}if(n>=maxL)return Y;}else line+=ch;}if(line)x.fillText(line,X,Y);return Y+lh;};
  txt('Historia Orchestrae',W/2,120,30,'#a08a5c');
  txt(`${D.o}史`,W/2,200,64,'#f0d58a','center','bold');
  txt(`${D.st}　${D.pe}`,W/2,252,28,'#d8c9a8');
  const hp=await svgImg(ptEra(D.p,D.sc,220,'#c9a24a'));if(hp)x.drawImage(hp,W/2-110,280,220,264);
  txt(D.rs,W/2,600,44,D.w?'#f0d58a':'#e6d6b4','center','bold');
  txt(`「${D.ti}」`,W/2,660,40,'#f7e3a6');
  txt(`総合点 ${D.t}　名声Lv${D.lv}　難易度 ${D.df}`,W/2,712,30,'#d8c9a8');
  txt(`支配都市 ${D.ci.length}　演奏会 ${D.co}回　実績 ${D.a.length}`,W/2,756,28,'#bba985');
  const ms=D.m.slice(0,6);const sz=130,gap=24,x0=(W-(ms.length*sz+(ms.length-1)*gap))/2;
  for(let i=0;i<ms.length;i++){const [id,nm,lv,kai,ge]=ms[i];const im=await svgImg(ptEra(id,ge||D.sc,sz,kai?'#e9a0f0':'#c9a24a'));const X=x0+i*(sz+gap);if(im)x.drawImage(im,X,790,sz,sz*1.2);
    txt(nm.length>7?nm.slice(0,7):nm,X+sz/2,790+sz*1.2+34,24,'#f0e2c0');txt(`Lv${lv}${kai?' 開眼':''}${ge?' 客演':''}`,X+sz/2,790+sz*1.2+64,20,'#c9b48a');}
  let Y=1080;if(D.se.length){txt(`史実の縁：${D.se.map(s=>`《${s}》`).join('')}`,W/2,Y,26,'#f0d58a');Y+=44;}
  Y=wrap(D.ep,90,Y,W-180,24,'#d8c9a8',36,3);
  const hs=D.h.slice(-Math.max(0,Math.floor((H-130-Y)/34))).slice(-6);
  if(hs.length){Y+=6;x.strokeStyle='#6b5530';x.beginPath();x.moveTo(90,Y-24);x.lineTo(W-90,Y-24);x.stroke();
    for(const [d,t] of hs){x.font=`20px ${F}`;x.fillStyle='#c9a24a';x.textAlign='left';x.fillText(d,90,Y);x.fillStyle='#d8c9a8';let s=t;while(x.measureText(s).width>W-300&&s.length>4)s=s.slice(0,-2);if(s!==t)s+='…';x.fillText(s,200,Y);Y+=34;}}
  txt('協奏の嵐 ― Concerto Storm',W/2,H-70,26,'#a08a5c');
  return new Promise(res=>c.toBlob(b=>res(b),'image/png'));
}

 {k:'lecture',w:2,tell:'眉をひそめて口を開いた…',run(R){R.debuff=6;const d=Math.round(R.t.theory*1.5*R.cm);R.foc-=d;return`「その解釈は違う」 しばらく効きが半分（集中 -${d}）`;}}

let RTS=null;
function rtStart(){
  const t=D.t,base=t.tech+t.expr+t.impro+(t.theory||6),df=(DF().n==='入門'?.75:DF().n==='難しい'?1.2:DF().n==='超難しい'?1.4:DF().n==='地獄'?1.6:1);
  const hpMax=Math.round((1400+t.tech*120+base*25+t.lv*110)*df*3.2),mpMax=Math.round((1400+(t.theory||6)*80+t.expr*60+base*25+t.lv*110)*df*3.2);

  RTS={t,hp:hpMax,hpMax,mp:mpMax,mpMax,foc:focMax,focMax,time:45,combo:0,maxC:0,chaos:0,last:'',run:0,lastHit:0,ph:0,phT:9,cT:3.5,tell:null,tellT:0,angry:false,debuff:0,cd:{},
    cm:1*df,hits:{},dmg:0,parry:0,weak:0,miss:0,over:false,note:0,log:[],t0:performance.now()};

function rtStat(mv){
  let v=mstat('you',mv.st);
  if(mv.k==='crowd')v=Math.max(v,4+plv()/2);
  if(['tech','expr','impro'].includes(mv.k)){v+=((PL().duelB||{})[mv.k]||0);if(D.piece&&D.piece.b===mv.k)v+=2;}
  if(D.second){const c=charById(D.second);if(c&&c.style===mv.st)v+=Math.ceil(mlv(D.second)/2);}
  return v;
}
function rtEff(mv){
  const R=RTS,t=R.t;let e=1,tags=[];
  if(['tech','expr','impro'].includes(mv.k)){if(BEATS[mv.k]===t.style){e*=1.4;tags.push('弱点');}else if(mv.k===t.style){e*=.8;tags.push('相手の土俵');}}
  const pm=RT_PHASES[R.ph].m[mv.k];if(pm){e*=pm;if(pm>1)tags.push('楽章');}
  if(R.run>3){e*=Math.max(.35,1-(R.run-3)*.08);if(R.run===6)rtSay('同じ芸ばかり…聴衆が飽きてきた','warn');}
  if(R.debuff>0){e*=.5;R.debuff--;}

}
function rtTap(k){
  const R=RTS;if(!R||R.over)return;const mv=RT_MOVES.find(m=>m.k===k);const now=performance.now()/1000;
  if(mv.cd&&R.cd[k]&&now<R.cd[k])return;if(mv.cd)R.cd[k]=now+mv.cd;
  if(k==='impro'&&R.tell){R.tell=null;R.parry++;R.combo+=3;rtSay('切り返した！ 相手の攻勢を逆手にとる','good');rtHit(mv,3,['切り返し']);rtShake();return;}

  rtHit(mv,1,[]);
}
function rtHit(mv,mult,extra){
  const R=RTS;const now=performance.now()/1000;
  R.combo=now-R.lastHit<.85?R.combo+1:1;R.lastHit=now;R.maxC=Math.max(R.maxC,R.combo);
  const {e,tags}=rtEff(mv);const cm=1+Math.min(R.combo,40)*.025;const crit=Math.random()<.08;
  const base=(8+rtStat(mv)*2.4)*e*cm*mult*(crit?1.8:1)*(.88+Math.random()*.24);
  const dh=Math.round(base*mv.hp),dm=Math.round(base*mv.mp);
  R.hp=Math.max(0,R.hp-dh);R.mp=Math.max(0,R.mp-dm);R.dmg+=dh+dm;R.hits[mv.k]=(R.hits[mv.k]||0)+1;if(tags.includes('弱点'))R.weak++;
  R.chaos=Math.min(100,R.chaos+(mv.chaos||3)*(tags.includes('弱点')?1.5:1));
  const all=tags.concat(extra);rtPop('opp',`${crit?'会心！':''}${all.length?all.join('・')+' ':''}-${dh+dm}`,crit||all.includes('弱点')?'crit':'');
  if(crit||mult>1)rtShake();

}
function rtFinisher(){

  const p=PL();cutin(G.pid,'必殺のカデンツァ！',(p.pieces&&D.piece)?D.piece.t:p.name);
  let i=0;const best=['tech','expr','impro'].sort((a,b)=>rtStat(RT_MOVES.find(m=>m.k===b))-rtStat(RT_MOVES.find(m=>m.k===a)))[0];
  const iv=setInterval(()=>{if(!RTS||RTS.over||i++>=14){clearInterval(iv);return;}const mv=RT_MOVES.find(m=>m.k===(i%3===0?'expr':best));R.run=0;rtHit(Object.assign({},mv,{hp:.8,mp:.8}),1.5,['カデンツァ']);},110);
}
function rtNote(up){
  try{const c=ac();if(!c)return;const mo=MOTIFS[(D.piece&&D.piece.m)||PL().motif]||MOTIFS.scale;const R=RTS;const n=mo[R.note%mo.length];R.note++;
    const tt=c.currentTime+.01;if(Array.isArray(n[0]))n[0].forEach(x=>tone(tt,x+up*12,.16,PL().tim));else if(n[0])tone(tt,n[0]+up*12,.16,PL().tim);}catch(e){}
}
function rtOppNote(){
  try{const c=ac();if(!c)return;const R=RTS;const mo=MOTIFS[R.t.motif]||MOTIFS.scale;const broken=1-(R.hp/R.hpMax+R.mp/R.mpMax)/2;let tt=c.currentTime+.02;
    for(const [n,d] of mo.slice(0,4)){const m=Array.isArray(n)?n[0]:n;if(m)tone(tt,m+(Math.random()<broken?pick([-1,1,-2,6]):0),Math.min(.3,d*.6),R.t.tim||'piano');tt+=Math.min(.3,d*.6);}}catch(e){}
}
function rtLoop(){
  let prev=performance.now();
  const f=now=>{const R=RTS;if(!R||R.over||!$('#rtWrap'))return;const dt=Math.min(.1,(now-prev)/1000);prev=now;
    R.time-=dt;R.phT-=dt;if(R.phT<=0){R.ph=(R.ph+1)%RT_PHASES.length;R.phT=9;const P_=RT_PHASES[R.ph];rtSay(`${P_.n}${P_.h?'――'+P_.h:''}`,'phase');}
    const ang=(R.hp/R.hpMax<.5||R.mp/R.mpMax<.5);if(ang&&!R.angry){R.angry=true;rtSay(`${R.t.name}が本気になった！ 攻勢が速くなる`,'warn');}
    const rg=(R.angry?.012:.008)*dt;R.hp=Math.min(R.hpMax,R.hp+R.hpMax*rg*.5);R.mp=Math.min(R.mpMax,R.mp+R.mpMax*rg*.5);
    if(R.tell){R.tellT-=dt;if(R.tellT<=0){const c=R.tell;R.tell=null;rtSay(c.run(R),'bad');rtOppNote();rtShake(true);}}
    else{R.cT-=dt;if(R.cT<=0){const pool=RT_COUNTERS;let x=Math.random()*pool.reduce((a,c)=>a+c.w,0),c=pool[0];for(const q of pool){x-=q.w;if(x<=0){c=q;break;}}
      R.tell=c;R.tellT=R.angry?.75:.95;R.cT=Math.max(1.5,(3.6-R.t.lv*.12)*(R.angry?.7:1))*(.8+Math.random()*.4);rtSay(`⚠ ${R.t.name}が${c.tell}`,'tell');}}

  requestAnimationFrame(f);
}
function rtCheck(){
  const R=RTS;if(!R||R.over)return;
  if(R.hp<=0||R.mp<=0)return rtEnd(true,R.mp<=0?'mp':'hp');
  if(R.foc<=0)return rtEnd(false,'foc');
  if(R.time<=0){const op=(R.hp/R.hpMax+R.mp/R.mpMax)/2,yp=R.foc/R.focMax;return rtEnd(1-op>(1-yp)*1.1,'judge',op,yp);}
}
function rtEnd(win,how,op,yp){

const _duelAnalysisRT=duelAnalysis;
duelAnalysis=function(won){
  if(!D.rt)return _duelAnalysisRT(won);
  const r=D.rt,t=D.t,top=Object.entries(r.hits).sort((a,b)=>b[1]-a[1])[0];const tips=[];

    if(r.how==='foc')tips.push('相手の攻勢を受けすぎて集中が切れた。「⚠」が出たら「即興で切り返す」を押すと、攻勢を跳ね返せる。');

  }
  return`<div class="anl"><b>${won?'勝因':'敗因'}</b><br>最大コンボ ${r.maxC}／弱点を突いた回数 ${r.weak}／切り返し ${r.parry}回${top?`／いちばん使った芸「${RT_MOVES.find(m=>m.k===top[0]).n}」${top[1]}回`:''}${tips.length?'<br><b>次への助言</b><br>'+tips.map(x=>'・'+x).join('<br>'):''}</div>`;
};

function animNote(host,x,y,opt){opt=opt||{};const s=document.createElement('span');s.className='fxnote'+(opt.bad?' bad':'')+(opt.big?' big':'');
  s.textContent=opt.t||pick(['♪','♫','♬','♩']);s.style.left=x+'px';s.style.top=y+'px';s.style.setProperty('--dx',((opt.dx!=null?opt.dx:(Math.random()*60-30)))+'px');s.style.setProperty('--dy',((opt.dy!=null?opt.dy:-(50+Math.random()*50)))+'px');
  host.appendChild(s);setTimeout(()=>s.remove(),1300);}
function animBurst(el,n,opt){const host=el.closest('.stage,.battle,.rt')||el.parentElement;if(!host)return;const hb=host.getBoundingClientRect(),r=el.getBoundingClientRect();
  const x=r.left-hb.left+r.width/2,y=r.top-hb.top+r.height*.35;for(let i=0;i<n;i++)setTimeout(()=>animNote(host,x,y,opt),i*70);}

const _performA=perform;
perform=function(){
  _performA();
  const stage=document.querySelector('#scene .stage');if(!stage||!PR)return;
  const p=PR.p,L=PR.L;
  /* 幕が開く */
  stage.insertAdjacentHTML('beforeend','<div class="curtain l"></div><div class="curtain r"></div>');
  setTimeout(()=>stage.classList.add('open'),60);
  /* 協奏曲：ソリストを前へ、スポットライトを当てる */
  if(p.form==='協奏曲'&&p.slots[0]&&/独奏/.test(p.slots[0].l)&&L[0]){const el=stage.querySelector(`.perf[data-pid="${L[0]}"]`);
    if(el){el.style.left='34%';el.style.top='50%';el.classList.add('soloist');stage.insertAdjacentHTML('beforeend','<div class="solospot" style="left:34%"></div>');
      const rest=[...stage.querySelectorAll('.perf')].filter(x=>x!==el);const cd=rest.find(x=>{const i=L.indexOf(x.dataset.pid);return i>=0&&[].concat(p.slots[i].r).includes('cond');});
      if(cd){cd.style.left='66%';cd.style.top='50%';}
      rest.filter(x=>x!==cd).forEach((x,j,arr)=>{x.style.top='20%';x.style.left=(18+64*(arr.length===1?.5:j/(arr.length-1)))+'%';x.classList.add('back');});
      const tag=document.createElement('div');tag.className='solotag';tag.textContent='ソリスト';el.appendChild(tag);}}
  /* 指揮者は棒を振る */
  stage.querySelectorAll('.perf').forEach(el=>{const id=el.dataset.pid;const i=L.indexOf(id);if(i>=0&&p.slots[i]&&[].concat(p.slots[i].r).includes('cond')){el.classList.add('conductor');el.insertAdjacentHTML('beforeend','<i class="baton"></i>');}});
  /* 出番が来たら音符を飛ばし、外れ奏者はやらかす */
  const seen=new Set();
  const mo=new MutationObserver(ms=>{for(const m of ms){const el=m.target;if(!el.classList||!el.classList.contains('hl')||seen.has(el))continue;seen.add(el);
    const id=el.dataset.pid;const q=QUIRK[realId(id)]||[];
    if(q.includes('face')){el.classList.add('henkao');animSay(el,pick(['ぶはっ！','顔！','なんだその顔は']),'laugh');setTimeout(()=>el.classList.remove('henkao'),1400);if(typeof audBubble==='function')audBubble(pick(['ぶっ！','あはははは','ひーっ']),10+Math.random()*80,30+Math.random()*40,'good');}
    else if(q.includes('wrong')){el.classList.add('wrongnote');animBurst(el,4,{bad:true,t:pick(['♭?','♯!?','ブフォ','✕'])});setTimeout(()=>el.classList.remove('wrongnote'),900);}
    else if(q.includes('rhythm')){el.classList.add('offbeat');animBurst(el,3,{t:'♩?'});setTimeout(()=>el.classList.remove('offbeat'),1200);}
    else animBurst(el,el.classList.contains('soloist')?9:5,{big:el.classList.contains('soloist')});
    if(q.includes('roukai'))animSay(el,pick(['ワシの若いころは…','テンポが速い！','昔はなあ…']),'old');}});
  stage.querySelectorAll('.perf').forEach(el=>mo.observe(el,{attributes:true,attributeFilter:['class']}));
  setTimeout(()=>mo.disconnect(),20000);
};
