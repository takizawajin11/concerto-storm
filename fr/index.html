<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Concerto Storm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700;800&family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#15110c; --bg2:#1f1913; --panel:#2a221a; --line:#4a3c2c;
  --ink:#2b2117; --gold:#cfa84f; --gold2:#f0d58a; --text:#f2e8d4; --mute:#b5a586;
  --classic:#5a86b8; --roman:#b5506a; --virt:#cfa84f;
  --serif:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --latin:"Cormorant Garamond",Georgia,serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--serif);font-size:15px;line-height:1.6}
button{font-family:inherit;cursor:pointer}
.hidden{display:none!important}
#app{max-width:760px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
#hud{position:sticky;top:0;z-index:5;background:linear-gradient(#1b150f,#15110c);border-bottom:1px solid var(--line);padding:8px 12px 6px}
#hud .row1{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
#hud .date{font-weight:800;font-size:17px;letter-spacing:.04em}
#hud .date small{font-family:var(--latin);font-style:italic;color:var(--mute);font-weight:500;margin-left:6px}
#hud .who{font-size:13px;color:var(--gold2)}
#hud .stats{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:5px;font-size:11.5px;color:var(--mute)}
#hud .stats b{display:block;color:var(--text);font-size:14px;font-weight:700}
.bar{height:5px;background:#3a2f23;border-radius:3px;overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;background:var(--gold)}
#sndBtn{background:none;border:1px solid var(--line);color:var(--mute);border-radius:14px;font-size:12px;padding:2px 9px}
#tabs{display:flex;border-bottom:1px solid var(--line);background:var(--bg2)}
#tabs button{flex:1;background:none;border:0;color:var(--mute);padding:9px 0;font-size:14px;border-bottom:2px solid transparent}
#tabs button.on{color:var(--gold2);border-bottom-color:var(--gold)}
main{flex:1;padding:10px 12px 40px}
#mapWrap{background:radial-gradient(ellipse at 40% 40%,#f3e8cf,#d9c59b 75%,#c2aa7a);border-radius:10px;border:1px solid #8a7550;box-shadow:inset 0 0 40px rgba(80,50,10,.35);overflow:hidden}
#map{display:block;width:100%;height:auto}
.legend{display:flex;gap:4px 12px;flex-wrap:wrap;font-size:11.5px;color:var(--mute);margin:6px 2px 10px}
.legend .d::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:-1px;background:var(--c)}
.legend .r::before{content:"";display:inline-block;width:9px;height:9px;border:2px dashed var(--c);margin-right:4px;vertical-align:-1px;border-radius:50%}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
.city-h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.city-h h2{margin:0;font-size:21px;letter-spacing:.05em}
.city-h h2 small{font-family:var(--latin);font-style:italic;color:var(--mute);font-size:15px;margin-left:6px;font-weight:500}
.inst{font-size:13px;color:var(--mute)}
.chip{display:inline-block;font-size:11px;padding:1px 8px;border-radius:10px;border:1px solid var(--c);color:var(--c);white-space:nowrap}
.chip.solid{background:var(--c);color:#1a140e;font-weight:700}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.btn{background:#3a2e21;border:1px solid #6d5a3e;color:var(--text);border-radius:8px;padding:9px 6px;font-size:14px;line-height:1.3}
.btn small{display:block;font-size:10.5px;color:var(--mute)}
.btn.gold{background:linear-gradient(#d9b55d,#a9812f);color:#1d150b;border-color:#e6c56f;font-weight:700}
.btn.gold small{color:#3b2a10}
.btn.crim{background:linear-gradient(#a83a40,#7a2328);border-color:#c35a5f}
.btn:disabled{opacity:.38;cursor:default}
.sec-t{font-size:13px;color:var(--gold2);margin:14px 2px 6px;letter-spacing:.1em}
.person{display:flex;gap:10px;align-items:center;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:9px;margin-bottom:8px}
.medal{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:19px;color:var(--ink);background:radial-gradient(circle at 35% 30%,#fff6dd,#d7c191);border:3px solid var(--c);box-shadow:0 0 0 1px #000 inset}
.medal.big{width:64px;height:64px;font-size:26px}
.pinfo{flex:1;min-width:0}
.pname{font-weight:700;font-size:15.5px}
.pname .lat{font-family:var(--latin);font-style:italic;color:var(--mute);font-weight:500;font-size:13px;margin-left:4px}
.pmeta{font-size:11.5px;color:var(--mute)}
.trust{height:4px;background:#3a2f23;border-radius:2px;margin-top:4px;position:relative;overflow:hidden}
.trust i{position:absolute;top:0;bottom:0}
.pbtns{display:flex;flex-direction:column;gap:5px}
.pbtns .btn{padding:5px 10px;font-size:12.5px}
.trivia{font-size:12px;color:#d8c9a8;background:#1a150f;border-left:2px solid var(--gold);padding:6px 9px;margin:6px 0;border-radius:0 6px 6px 0}
.tag{font-size:10px;color:#1a140e;background:#9fd0c7;border-radius:4px;padding:0 5px;margin-left:4px;vertical-align:2px;font-family:var(--serif);font-style:normal}
.tag.rv{background:var(--c);color:#fff}
.seat{display:flex;justify-content:space-between;align-items:center;padding:8px 4px;border-bottom:1px dashed var(--line);font-size:14px}
.seat .r{color:var(--mute);font-size:12.5px;width:7.5em;flex:none}
.seat .n{flex:1;font-weight:700}
.seat .n.empty{color:#6b5c47;font-weight:500}
.log p{margin:0 0 8px;font-size:13px;border-bottom:1px dotted var(--line);padding-bottom:6px}
.log p b{color:var(--gold2);font-weight:700;margin-right:6px;font-size:12px}
.fac{border-left:4px solid var(--c)}
.fac h3{margin:0;font-size:17px}
.fac .row{font-size:13px;color:#d8c9a8;margin-top:3px}
#scene{position:fixed;inset:0;z-index:20;background:radial-gradient(ellipse at 50% 0%,#3a2a1a,#120e0a 70%);overflow-y:auto}
.sc{max-width:620px;margin:0 auto;padding:14px 14px 30px}
.sc h3{margin:4px 0 2px;font-size:19px;text-align:center;letter-spacing:.08em}
.sc .subt{text-align:center;font-family:var(--latin);font-style:italic;color:var(--mute);font-size:14px}
.vs{display:flex;justify-content:space-between;align-items:center;margin:12px 4px 6px}
.vs .side{text-align:center;width:40%}
.vs .side div:last-child{font-size:13px;margin-top:3px}
.vs .mid{font-family:var(--latin);font-style:italic;font-size:26px;color:var(--gold)}
.meter{position:relative;height:16px;border-radius:8px;background:linear-gradient(90deg,#5a1d22,#2a1f17 50%,#5a4a1d);border:1px solid #6d5a3e;margin:8px 0 2px}
.meter .ndl{position:absolute;top:-5px;width:4px;height:24px;background:#fff3cf;border-radius:2px;box-shadow:0 0 8px #ffe08a;transition:left .5s cubic-bezier(.3,1.6,.5,1)}
.meter .c0{position:absolute;left:50%;top:0;bottom:0;width:1px;background:#8a7550}
.mlab{display:flex;justify-content:space-between;font-size:11px;color:var(--mute)}
.bubbles{min-height:210px;max-height:260px;overflow-y:auto;padding:8px 2px;display:flex;flex-direction:column;gap:7px;margin:8px 0;background:rgba(0,0,0,.18);border-radius:8px}
.bub{max-width:82%;padding:7px 11px;border-radius:14px;line-height:1.45;animation:pop .35s ease-out;word-break:break-word}
.bub.you{align-self:flex-end;background:#f1e3bf;color:var(--ink);border-bottom-right-radius:3px}
.bub.them{align-self:flex-start;background:#4a2a2c;color:#f6e3e3;border-bottom-left-radius:3px}
.bub .k{display:block;font-size:10.5px;opacity:.7}
.bub .fx{display:block;font-size:11.5px;font-weight:800;margin-top:2px}
.bub.weak{box-shadow:0 0 0 2px var(--gold),0 0 14px rgba(240,200,90,.6)}
.bub.resist{opacity:.75}
.bub.back{box-shadow:0 0 0 2px #d24}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.insp{position:relative;height:12px;border-radius:6px;background:#2b231a;border:1px solid #5d4c36;overflow:hidden}
.insp i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#6f8fd8,#c9a3ff,#ffe08a);transition:width .4s}
.insp.full{animation:glow 1s infinite alternate}
@keyframes glow{to{box-shadow:0 0 12px #ffe08a}}
.cmds{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}
.cmds .btn{padding:8px 2px;font-size:15px}
.cmds .btn small{font-size:10px}
.rinfo{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);margin-top:8px}
.cards3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.pc{background:linear-gradient(#f6ecd2,#dcc89c);color:var(--ink);border:2px solid #8a7550;border-radius:10px;padding:12px 4px;text-align:center;font-size:17px;font-weight:800}
.pc small{display:block;font-size:10.5px;font-weight:500;color:#5b4a33;margin-top:3px;line-height:1.35}
.pc .ic{font-family:var(--latin);font-size:24px;display:block;line-height:1}
.pc:disabled{opacity:.4}
.tell{text-align:center;font-size:13.5px;color:#e9d9b8;background:rgba(0,0,0,.25);border-radius:8px;padding:8px;margin:8px 0}
.score{display:flex;justify-content:center;gap:22px;font-size:28px;font-family:var(--latin);margin:4px 0}
.score span{color:var(--mute);font-size:13px;font-family:var(--serif);display:block;text-align:center}
.mvlog p{font-size:13px;margin:4px 0;padding:6px 9px;background:rgba(0,0,0,.2);border-radius:6px}
.piece{display:block;width:100%;text-align:left;margin-bottom:8px}
#modal{position:fixed;inset:0;z-index:40;background:rgba(5,3,1,.72);display:flex;align-items:center;justify-content:center;padding:16px}
#modal .box{background:linear-gradient(#f3e8cf,#e0cea6);color:var(--ink);border-radius:12px;max-width:440px;width:100%;padding:18px 16px 14px;border:2px solid #8a7550;box-shadow:0 10px 40px #000;max-height:86vh;overflow-y:auto}
#modal h4{margin:0 0 8px;font-size:18px;border-bottom:1px solid #b39c6c;padding-bottom:6px}
#modal .body{font-size:14px}
#modal .body .trivia{color:#3b2e1d;background:#fff6dc}
#modal .body [style*="var(--gold2)"]{color:#8a6420!important;font-weight:800}
#modal .body [style*="var(--mute)"]{color:#6d5a3e!important}
#modal .mb{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
#modal .mb .btn{flex:1;min-width:40%}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:50;background:#f0d58a;color:#1d150b;padding:8px 16px;border-radius:20px;font-size:13.5px;font-weight:700;box-shadow:0 4px 18px #000;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1}
.title{text-align:center;padding:26px 6px 10px}
.title .logo{font-size:44px;font-weight:800;letter-spacing:.18em;margin:0;background:linear-gradient(#fff2c4,#cfa84f 60%,#8a6420);-webkit-background-clip:text;background-clip:text;color:transparent}
.title .en{font-family:var(--latin);font-style:italic;color:var(--mute);font-size:18px;letter-spacing:.12em}
.title .staff{height:34px;margin:14px auto;max-width:300px;background:repeating-linear-gradient(transparent 0 6px,#6d5a3e 6px 7px)}
.hero{display:flex;gap:12px;text-align:left;align-items:center;margin:8px 0;width:100%;padding:12px}
.hero p{margin:2px 0 0;font-size:12px;color:var(--mute)}
.scen{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px}
.scen .y{font-family:var(--latin);font-size:26px;color:var(--gold2);font-weight:700;line-height:1}
.scen b{font-size:16px}
.scen p{margin:4px 0 0;font-size:12px;color:var(--mute)}
.howto{text-align:left;font-size:13px;color:#d8c9a8}
.howto li{margin-bottom:5px}
.prog{font-size:14px;line-height:1.9}
.prog i{font-family:var(--latin);color:var(--mute)}
.credit{font-size:11px;color:#7d6e55;margin-top:14px}
.credit a{color:#9c8b6c}
.pt{display:block;flex:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,.45))}
.vs .side .pt{margin:auto}
.cutin{position:fixed;inset:0;z-index:60;pointer-events:none;display:flex;align-items:center;background:rgba(0,0,0,.35);animation:cfade 1.75s forwards}
.cutin .band{width:100%;background:linear-gradient(100deg,#6a141a,#a8323a 40%,#cfa84f);padding:10px 18px;display:flex;align-items:center;gap:14px;box-shadow:0 0 30px #000;animation:cslide 1.75s cubic-bezier(.2,.9,.2,1) forwards}
.cutin .ct b{display:block;font-size:34px;color:#fff;font-weight:800;text-shadow:0 3px 0 #000,0 0 18px #ffd27a;letter-spacing:.06em}
.cutin .ct span{color:#fff3cf;font-size:14px}
@keyframes cslide{0%{transform:translateX(-110%) skewY(-6deg)}14%{transform:translateX(0) skewY(-6deg)}84%{transform:translateX(0) skewY(-6deg)}100%{transform:translateX(110%) skewY(-6deg)}}
@keyframes cfade{0%,85%{opacity:1}100%{opacity:0}}
.stage{position:relative;border-radius:10px;overflow:hidden;border:1px solid #6d5a3e}
.stage .stbg{display:block;width:100%;height:auto}
.stage .perf{position:absolute;transform:translateX(-50%);text-align:center;animation:bob 1.2s ease-in-out infinite alternate}
.stage .perf span{display:block;font-size:10px;color:#fff3cf;text-shadow:0 1px 2px #000;white-space:nowrap}
@keyframes bob{to{transform:translateX(-50%) translateY(-3px)}}
.stage .spot{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 30%,rgba(255,236,170,.32),transparent 55%);animation:spot 2.5s ease-in-out infinite alternate;pointer-events:none}
@keyframes spot{from{background-position:-40px 0}to{background-position:40px 0}}
.stage .nt{position:absolute;bottom:20%;color:#ffe08a;font-size:18px;opacity:0;animation:nt 2.6s ease-out infinite;text-shadow:0 0 6px #ffcf5a}
@keyframes nt{0%{opacity:0;transform:translateY(0)}20%{opacity:1}100%{opacity:0;transform:translateY(-120px) rotate(20deg)}}
.aud{display:flex;justify-content:space-between;align-items:flex-end;height:22px;margin-top:-1px;background:#0c0806;padding:0 6px}
.aud i{display:block;width:12px;border-radius:6px 6px 0 0;background:#2a1f17}
.aud i.clap{animation:clap .25s ease-in-out infinite alternate}
@keyframes clap{to{transform:translateY(-4px)}}
.applause{height:14px;border-radius:7px;background:#2b231a;border:1px solid #5d4c36;overflow:hidden}
.applause i{display:block;height:100%;width:0;background:linear-gradient(90deg,#9a2f35,#cfa84f,#fff3cf);transition:width 1.1s ease-out}
.prog-c b{font-size:14.5px}.prog-c small{margin-top:2px}
.pf-form{font-size:10.5px;background:#5a4630;border-radius:4px;padding:0 5px;color:#f0d58a}
.slot{cursor:pointer}
.empty-pt{width:44px;height:53px;border-radius:50%;border:2px dashed #6d5a3e;display:grid;place-items:center;color:#6d5a3e;font-size:20px;flex:none}
#modal .box.paper{background:#f5f0e3;font-family:var(--serif);border:1px solid #2b2117;box-shadow:0 10px 40px #000,inset 0 0 0 4px #f5f0e3,inset 0 0 0 5px #2b2117}
#modal .box.paper h4{font-family:var(--latin);font-size:24px;text-align:center;border-bottom:3px double #2b2117;font-style:italic;letter-spacing:.04em}
#modal .headline{font-size:21px;font-weight:800;text-align:center;margin:4px 0;letter-spacing:.06em}
#modal .dateline{font-size:11.5px;text-align:center;color:#6d5a3e;border-bottom:1px solid #b39c6c;padding-bottom:4px;margin-bottom:6px}
#modal .stars{text-align:center;font-size:22px;color:#8a6420;letter-spacing:.12em}
#modal .box.paper p{margin:6px 0;text-align:justify}
.diffb{display:block;width:100%;text-align:left;margin-bottom:8px}
.sec2{display:flex;gap:6px;flex-wrap:wrap}
.sec2 .btn{padding:4px 8px;font-size:12px;display:flex;align-items:center;gap:4px}
.sec2 .btn.on{border-color:var(--gold);background:#5a4630}
.seat .pt{margin-right:8px}
@media (max-width:420px){#hud .date small{display:none}}
.sk{display:inline-block;font-size:10.5px;background:linear-gradient(#e6c56f,#a9812f);color:#1d150b;border-radius:4px;padding:0 5px;margin:2px 3px 0 0;font-weight:700}
.qk{display:inline-block;font-size:10.5px;border:1px solid #8a7550;color:#d8c9a8;border-radius:4px;padding:0 5px;margin:2px 3px 0 0}
.qk.q-sickly,.qk.q-temper,.qk.q-greedy,.qk.q-debtor,.qk.q-diva,.qk.q-flirt,.qk.q-lazy,.qk.q-shy,.qk.q-reviser{border-color:#b55;color:#f2b0b0}
.qk.q-loyal,.qk.q-star,.qk.q-fast{border-color:#5a9;color:#a8e0c8}
.qrow{line-height:1.2;margin-top:2px}
.hallc{display:flex;gap:10px;align-items:center;width:100%;text-align:left;margin-bottom:8px}
.hallc small{display:block}
.fillbar{height:5px;background:#3a2f23;border-radius:3px;overflow:hidden;margin-top:4px}.fillbar i{display:block;height:100%;background:var(--gold)}
.audwrap{position:relative;margin-top:-1px;border-radius:0 0 10px 10px;overflow:hidden;border:1px solid #6d5a3e;border-top:0}
.aud2{display:block;width:100%;height:auto}
.aud2 .who{transform-box:fill-box;transform-origin:50% 100%}
.aud2.r-listen .who{animation:sway 3s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
.aud2.r-clap .who,.aud2.r-polite .who{animation:hop .35s ease-in-out infinite alternate}
.aud2.r-polite .who{animation-duration:.8s}
.aud2.r-cheer .who{animation:hop2 .25s ease-in-out infinite alternate}
.aud2.r-ovation .who{animation:stand .25s ease-in-out infinite alternate}
.aud2.r-boo .who{animation:shake .12s linear infinite alternate}
@keyframes hop{to{transform:translateY(-2px)}}@keyframes hop2{to{transform:translateY(-5px)}}
@keyframes stand{from{transform:translateY(-6px) scale(1.08)}to{transform:translateY(-10px) scale(1.08)}}
@keyframes shake{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}
.aud2 .who.leave{opacity:0;transition:opacity 1.6s}
.aud2 .who.faint{animation:faint 1s forwards!important}
@keyframes faint{to{transform:rotate(85deg) translateY(3px)}}
.rb{position:absolute;transform:translate(-50%,-50%);font-size:12px;font-weight:800;color:#fff3cf;background:rgba(40,25,15,.85);border:1px solid #cfa84f;border-radius:10px;padding:1px 7px;white-space:nowrap;animation:rbp 2.2s ease-out forwards;pointer-events:none}
.rb.good{background:#a8323a;color:#fff}.rb.bad{background:#333;color:#ccc;border-color:#666}.rb.faintb{background:#f7c;color:#fff;border-color:#fff}
@keyframes rbp{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-120%)}}
.flower{position:absolute;bottom:-20px;font-size:20px;animation:fly 1.4s ease-out forwards;opacity:0}
@keyframes fly{0%{opacity:1;transform:translateY(0) rotate(0)}100%{opacity:1;transform:translateY(-120px) rotate(300deg)}}
.stage .perf{transition:transform .25s,filter .25s}
.stage .perf.hl{transform:translateX(-50%) scale(1.22);z-index:3;filter:drop-shadow(0 0 12px #ffe08a)}
.stage .perf .pop{position:absolute;left:50%;top:-6px;transform:translateX(-50%);font-size:18px;font-weight:800;color:#ffe08a;text-shadow:0 2px 0 #000,0 0 8px #000;animation:popup 1.3s ease-out forwards;white-space:nowrap;pointer-events:none}
.stage .perf .pop.big{font-size:24px;color:#fff3cf}.stage .perf .pop.low{color:#bbb;font-size:15px}
.stage .perf .pop small{display:block;font-size:10px;color:#fff;background:#a8323a;border-radius:4px;padding:0 4px}

.critic{display:flex;gap:10px;align-items:center;background:#f3e8cf;color:#2b2117;border-radius:10px;padding:8px 10px;margin-top:8px;animation:pop .4s}

function newGame(sc,pid,diff){
  SC=SCEN[sc];const b=SC.players[pid];
  G={sc,pid,P:{name:b.name,faction:b.faction,xp:XPT[Math.max(0,XPT_OLD.filter(t=>b.xp>=t).length-1)],tech:b.tech,expr:b.expr,impro:b.impro,theory:b.theory,money:Math.round(b.money*DIFF[diff||'normal'].mo),stamina:100,city:b.start},
    month:0,owner:{},members:[],charOwner:{},rv:{},trust:{},cityF:{},cityLvB:{},flags:{},log:[],salonInsp:0,lostTo:[],over:false,diff:diff||'normal',cond:{},bond:{},boost:{}};
  for(const k of SC.cities)G.cityF[k]=ci(k).faction;
  for(const k of (b.own||[])){G.owner[k]='player';G.cityF[k]=b.faction;}

function addLog(s){const d=ymd(G.month);G.log.unshift({d:`${d.y}.${d.mo}`,s});if(G.log.length>150)G.log.pop();if(HISTRE.test(s))hpush(s);}
function toast(s){const t=$('#toast');t.textContent=s;t.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('on'),2300);}
function addXP(n){
  const before=plv();P().xp+=n;xpFlash(n);const after=plv();
  for(let l=before+1;l<=after;l++){const k3=['tech','expr','impro'][l%3];P()[k3]++;if(l%3===0)P().theory++;addLog(`Renommée : niveau ${l} (${CARD[k3].t} +1${l%3===0?', Théorie +1':''})`);toast(`Renommée Lv${l} ! Vous pouvez négocier avec de plus grands noms`);}
}
function seatMap(){const m={};for(const s of SEATS)m[s]=null;const extra=[];for(const id of G.members){const c=charById(id);if(!m[c.seat])m[c.seat]=c;else extra.push(c);}return{m,extra};}
function seatsFilled(){const {m}=seatMap();return SEATS.filter(s=>m[s]).length;}

/* ======================= 月の進行（ライバルAI含む） ======================= */
function rivalAI(){
  for(const r of rivalsActive()){
    const R=G.rv[r.id];const nC=owned(r.id).length;
    const nM=Object.values(G.charOwner).filter(x=>x===r.id).length;
    if(G.month%DF().rg===DF().rg-1)R.lv=Math.min(30,Math.max(R.lv,Math.min(R.lv+1,plv()+1+Math.ceil(Math.max(0,DF().lvB)/2))));
    const unhappy=G.members.filter(id=>moodOf(id)<40&&!hasQ(id,'loyal')&&!isAway(id));
    if(unhappy.length&&Math.random()<.06*DF().rv){const id=pick(unhappy);(G.alumni=G.alumni||[]).push(id);G.members=G.members.filter(x=>x!==id);G.charOwner[id]=r.id;modal('Débauchage !',`${portraitRow(id)}${charById(id).name}, dont le mécontentement grandissait, s'est laissé débaucher par le camp ${r.name}.`);addLog(`${charById(id).name} est passé au camp ${r.name}.`);}
    if(nM<4&&Math.random()<(.07+.01*nC)*DF().rv){
      const pool=freeChars();if(pool.length){
        const same=pool.filter(c=>c.faction===r.faction);const c=pick(same.length&&Math.random()<.7?same:pool);
        G.charOwner[c.id]=r.id;addLog(`Le camp ${r.name} a débauché ${c.name}.`);}}
    if(nC<5&&Math.random()<.06*DF().rv){
      const free=SC.cities.filter(k=>!G.owner[k]&&cityLv(k)<=R.lv+1);
      if(free.length){const k=pick(free);G.owner[k]=r.id;G.cityF[k]=r.faction;addLog(`Le camp ${r.name} a pris le contrôle de ${ci(k).inst} à ${ci(k).name}.`);}}
    const mine=myCities();
    if(mine.length&&G.month>2&&Math.random()<(.035+.01*nC)*DF().rv){
      const k=pick(mine);const c=ci(k);const pay=c.size*400;
      modal(`Guerre des concerts ! ${c.name}`,`Le camp ${r.name} a programmé un concert à ${c.inst} le même soir que le vôtre. Il veut vous prendre votre public et vos musiciens.`,
       [{t:'Relever le défi (duel musical)',cls:'crim',f(){const L=rivalLeader(r.id);L.city=k;openDuel(L,{noAdvance:true,title:'Guerre des concerts : défense',
          onWin(){addXP(25);addLog(`Repoussé le camp ${r.name} à ${c.name}.`);return`Le public de ${c.name} a choisi votre orchestre.`;},
          onLose(){G.owner[k]=r.id;G.cityF[k]=r.faction;addLog(`${c.name} perdue au profit du camp ${r.name}.`);return`${c.inst} est tombée aux mains du camp ${r.name}.`;}});}},
        {t:`Arrangement : ${fmt(pay)} fr`,dis:P().money<pay,f(){P().money-=pay;addLog(`Versé au camp ${r.name} un arrangement de ${fmt(pay)} pour garder ${c.name}.`);render();}},
        {t:'Céder',f(){G.owner[k]=r.id;G.cityF[k]=r.faction;addLog(`Cédé ${c.name} au camp ${r.name}.`);render();}}]);
    }
  }
}
function advance(n=1){
  for(let i=0;i<n;i++){
    G.month++;
    P().money+=income()-upkeep();
    P().stamina=clamp(P().stamina+8,0,100);
    if(G.pid==='bach'&&Math.random()<.15){P().money-=150;addLog('L\'entretien et l\'éducation des enfants ont coûté 150 francs.');}
    if(G.pid==='handel'&&Math.random()<.1){P().money-=300;addLog('Votre chanteuse vedette a exigé un cachet plus élevé. Il en a coûté 300 francs.');}
    if(G.sc==='s1905'&&plv()>=4&&Math.random()<.06){P().money+=1200;addLog('Une maison de disques a demandé des enregistrements. Recette de 1 200 francs.');}
    if(G.pid==='mozart'&&Math.random()<.18){const s=Math.round(rnd(150,450));P().money-=s;addLog(`${s} francs dilapidés au billard et en fêtes.`);}
    if(Math.random()<.25){const free=SC.cities.filter(k=>!G.owner[k]);if(free.length){const k=pick(free),f=pick(['Classique','Romantique','Virtuose']);if(G.cityF[k]!==f){G.cityF[k]=f;addLog(`${flab(f)} a gagné du terrain à ${ci(k).name}.`);}}}
    rivalAI();memberMonthly();growthMonthly();historicalDeaths();happenings();
    const d=ymd(G.month);
    checkAch();
    for(const e of EV[G.sc])if(e.y===d.y&&e.m===d.mo&&(!e.c||e.c())){PAPERMODE=true;try{e.run();}finally{PAPERMODE=false;}}
  }
  save();
}
function checkEnd(){
  if(G.over)return true;
  if(G.flags.pdeath){G.over=true;save();ending(G.pid==='mahler'?'Le Chant de la terre':'Mort à Venise',((DEATH[G.pid]||{}).t||'')+'Le grand concert est resté inachevé.');return true;}
  if(!G.flags.endless&&myCities().length>=DF().wc&&seatsFilled()>=DF().ws&&!G.flags.bossDone&&!(G.flags.bossRetry>G.month)&&$('#scene').classList.contains('hidden')){bossIntro();return true;}
  if(P().money<-2000){G.over=true;save();ending('Faillite','Les dettes ont dépassé 2 000 francs et l\'orchestre a été dissous.');return true;}
  if(!G.flags.endless&&G.month>=DF().lim){G.over=true;save();const d=ymd(G.month);ending('Le rideau tombe sur une époque',`L'année ${d.y} s'est achevée. Le grand concert n'a pas eu lieu, mais votre nom est inscrit dans l'histoire de la musique.`);return true;}
  return false;
}
function endAction(n=1){advance(n);render();checkEnd();}

function travel(k){
  if(k===P().city)return;
  const d=dist(P().city,k),mo=d<5?1:d<10?2:3,cost=120*mo,c=ci(k);
  const own=G.owner[k];
  modal(`Partir pour ${c.name}`,`En diligence : <b>${mo} mois</b>, voyage <b>${cost} francs</b>.<br><span style="font-size:12.5px">${c.inst} / Lv${cityLv(k)} / ${own==='player'?'Sous votre contrôle':own?rivalById(own).name+' : territoire du camp':flab(G.cityF[k])}</span>`,
   [{t:'Départ',cls:'gold',dis:P().money<cost,f(){P().money-=cost;P().city=k;addLog(`Arrivée à ${c.name}.`);endAction(mo);window.scrollTo(0,0);}},{t:'Annuler'}]);
}
function concert(){
  const k=P().city,c=ci(k);
  let inc=(c.size*130+plv()*70)*(1+G.members.length*.08)*(G.owner[k]==='player'?1.5:G.owner[k]?.7:1)*rnd(.8,1.2);
  if(k==='paris'&&G.flags.cholera&&G.month<G.flags.cholera)inc*=.5;
  const pc=pick(PL().pieces);
  P().money+=inc;P().stamina-=25;addXP(10+c.size*2);playMotif(pc.m,PL().tim);
  addLog(`Concert à ${c.name}. Programme : ${pc.t}. Recette : ${fmt(inc)} francs.`);
  modal('Concert',`<b>${c.inst}</b><br>Programme : ${pc.t}${G.members.length?`<br>Avec : ${G.members.slice(0,3).map(id=>charById(id).name).join(', ')}${G.members.length>3?' et d\'autres':''}`:''}${G.owner[k]&&G.owner[k]!=='player'?'<br><span style="font-size:12.5px">(territoire rival : la salle était clairsemée)</span>':''}<br><br>Recette <b>+${fmt(inc)} francs</b> / Renommée +${10+c.size*2}`,[{t:'Mois suivant',f(){endAction();}}]);
}
function salon(){
  P().money-=100;G.salonInsp=40;addXP(6);
  const pool=SC.chars.filter(c=>c.id!==G.pid).concat(rivalsActive());const r=pick(pool);
  let extra='';const here=freeChars().filter(x=>x.city===P().city);
  if(here.length&&Math.random()<.4){const h=pick(here);G.trust[h.id]=(G.trust[h.id]||0)+15;extra=`<br><br>Vous avez longuement conversé avec ${h.name}. <b>Affinité +15</b>`;}
  modal('Potins de salon',`Sous les lustres, vous avez entendu ce potin.<div class="trivia">[${r.name}] ${r.trivia}</div>Votre inspiration s'est élevée (inspiration +40 pour la prochaine persuasion). ${extra}`,[{t:'Mois suivant',f(){endAction();}}]);
}
function rest(){P().money-=60;P().stamina=clamp(P().stamina+50,0,100);addLog('Repos.');endAction();}
function war(){
  const k=P().city,rid=G.owner[k],L=rivalLeader(rid);L.city=k;
  openDuel(L,{title:'Guerre des concerts',onWin(){G.owner[k]='player';G.cityF[k]=P().faction;addXP(40+L.lv*5);addLog(`Le camp ${L.name} battu dans une guerre des concerts : vous vous emparez de ${ci(k).name} !`);return`${ci(k).inst} est désormais sous votre contrôle.`;},
    onLose(){G.trust['war_'+rid]=1;addLog(`Guerre des concerts perdue à ${ci(k).name}.`);return`Le bastion du camp ${L.name} a tenu. Augmentez votre renommée et revenez.`;}});

/* ======================= 説得 ======================= */
let S=null;
function openPersuade(t){
  if(gateFor(t)){modal('Porte close',`<b>${t.name}</b> : « Nous ne sommes pas du même rang. Faites-vous un nom et revenez. »<br><br><span style="font-size:12.5px">Un musicien ne vous écoute pas si son niveau dépasse votre niveau de renommée +1 (+2 pour les théâtres et les cours). Donnez des concerts pour accroître votre renommée.</span>`);return;}
  ac();const rv=!t.isCity&&G.charOwner[t.id];
  const ally=!t.isCity&&allyOf(t.id);
  S={t,rv,ally,meter:clamp((G.trust[t.id]||0)-(rv?40:0)+(ally?25:0),-60,85),round:0,max:8,insp:G.salonInsp||0,last:null,busy:false,done:false};
  G.salonInsp=0;
  $('#scene').innerHTML=`<div class="sc"><h3>${rv?'Débauchage':'Persuader'}</h3><div class="subt">Persuasione</div>
    <div class="vs"><div class="side">${portrait(G.pid,72,'var(--gold)')}<div>${P().name}</div></div><div class="mid">vs</div>
      <div class="side">${portrait(t.id,72,FCSS[t.faction])}<div>${t.name}<br><span style="font-size:11px;color:var(--mute)">Lv${t.lv} · ${flab(t.faction)}</span></div></div></div>
    <div class="meter"><div class="c0"></div><div class="ndl" id="ndl"></div></div><div class="mlab"><span>Rupture</span><span>Affinité</span><span>Conquis</span></div>
    <div class="bubbles" id="bubs"></div>
    <div class="insp" id="insp"><i id="inspI"></i></div><div class="mlab"><span>Inspiration</span><span id="inspT"></span></div>
    <div class="cmds" id="cmds">${CMDS.map(c=>`<button class="btn" data-c="${c.k}"><span style="font-family:var(--latin)">${c.ic}</span> ${c.t}<small>${c.k==='fee'?feeCost(t)+'fr':c.d}${likeMark(t,c.k)}</small></button>`).join('')}
      <button class="btn gold" id="cad">Cadence<small>quand l'inspiration est pleine</small></button></div>
    ${!t.isCity&&!isScouted(t.id)?'<div class="pmeta" style="margin-top:6px">* Sans repérage, impossible de savoir quelle approche a porté.</div>':''}<div class="rinfo"><span id="rnd"></span><button class="btn" id="quit" style="padding:3px 10px;font-size:12px">Se retirer</button></div></div>`;
  $('#scene').classList.remove('hidden');$('#scene').scrollTop=0;
  document.querySelectorAll('#cmds [data-c]').forEach(b=>b.onclick=()=>doCmd(b.dataset.c));
  $('#cad').onclick=cadenza;$('#quit').onclick=()=>finish('hold');
  if(S.ally)setTimeout(()=>bub('you',`(${S.ally.name} a glissé un mot en votre faveur : « ${t.name}, vous pouvez vous fier à cette personne. »)`,25,'weak','Le bon mot d\'un ami +25'),300);
  bub('them',t.isCity?`${t.sub} : « Soyez bref, je vous prie. »`:rv?`« Vous me demandez de trahir le maître ${rivalById(rv).name} ? »`:`« ${t.quip} »`,0,'');
  upd();
}
const feeCost=t=>80*t.lv;
function cmdPower(k,t){
  const L=plv();
  switch(k){
    case'fee':return(20+t.lv*2)*(teamHas('persuade')?1.4:1);
    case'scandal':return 10+L*3;
    case'theory':return 6+P().theory*2.6;
    case'fame':return Math.max(4,8+(L-t.lv)*6+L*2);
    case'passion':return(8+P().expr*2.4)*factionMult(P().faction,t.faction);
  }
}
function lineFor(k,t){
  if(k==='fee')return(t.feeLine||pick(PLINES.fee)).replace('{fee}',fmt(feeCost(t)));
  if(k==='fame')return pick(PL().fame);
  return pick(PLINES[k]);
}
function bub(side,text,val,cls,label){
  const b=document.createElement('div');b.className=`bub ${side} ${cls||''}`;b.style.fontSize=(13+Math.min(Math.abs(val),50)*.17)+'px';
  b.innerHTML=(label?`<span class="k">${label}</span>`:'')+text+(cls==='weak'?'<span class="fx">— cela porte !</span>':cls==='resist'?'<span class="fx">— sans effet…</span>':cls==='back'?'<span class="fx" style="color:#c22">— effet contraire !</span>':'');
  const box=$('#bubs');box.appendChild(b);box.scrollTop=box.scrollHeight;
}
function upd(){
  $('#ndl').style.left=`calc(${50+S.meter/2}% - 2px)`;
  $('#inspI').style.width=S.insp+'%';$('#insp').classList.toggle('full',S.insp>=100);$('#inspT').textContent=Math.round(S.insp)+'%';
  $('#rnd').textContent=`Mesure ${Math.min(S.round+1,S.max)} sur ${S.max}   Affinité ${Math.round(S.meter)}`;
  const lock=S.busy||S.done;
  document.querySelectorAll('#cmds [data-c]').forEach(b=>{b.disabled=lock||(b.dataset.c==='fee'&&P().money<feeCost(S.t));});
  $('#cad').disabled=lock||S.insp<100;
}
function doCmd(k){
  if(S.busy||S.done)return;const t=S.t;
  let pow=cmdPower(k,t),mult=likesOf(t)[k];
  if(k==='fee')P().money-=feeCost(t);
  if(S.last===k)pow*=.7;
  const val=Math.round(pow*mult*rnd(.85,1.15)*1.15);
  const cls=mult<0?'back':mult>=1.3?'weak':mult<.8?'resist':'';
  bub('you',lineFor(k,t),val,(t.isCity||isScouted(t.id))?cls:'',CMDS.find(c=>c.k===k).t);
  S.sy=(S.sy||0)+val;S.ny=(S.ny||0)+1;S.meter=clamp(S.meter+val,-100,100);S.insp=clamp(S.insp+14+(cls==='weak'?12:0),0,100);S.last=k;S.busy=true;upd();
  if(S.meter>=100)return setTimeout(()=>finish('win'),500);
  if(S.meter<=-100)return setTimeout(()=>finish('break'),500);
  setTimeout(counter,700);
}
function cadenza(){
  if(S.busy||S.done||S.insp<100)return;
  const val=Math.round(40+P().impro*2.2);playMotif(PL().motif,PL().tim);cutin(G.pid,'Cadence !','Emporter la décision par une improvisation');
  bub('you','(Vous enlevez d\'un trait une cadence improvisée… ♪)',val,'weak','Cadence');
  S.meter=clamp(S.meter+val,-100,100);S.insp=0;S.busy=true;upd();
  if(S.meter>=100)return setTimeout(()=>finish('win'),900);
  setTimeout(counter,1000);
}
function counter(){
  const t=S.t;const c=Math.round((3+t.lv*2.5+rnd(0,6))*(plv()>=t.lv?.85:1)*DF().ct*1.1);
  bub('them',`« ${pick(t.isCity?CLINES.city:CLINES[t.faction])} »`,c,'',t.name);
  S.st=(S.st||0)+c;S.nt=(S.nt||0)+1;S.meter=clamp(S.meter-c,-100,100);S.round++;S.busy=false;upd();
  if(S.meter<=-100)return setTimeout(()=>finish('break'),500);
  if(S.round>=S.max)return setTimeout(()=>finish('hold'),500);
}
function finish(r){
  if(S.done)return;S.done=true;upd();const t=S.t;
  if(r==='win'){
    delete G.trust[t.id];addXP(15+t.lv*5);
    if(t.isCity){G.owner[t.city]='player';G.cityF[t.city]=P().faction;addLog(`${t.name} est à vous ! ${ci(t.city).name} passe sous votre contrôle.`);playMotif('fanfare','piano');
      modal('Ville conquise',`<b>${t.name}</b> vous soutient désormais.<br>Vous recevez <b>+${ci(t.city).size*80} francs</b> chaque mois.`,[{t:'Mois suivant',f(){closeScene();endAction();}}]);}
    else{contract(t,S.rv);}
  }else if(r==='break'){
    G.trust[t.id]=-30;const canDuel=!t.isCity&&!S.rv&&(t.duel||OPP[P().faction]===t.faction);
    addLog(`Les pourparlers avec ${t.name} ont échoué.`);
    modal('Rupture',`${t.name} : « Inutile de poursuivre. Veuillez vous retirer. »${pAnalysis(t)}${canDuel?'<br><br>…Si les mots ne suffisent pas, il ne reste qu\'à <b>convaincre par le son</b>.':''}`,
      canDuel?[{t:'Convaincre en jouant',cls:'crim',dis:P().stamina<20,f(){openDuel(t);}},{t:'Se retirer',f(){closeScene();endAction();}}]:[{t:'Mois suivant',f(){closeScene();endAction();}}]);
  }else{
    G.trust[t.id]=Math.round((S.meter+(S.rv?40:0))*.6);
    modal('En suspens',`${t.name} : « Laissez-moi y réfléchir. »${pAnalysis(t)}<br>Vous pourrez reprendre à une affinité d'environ <b>${Math.round(S.meter*.6)}</b>.`,[{t:'Mois suivant',f(){closeScene();endAction();}}]);
  }
}
function closeScene(){$('#scene').classList.add('hidden');$('#scene').innerHTML='';}

let D=null;
function openDuel(t,opts){
  ac();opts=opts||{};D={t,opts,mv:0,you:0,them:0,piece:null,log:[]};
  const judge=ci(t.city).judge;

    <div class="vs"><div class="side">${portrait(G.pid,72,'var(--gold)')}<div>${P().name}</div></div><div class="mid">vs</div>
    <div class="side">${portrait(t.id,72,FCSS[t.faction])}<div>${t.name}<br><span style="font-size:11px;color:var(--mute)">Lv${t.lv}</span></div></div></div>
    <div class="tell">Juge : <b>${judge}</b><br>Morceau de l'adversaire : ${t.piece} (point fort : ${CARD[t.style].t})</div>

    ${PL().pieces.map((p,i)=>`<button class="btn piece" data-pc="${i}">${p.t}<small>+2 en ${CARD[p.b].t}</small></button>`).join('')}
    <div style="font-size:12px;color:var(--mute);margin-top:6px">Sur trois mouvements, chacun joue une carte : Technique, Expression ou Improvisation. La Technique l'emporte sur l'Expression, l'Expression sur l'Improvisation, l'Improvisation sur la Technique. Même du mauvais côté, un écart de capacité de 5 ou plus renverse le résultat. Au deuxième mouvement (Adagio), l'Expression reçoit +2 ; au troisième (Presto), la Technique reçoit +2.</div></div>`;
  $('#scene').classList.remove('hidden');$('#scene').scrollTop=0;
  document.querySelectorAll('[data-sec]').forEach(b=>b.onclick=()=>{D.second=D.second===b.dataset.sec?null:b.dataset.sec;document.querySelectorAll('[data-sec]').forEach(x=>x.classList.toggle('on',x.dataset.sec===D.second));});
  document.querySelectorAll('[data-pc]').forEach(b=>b.onclick=()=>{D.piece=PL().pieces[+b.dataset.pc];playMotif(D.piece.m,PL().tim);duelRound();});
}
function oppPick(){const w={tech:.25,expr:.25,impro:.25};w[D.t.style]=.5;let r=Math.random()*1.25;for(const k in w){r-=w[k];if(r<=0)return k;}return D.t.style;}
function statFor(k,who){
  const mv=MOVS[D.mv];
  if(who==='you')return P()[k]+(D.piece.b===k?2:0)+(mv.b===k?2:0)+((PL().duelB||{})[k]||0)+(D.second&&charById(D.second).style===k?Math.ceil(mlv(D.second)/2)+((skillOf(D.second)||{}).sec||0):0);
  return D.t[k]+(D.t.style===k?2:0)+(mv.b===k?2:0)+Math.max(0,D.t.lv-5);
}
function duelRound(){
  const t=D.t,mv=MOVS[D.mv];D.opp=oppPick();

  $('#scene').innerHTML=`<div class="sc"><h3>${mv.n}</h3><div class="subt">${mv.it}${mv.b?` — +2 en ${CARD[mv.b].t}`:''}</div>

    <div class="mvlog">${D.log.map(l=>`<p>${l}</p>`).join('')}</div></div>`;
  document.querySelectorAll('.pc').forEach(b=>b.onclick=()=>resolve(b.dataset.k));

function resolve(y){
  document.querySelectorAll('.pc').forEach(b=>b.disabled=true);
  const o=D.opp,t=D.t,mv=MOVS[D.mv];
  let ys=statFor(y,'you')+rnd(0,3),ts=statFor(o,'them')+rnd(0,3);let sn='';
  if(G.flags.noInst>G.month&&y==='tech'){ys-=2;sn='(sans instrument personnel : Technique -2)';}
  if(PL().tim==='violin'&&Math.random()<.12){if(y==='impro'){ys+=4;sn='<b style="color:var(--gold2)">La chanterelle a cassé ! Mais vous avez tenu jusqu\'au bout sur la seule corde de sol (Improvisation +4)</b>';}else{ys-=3;sn='<span style="color:#e77">La chanterelle a cassé ! (-3)</span>';}}
  let win,how;
  if(BEATS[y]===o){win=!(ts-ys>=5);how=win?'l\'avantage était de votre côté':'l\'avantage était de votre côté, mais une maîtrise écrasante l\'a renversé';}
  else if(BEATS[o]===y){win=ys-ts>=5;how=win?'l\'avantage était contre vous, mais une maîtrise écrasante l\'a renversé !':'l\'avantage a joué contre vous';}
  else{win=ys>=ts;how=`Même carte (${CARD[y].t}) : ${win?'vous l\'emportez de peu':'il s\'en est fallu de peu'}`;}
  const tim=PL().tim;if(y==='tech')playRun(tim);else if(y==='expr')playMotif(D.piece.m,tim);else playImpro(tim);
  if(win)D.you++;else D.them++;
  const cm=win?pick(['Toute la salle s\'est levée.','Les dames se sont évanouies l\'une après l\'autre.','Les « Bravo ! » ne cessent pas.']):pick([`Le son de ${t.name} a régné sur la salle.`,'Les applaudissements ont été plus longs pour l\'adversaire.','La salle se tait. L\'adversaire a gagné.']);
  D.log.unshift(`${sn?sn+'<br>':''}<b>${mv.n}</b>   Vous : ${CARD[y].t} / ${t.name} : ${CARD[o].t}   → ${win?'<span style="color:var(--gold2)">Gagné</span>':'<span style="color:#e77">Perdu</span>'} (${how})<br><span style="color:var(--mute)">${ci(t.city).judge} : ${cm}</span>`);
  D.mv++;
  setTimeout(()=>{if(D.you>=2||D.them>=2)duelEnd();else duelRound();},1300);
}
function duelEnd(){
  const t=D.t,o=D.opts,won=D.you>D.them;if(won)cutin(G.pid,'Victoire !',`${t.name} convaincu par le son`);P().stamina=clamp(P().stamina-20,0,100);
  const logs=D.log.map(l=>`<div style="font-size:12.5px;margin-bottom:6px">${l}</div>`).join('');
  const next=()=>{closeScene();if(o.noAdvance){save();render();checkEnd();}else endAction();};
  if(o.onWin){
    const msg=won?o.onWin():o.onLose();
    modal(won?'Victoire !':'Défaite',`${logs}<hr>${msg}`,[{t:o.noAdvance?'Fermer':'Mois suivant',f:next}]);return;
  }
  if(won){delete G.trust[t.id];G.members.push(t.id);ens5();G.sal[t.id]=demandOf(t.id);setMood(t.id,60);addXP(30+t.lv*8);addLog(`Duel musical remporté contre ${t.name} (${D.you}-${D.them}). ${t.name} a rejoint l'orchestre.`);
    modal('Victoire !',`${logs}<hr>${t.name} : « …Vous m'avez battu. ${t.join} »<br><br>Entre comme <b>${SL(t.seat)}</b>. Renommée +${30+t.lv*8}`,[{t:'Mois suivant',f:next}]);}
  else{G.trust[t.id]=-50;addXP(5);addLog(`Duel musical perdu contre ${t.name} (${D.you}-${D.them}).`);
    modal('Défaite',`${logs}<hr>${t.name} : « Revenez quand vous serez prêt. »<br><br>Endurance -20 / l'affinité tombe à -50. Augmentez votre renommée et réessayez.`,[{t:'Mois suivant',f:next}]);}
}

function mstat(id,k){if(id==='you')return P()[k];return charById(id)[k]+(G.boost[id]||0);}
function mlv(id){return id==='you'?plv():charById(id).lv+Math.floor((G.boost[id]||0)/2);}

function slotVal(id,p){const w=p.w;return(mstat(id,'tech')*w[0]+mstat(id,'expr')*w[1]+mstat(id,'impro')*w[2])*1.6+mlv(id)+(condOf(id)-1)*3;}
function pieceAvail(p){return!p.by||p.by===G.pid||isMember(p.by);}
function recitalPiece(){const pc=PL().pieces;return{id:'recital',t:`Récital en solo : ${pc[0].t} et autres`,form:'Soliste',slots:[{r:ptypeOf(),l:'Soliste (vous)',you:1}],w:[.4,.35,.25],fav:P().faction,by:null,motif:pc[0].m,tim:PL().tim};}
function candidates(s){const rs=[].concat(s.r);const out=[];if(rs.some(r=>ptypeOf().includes(r)))out.push('you');if(s.you)return out;for(const id of G.members)if(typesOf(id).some(t=>rs.includes(t)))out.push(id);return out;}
function evalLineup(p,L){
  let sum=0,best=-1,bestV=-99;const notes=[];
  p.slots.forEach((s,i)=>{const id=L[i];if(!id){sum-=6;notes.push(`${s.l} vacant (-6)`);return;}const v=slotVal(id,p);sum+=v;if(v>bestV){bestV=v;best=i;}});
  let q=sum/p.slots.length;
  const ids=L.filter(Boolean).map(realId);if(!ids.includes(G.pid))ids.push(G.pid);
  for(const [a,b,v,l] of SYN)if(ids.includes(a)&&ids.includes(b)){q+=v;notes.push(`${l} (${v>0?'+':''}${v})`);}
  if(p.by){if(L.filter(Boolean).map(realId).includes(p.by)){q+=6;notes.push('le compositeur joue lui-même (+6)');}else if(isMember(p.by)||p.by===G.pid){q+=3;notes.push('le compositeur est présent (+3)');}}
  const cf=G.cityF[P().city];let mult=1;
  if(p.fav===cf){mult=1.15;notes.push(`au goût de ${ci(P().city).name} (×1,15)`);}else if(OPP[p.fav]===cf){mult=.85;notes.push(`pas au goût de ${ci(P().city).name} (×0,85)`);}
  q*=mult;
  const stars=q<13?1:q<17?2:q<21?3:q<25?4:5;
  return{q,stars,notes,mvp:best};
}

function autoFill(){
  const p=PR.p;PR.L=p.slots.map(()=>null);const used=new Set();
  const order=p.slots.map((s,i)=>i).sort((a,b)=>candidates(p.slots[a]).length-candidates(p.slots[b]).length);
  for(const i of order){let best=null,bv=-99;for(const id of candidates(p.slots[i])){if(used.has(id))continue;const v=slotVal(id,p);if(v>bv){bv=v;best=id;}}if(best){PR.L[i]=best;used.add(best);}}
}

function slotVal(id,p,L,i){
  let v=(mstat(id,'tech')*p.w[0]+mstat(id,'expr')*p.w[1]+mstat(id,'impro')*p.w[2])*1.6+mlv(id)+(condOf(id)-1)*3;

  if(L&&i!=null){const st=[].concat(p.slots[i].r);L.forEach((o,j)=>{if(!o||o==='you'||j===i)return;const sk=skillOf(o);if(sk&&sk.k==='section'&&sk.t.some(t=>st.includes(t)))v+=sk.v;});}
  return v;
}
function evalLineup(p,L,opt){
  opt=opt||{};let sum=0;const notes=[],contrib=[];
  p.slots.forEach((s,i)=>{const id=L[i];
    if(opt.standIn===i){sum+=9;return;}
    if(!id){sum-=6;notes.push(`${s.l} vacant (-6)`);contrib.push(null);return;}
    const v=slotVal(id,p,L,i);sum+=v;contrib.push({i,id,v,sk:[]});});
  let q=sum/p.slots.length;
  const on=L.map((id,i)=>opt.standIn===i?null:id).filter(Boolean);
  const ids=on.map(realId);if(!ids.includes(G.pid))ids.push(G.pid);
  for(const [a,b,v,l] of SYN)if(ids.includes(a)&&ids.includes(b)){q+=v;notes.push(`Entente : ${l} (${v>0?'+':''}${v})`);}
  const hall=PR&&PR.hall;
  const cbonus=on.some(id=>id!=='you'&&(skillOf(id)||{}).k==='composer')?2:1;
  if(p.by){if(on.map(realId).includes(p.by)){q+=6*cbonus;notes.push(`le compositeur joue lui-même (+${6*cbonus})`);}else if(isMember(p.by)||p.by===G.pid){q+=3*cbonus;notes.push(`le compositeur est présent (+${3*cbonus})`);}}

function concertResult(p,L,ev,fi){
  const k=P().city,c=ci(k),h=PR.hall;
  const sizeF=c.size/4+.5,qF=.6+ev.stars*.15;
  let price=h.price;const pn=[];
  for(const id of L.filter(x=>x&&x!=='you')){const sk=skillOf(id);if(sk&&sk.k==='price'){price*=sk.v;pn.push(`★${charById(id).name} [${sk.n}] billets ×${sk.v}`);}}
  const f0=baseFill(h);
  const gate=h.cap*fi.f*price*sizeF*qF;
  const starPart=h.cap*(fi.f-f0)*price*sizeF*qF;
  let incB=0;const incN=[];
  for(const id of G.members){if(isAway(id))continue;const sk=skillOf(id);if(sk&&sk.k==='income'){const v=gate*sk.v;incB+=v;incN.push(`★${charById(id).name}[${sk.n}] +${fmt(v)}fr`);}}
  if(L.some(id=>id==='strauss'||id==='strauss2')&&p.form==='Bal'){incB+=gate*.2;incN.push(`Fièvre du bal +${fmt(gate*.2)} fr`);}
  let mult=1;if(k==='paris'&&G.flags.cholera&&G.month<G.flags.cholera)mult=.5;
  if(G.fire&&G.fire[k]>G.month)mult*=.6;
  const inc=Math.round((gate+incB)*mult-h.cost);
  let xp=(8+c.size*2)*(.5+ev.stars*.3)*h.xpF;const xpN=[];
  if(teamHas('press')){xp*=1.3;xpN.push('★Schumann [Neue Zeitschrift für Musik] renommée ×1,3');}
  if(ev.stars>=4&&L.includes('cimarosa')){xp*=1.5;xpN.push('★Cimarosa [Roi des bis] renommée ×1,5');}
  xp=Math.round(xp);
  P().money+=inc;addXP(xp);if(PR.mode!=='boss')P().stamina=clamp(P().stamina-(L.includes('you')?25:10),0,100);
  const grow=[];
  for(const id of L.filter(x=>x&&x!=='you')){G.bond[id]=(G.bond[id]||0)+1;const g=gainExp(id,10);if(g)grow.push(g);
    setMood(id,moodOf(id)+(ev.stars>=4?6:ev.stars<=2?-4:1));}
  for(const id of G.members)if(hasQ(id,'diva')&&!L.includes(id)&&!isAway(id))setMood(id,moodOf(id)-5);
  const chemUp=chemAfter(L);
  const mvpId=ev.mvp>=0?L[ev.mvp]:null,mvpSlot=ev.mvp>=0?p.slots[ev.mvp].l:'';
  if(mvpId&&mvpId!=='you')setMood(mvpId,moodOf(mvpId)+8);
  let cf='';
  if(mvpId){const e2=evalLineup(p,L,{standIn:ev.mvp});cf=`Sans <b>${nameOf(mvpId)}</b> (avec un remplaçant), l'accueil aurait été de ${STARS(e2.stars)}. Grâce à ce musicien, force +${Math.round(ev.q-e2.q)}.`;}
  const tot=ev.contrib.filter(Boolean).reduce((a,c2)=>a+Math.max(0,c2.v),0)||1;
  const bars=ev.contrib.filter(Boolean).sort((a,b)=>b.v-a.v).map(c2=>`<div class="cb">${portrait(realId(c2.id),26)}<span class="cn">${nameOf(c2.id)}</span><span class="cbar"><i style="width:${Math.max(4,c2.v/tot*100*1.6)}%"></i></span><b>${Math.round(c2.v)}</b></div>`).join('');
  const heads=['','On crie « Remboursez ! »','Une soirée décevante','Une exécution solide','Le public s\'est enflammé','Une soirée pour l\'histoire'];
  const bodies=['','Les quolibets ont fusé du parterre, et plus d\'un spectateur est parti avant la fin.','L\'ambition était louable, mais la finition laissait à désirer.','Rien de tapageur, mais la qualité de l\'orchestre est indéniable.','Les applaudissements ne voulaient pas cesser, et l\'on réclama trois bis.','Après le concert, le public s\'est répandu dans les rues comme pris de fièvre. On parlera longtemps de cette soirée.'];
  if(ev.stars>=5&&mvpId)cutin(realId(mvpId),'Bravo !',`Héros de la soirée : ${nameOf(mvpId)}`);
  const d=ymd(G.month);
  G.cons=G.cons||[];G.cons.push({d:`${d.y}.${d.mo}`,t:p.t,h:h.name,s:ev.stars,mvp:mvpId?nameOf(mvpId):'',mvpId:mvpId?realId(mvpId):null,inc});if(ev.stars>=5)hpush(`Un concert ★5 : ${p.t} (${h.name}). Héros : ${mvpId?nameOf(mvpId):'-'}`);
  addLog(`${p.t} à ${h.name}. Accueil ${STARS(ev.stars)}, solde ${inc>=0?'+':''}${fmt(inc)} fr. Héros : ${mvpId?nameOf(mvpId):'-'}`);
  setTimeout(()=>modal(paperOf(k),`<div class="headline">${heads[ev.stars]}</div><div class="dateline">${__i18n.mon(d.mo)} ${d.y}   ${h.name}</div>
    <p>L'orchestre ${P().name} a donné ${p.t}. ${bodies[ev.stars]}${mvpId?`Surtout, <b>${nameOf(mvpId)}</b> (${mvpSlot}) fut magnifique.`:''}</p>
    <div class="stars">${STARS(ev.stars)}</div>
    <div class="sec-p">L'apport de chaque interprète</div>${bars}
    ${cf?`<p style="font-size:12.5px">${cf}</p>`:''}
    <div class="sec-p">Les comptes</div>
    <p style="font-size:12.5px">Billets ${fmt(gate)} fr (salle ${Math.round(fi.f*100)} % · ${h.cap} places)${starPart>1?`<br>   dont attirés par les idoles du public <b>+${fmt(starPart)} fr</b> (${fi.notes.join(', ')})`:''}${pn.length?'<br>  '+pn.join(', '):''}${incN.length?'<br>'+incN.join('<br>'):''}${mult<1?`<br>Recette amputée par un coup du sort (×${mult})`:''}<br>Location de la salle -${h.cost} fr<br><b>Solde ${inc>=0?'+':''}${fmt(inc)} fr</b> / Renommée +${xp}${xpN.length?' ('+xpN.join(', ')+')':''}</p>
    ${grow.length?`<p>Progrès par l'expérience : <b>${grow.join(', ')}</b></p>`:''}${chemUp.length?`<p>Cohésion renforcée : <b>${chemUp.join(', ')}</b></p>`:''}`,[{t:'Mois suivant',f(){closeScene();endAction();}}],'paper'),ev.stars>=5?1500:0);
}

function memberMonthly(){
  ens();

  for(const id of ms){

       [{t:'Envoyer en cure thermale (-400 fr)<small>guérison plus rapide, satisfaction +10</small>',cls:'gold',dis:P().money<400,f(){P().money-=400;G.away[id].until=G.month+1;setMood(id,moodOf(id)+10);addLog(`${c.name} est parti prendre les eaux.`);render();}},
        {t:'Attendre<small>parfois l\'état s\'aggrave</small>',f(){G.away[id].risk=1;render();}}]);continue;}

    if(hasQ(id,'reviser')&&Math.random()<.1){G.away[id]={until:G.month+1,why:'Révision d\'une symphonie'};addLog(`${c.name} est absorbé par la révision d'une symphonie : absent ce mois-ci.`);continue;}
    if(hasQ(id,'debtor')&&Math.random()<.1&&one()){const x=c.lv*150;modal(`${c.name} demande un prêt`,`${portraitRow(id)} : « Environ ${x} francs, pour quelque temps seulement… Je vous les rendrai sans faute. »<div class="trivia">Travers : Emprunteur. Aucun remboursement n'a jamais été constaté.</div>`,
       [{t:`Prêter (-${x} fr)<small>satisfaction +10</small>`,dis:P().money<x,f(){P().money-=x;setMood(id,moodOf(id)+10);render();}},{t:'Refuser<small>satisfaction -20</small>',f(){setMood(id,moodOf(id)-20);render();}}]);continue;}
    if(hasQ(id,'temper')&&G.members.length>=2&&Math.random()<.08&&one()){const o=pick(G.members.filter(x=>x!==id));const oc=charById(o);
      modal('Dispute dans l\'orchestre',`${portraitRow(id)}${portraitRow(o)}${c.name} et ${oc.name} se sont violemment querellés en répétition. Pour qui prenez-vous parti ?<div class="trivia">Travers : Difficile</div>`,
       [{t:`Prendre le parti de ${c.name}`,f(){setMood(id,moodOf(id)+10);setMood(o,moodOf(o)-25);render();}},{t:`Prendre le parti de ${oc.name}`,f(){setMood(o,moodOf(o)+10);setMood(id,moodOf(id)-25);render();}},{t:'Une gratification aux deux (-300 fr)',dis:P().money<300,f(){P().money-=300;render();}}]);continue;}
    if(moodOf(id)<=25&&!hasQ(id,'loyal')&&one()){const x=c.lv*300;
      modal(`${c.name} demande à partir`,`${portraitRow(id)} : « Je ne vois plus d'avenir dans cet orchestre. »${hasQ(id,'greedy')?'<br>(Le mécontentement sur les salaires couvait, semble-t-il.)':''}`,

const GROW={liszt:'early',thalberg:'early',malibran:'early',bellini:'early',viotti:'early',storace:'early',aloysia:'early',stgeorges:'early',sarasate:'early',pasta:'early',patti:'early',
 bruckner:'late',beethoven:'late',haydn:'late',dvorak:'late',franchomme:'late',wagner:'late',tchaikovsky:'late',boehmfl:'late',richter:'late',schumann:'late',clara:'late',joachim:'late',stadler:'late',davydov:'late',muhlfeld:'late'};
const GLBL={early:'Précoce',normal:'Normal',late:'Tardif'};
const growOf=id=>GROW[id]||'normal';
function potOf(id){const c=charById(id);if(!c)return 3;let h=0;for(const ch of id)h=(h*31+ch.charCodeAt(0))%97;return clamp(c.lv-2+(h%3),2,7);}

function phaseMult(id){const g=growOf(id),m=G.month;if(g==='early')return m<36?2:m<60?1:.3;if(g==='late')return m<30?.5:1.8;return 1;}
function gainExp(id,base){
  ens5();const c=charById(id);if(!c)return null;
  G.exp[id]=(G.exp[id]||0)+base*phaseMult(id);
  if(G.exp[id]>=30){G.exp[id]-=30;const pot=potOf(id);if((G.boost[id]||0)<pot){G.boost[id]=(G.boost[id]||0)+1;return`${c.name} (toutes capacités +1)`;}}
  return null;
}
function growthMonthly(){
  ens5();if(G.month<60)return;
  for(const id of G.members){if(growOf(id)!=='early')continue;const last=G.decl[id]||0;
    if(G.month-Math.max(60,last)>=18||(!last&&G.month===60)){G.decl[id]=G.month;G.boost[id]=Math.max(-3,(G.boost[id]||0)-1);addLog(`[Précoce] ${charById(id).name} commence à décliner (toutes capacités -1).`);}}

/* ---- 相性 ---- */
function hash2(a,b){const s=[a,b].sort().join('|');let h=7;for(const ch of s)h=(h*131+ch.charCodeAt(0))%1009;return h;}
function compat(a,b){
  if(a==='you')a=G.pid;if(b==='you')b=G.pid;
  for(const [x,y,v] of SYN)if((x===a&&y===b)||(x===b&&y===a))return v>0?2:v<0?-2:0;
  const A=charById(a)||(a===G.pid?{faction:P().faction}:null),B=charById(b)||(b===G.pid?{faction:P().faction}:null);
  let s=0;if(A&&B){if(A.faction===B.faction)s+=.6;else if(OPP[A.faction]===B.faction)s-=.8;}
  if(hasQ(a,'temper')&&hasQ(b,'temper'))s-=1;if(hasQ(a,'diva')&&hasQ(b,'diva'))s-=1.2;
  if(hasQ(a,'loyal')||hasQ(b,'loyal'))s+=.4;
  s+=((hash2(a,b)%5)-2)*.45;
  return s>=.9?1:s<=-.9?-1:0;
}
const CMARK=v=>v>=2?'<span style="color:#7fe0b0">◎</span>':v===1?'<span style="color:#a8e0c8">○</span>':v<0?'<span style="color:#f88">✕</span>':'<span style="color:#aaa">－</span>';

const ckey=(a,b)=>[a==='you'?G.pid:a,b==='you'?G.pid:b].sort().join('|');
function chemLv(a,b){ens5();return Math.min(5,Math.floor((G.chem[ckey(a,b)]||0)/2));}
function pairs(L){const on=L.filter(Boolean);const out=[];for(let i=0;i<on.length;i++)for(let j=i+1;j<on.length;j++)out.push([on[i],on[j]]);return out;}
function chemBonus(L){
  let tot=0;const det=[];
  for(const [a,b] of pairs(L)){const lv=chemLv(a,b),cp=compat(a,b);let v=lv*(cp>0?.6:cp<0?.3:.45);if(cp<0)v-=1.5;tot+=v;if(lv>0||cp!==0)det.push({a,b,lv,cp,v});}
  return{tot,det:det.sort((x,y)=>Math.abs(y.v)-Math.abs(x.v))};
}
function chemAfter(L){

  for(const [a,b] of pairs(L)){const k=ckey(a,b),cp=compat(a,b),before=chemLv(a,b);G.chem[k]=(G.chem[k]||0)+(cp>0?2:cp<0?.5:1);const after=chemLv(a,b);

}

const beatBy=k=>Object.keys(BEATS).find(c=>BEATS[c]===k);

function statParts(k,who){

  if(who==='you'){
    L.push(['Capacité',P()[k]]);

    if(mv.b===k)L.push([mv.it.split(' ')[0],2]);
    const ib=(PL().duelB||{})[k];if(ib)L.push(['Instrument',ib]);
    if(D.second&&charById(D.second).style===k)L.push([`Second ${charById(D.second).name}`,Math.ceil(mlv(D.second)/2)+((skillOf(D.second)||{}).sec||0)]);

}
function statFor(k,who){return statParts(k,who).tot;}

    <div class="tell">${t.name} : ${TELLS[tellK]}<br><span class="pmeta">L'indice est vrai 7 fois sur 10. S'il désigne « ${CARD[tellK].t} », « ${CARD[beatBy(tellK)].t} » a l'avantage.</span></div>
    <div class="card" style="font-size:12.5px;padding:8px 10px">Force de l'adversaire (ce mouvement) : ${Object.keys(CARD).map(k=>`${CARD[k].t} <b>${statFor(k,'them')}</b>`).join(' ·')}<br><span class="pmeta">Carte favorite : « ${CARD[t.style].t} » (jouée une fois sur deux)</span></div>
    <div class="cards3">${Object.keys(CARD).map(k=>`<button class="pc" data-k="${k}"><span class="ic">${CARD[k].ic}</span>${CARD[k].t}<small>${CARD[k].d}<br>Vous <b>${statFor(k,'you')}</b></small></button>`).join('')}</div>
    <div class="pmeta" style="margin-top:6px">Règles : la carte avantagée l'emporte, sauf si la force adverse est supérieure de 5 ou plus, ce qui renverse le résultat. Deux cartes identiques se départagent à la force. Chacun ajoute de 0 à 3 pour « la forme du soir ».</div>
    <div class="mvlog">${D.log.map(l=>`<p>${l}</p>`).join('')}</div></div>`;

function resolve(y){
  document.querySelectorAll('.pc').forEach(b=>b.disabled=true);
  const o=D.opp,t=D.t,mv=MOVS[D.mv];
  const yp=statParts(y,'you'),tp=statParts(o,'them'),ry=rnd(0,3),rt=rnd(0,3);
  let ys=yp.tot+ry,ts=tp.tot+rt,sn='';
  if(PL().tim==='violin'&&Math.random()<.12){if(y==='impro'){ys+=4;sn='<b style="color:var(--gold2)">La chanterelle a cassé ! Mais vous avez tenu jusqu\'au bout sur la seule corde de sol (Improvisation +4)</b>';}else{ys-=3;sn='<span style="color:#e77">La chanterelle a cassé ! (-3)</span>';}}
  let win,how,type,rel;

  else{rel=`Cartes : ${CARD[y].t} contre ${CARD[y].t} (départagé à la force)`;win=ys>=ts;type='tie';how=win?`plus fort de ${(ys-ts).toFixed(1)}`:`plus faible de ${(ts-ys).toFixed(1)}`;}

  const cm=win?pick(['Toute la salle s\'est levée.','Les dames se sont évanouies l\'une après l\'autre.','Les « Bravo ! » ne cessent pas.']):pick([`Le son de ${t.name} a régné sur la salle.`,'Les applaudissements ont été plus longs pour l\'adversaire.','La salle se tait. L\'adversaire a gagné.']);

   <br>${t.name} ${fmtParts(tp)} + forme ${rt.toFixed(1)} = <b>${ts.toFixed(1)}</b>
   <br>Verdict : ${how}<br><span class="pmeta">${ci(t.city).judge} : ${cm}</span>`);
  D.mv++;

function duelAnalysis(won){
  const r=D.rec||[],t=D.t,out=[];
  const ay=avg(r.map(x=>x.yp)),at=avg(r.map(x=>x.tp));
  if(won){
    const rps=r.filter(x=>x.win&&x.type==='rps').length,up=r.filter(x=>x.win&&x.type==='upset').length;
    if(rps)out.push(`Vous aviez l'avantage des cartes dans ${rps} mouvement(s).`);if(up)out.push(`Dans ${up} mouvement(s), votre force a renversé un désavantage.`);
    if(D.second)out.push(`L'atout de votre second (${charById(D.second).name}) a porté.`);
    out.push(`Force moyenne : vous ${ay.toFixed(1)} / adversaire ${at.toFixed(1)}.`);
    return`<div class="anl"><b>Pourquoi vous avez gagné</b><br>${out.join('<br>')}</div>`;
  }
  const lost=r.filter(x=>!x.win);
  const rpsL=lost.filter(x=>x.type==='rps'),upL=lost.filter(x=>x.type==='upset'),tieL=lost.filter(x=>x.type==='tie');
  if(rpsL.length){const lied=rpsL.filter(x=>!x.tellTrue).length,ignored=rpsL.filter(x=>x.tellTrue&&!x.followed).length;
    out.push(` · <b>Désavantage des cartes ${rpsL.length} fois</b>. ${ignored?`Vous êtes allé contre un indice vrai ${ignored} fois.`:''}${lied?`Malchance d'un indice faux ${lied} fois.`:''}`);}
  if(upL.length)out.push(` · <b>Avantage des cartes renversé par la force ${upL.length} fois</b>. L'adversaire avait 5 de force en plus, ou davantage.`);
  if(tieL.length)out.push(` · <b>${tieL.length} duel(s) de force perdu(s) à cartes égales</b>.`);
  out.push(` · Force moyenne : vous ${ay.toFixed(1)} / ${t.name} ${at.toFixed(1)}${at-ay>=2?'. Vous êtes tout simplement surclassé':''}.`);
  const tips=[];
  tips.push(`${t.name} préfère « ${CARD[t.style].t} » et la joue une fois sur deux. Dans le doute, « ${CARD[beatBy(t.style)].t} » est le choix sûr.`);
  if(at-ay>=2)tips.push('Élever votre niveau de renommée par les concerts ajoute +1 à la Technique, à l\'Expression ou à l\'Improvisation à chaque niveau.');
  if(!D.second&&G.members.length)tips.push('Vous n\'aviez pas de second. Avec un second, sa meilleure carte est renforcée.');
  if(D.second)tips.push(`L'atout de votre second ne vaut que pour « ${CARD[charById(D.second).style].t} ». Choisissez-le en fonction de l'adversaire.`);
  tips.push(`Le morceau choisi donne +2 à sa carte. Le deuxième mouvement ajoute +2 à l'Expression, le troisième +2 à la Technique.`);
  return`<div class="anl"><b>Pourquoi vous avez perdu</b><br>${out.join('<br>')}<br><b>Conseil pour la prochaine fois</b><br>${tips.map(x=>' ·'+x).join('<br>')}</div>`;
}

function howto(){return `<details class="card howto" style="margin-top:12px"><summary style="color:var(--gold2)">Comment jouer</summary><ol>
  <li>Touchez une ville sur la carte pour voyager. <b>Persuadez</b> les musiciens de chaque ville de rejoindre votre orchestre.</li>
  <li>Une persuasion dure 8 mesures. Usez tour à tour du Cachet, du Scandale, de la Théorie, de la Renommée et de la Passion ; poussez l'aiguille d'affinité tout à droite et la personne est conquise. Chacun est sensible à des approches différentes (et répéter la même l'affaiblit).</li>
  <li>Quand l'inspiration est pleine, une <b>cadence</b> donne une forte poussée. Fréquentez d'abord un salon et vous commencerez avec une réserve d'inspiration.</li>
  <li>Si les pourparlers échouent, vous pouvez convaincre par un <b>duel musical</b> : Technique, Expression et Improvisation, comme à pierre-feuille-ciseaux.</li>
  <li>Persuadez le maître d'une ville (un théâtre ou une cour) et la ville est à vous, avec un revenu chaque mois.</li>
  <li>Chaque mois, les <b>camps rivaux</b> débauchent des musiciens, s'emparent de villes et lancent des <b>guerres des concerts</b> contre les vôtres. Reprenez leurs villes par la guerre des concerts et leurs partisans par le débauchage.</li>
  <li>Ceux qui vous dépassent de trop (niveau supérieur à votre niveau de renommée +2) vous ferment leur porte. Donnez des concerts pour accroître votre renommée.</li>
  <li>Choisissez une salle : <b>salon, salle moyenne ou grand théâtre</b>. Plus elle est grande, plus elle rapporte, mais plus elle se vide facilement. Les réactions du public (bravos, bouquets, pâmoisons, huées, somnolence, départs) dépendent de l'accueil.</li>
  <li>Chaque musicien a un <b>★talent</b> (affluence +20 %, cordes +3, revenus de leçons…) et un <b>travers</b> (santé fragile, avare, difficile, cœur volage…). Quand la satisfaction baisse, il peut partir, ou passer chez un rival. Un ami déjà dans votre orchestre glissera un mot en votre faveur pendant la persuasion.</li>
  <li><b>Recrutement</b> : d'abord le 🔍repérage (150 fr), pour connaître les approches efficaces, le type de progression (précoce / normal / tardif), le potentiel, les conditions du contrat et l'entente. Sans repérage, impossible de savoir quelle approche a porté. Une fois la personne conquise, négociez la prime de signature et le salaire (marchander est un pari).</li>
  <li><b>Cohésion et entente</b> : plus deux musiciens jouent ensemble, plus leur niveau de cohésion monte et meilleur est l'accueil. Les duos d'entente ◎○ progressent vite ; les duos ✕ se tirent vers le bas et perdent en satisfaction.</li>
  <li><b>Types de progression</b> : les précoces progressent vite au début mais déclinent dès la cinquième année ; les tardifs progressent fortement après deux ans et demi.</li>
  <li>Remplissez les conditions de victoire et vous affrontez le <b>duel final</b> (en trois manches). Gagnez-le : le grand concert suit.</li>
  <li>Au <b>concert</b>, vous choisissez le programme et placez vos musiciens à chaque partie, comme une formation de football. Les capacités que demande l'œuvre, la forme (qui change chaque mois), les duos historiques (entente), la présence du compositeur et le goût de la ville décident de l'accueil (★).</li>
  <li>En duel musical, prendre un musicien pour <b>second</b> renforce sa meilleure carte.</li>
  <li>Il y a cinq niveaux de difficulté : Débutant, Normal, Difficile, Très difficile, Enfer. Les conditions de victoire (villes tenues et pupitres occupés) et la limite de temps en dépendent. Plus vous tenez de villes, plus les théâtres et les cours restants se méfient, et leur rang s'élève.</li>
  <li>La renommée plafonne au Lv30. Après la victoire, vous pouvez continuer sans limite de temps en mode sans fin et collectionner les 🏅succès.</li></ol></details>`;}

function uSets(ids){const real=ids.map(realId);const out=[];for(const s of USETS){if(s.guest){const n=ids.filter(id=>guestEra(id)).length;if(n>=s.need)out.push(s);continue;}if(s.ids.filter(x=>real.includes(x)).length>=s.need)out.push(s);}return out;}
function startUBattle(B){

function uAtk(B,u){

}
function uSim(B,encore){

  if(UST==='door')return head+`<div class="card pmeta">Une joute contre des musiciens d'au-delà de votre époque. La victoire vous vaut une « Invitation par-delà le temps », qui permet d'inviter dans votre orchestre un musicien d'une autre époque (frais de voyage doublés, 1 mois).</div>`+

  const f=G.fleet[0];const brk=f.filter(id=>uhs(id)>=3).map(nameOf);

    <div class="pmeta" style="margin-top:6px">Itinéraire : ${r.route.map(s=>s.map(n=>`${n}${' ('+r.nodes[n].t+')'}`).join(' / ')).join(' → ')}</div>

   <div class="sec-t">Bastions par ville</div><div class="card" style="font-size:12.5px">${SC.cities.map(x=>{const o=G.owner[x];if(o==='player')return`<div>${ci(x).name} : <b style="color:var(--gold2)">à vous</b></div>`;const s=sgOf(x);return`<div>${ci(x).name} : bastion ${s.g}/${s.max}${o?` (camp ${rivalById(o).name})`:''}</div>`;}).join('')}<span class="pmeta">Une tournée vise la ville où vous êtes. Déplacez-vous d'abord sur la carte, puis partez.</span></div>`;

function uFleetPow(){return Math.round(G.fleet[0].reduce((a,id)=>a+(mstat(id,'tech')+mstat(id,'expr')+mstat(id,'impro'))/3*2+ulv(id)/3,0));}
function uExpCheck(e){const f=G.fleet[1].filter(id=>G.members.includes(id));if(f.length<e.req.num)return`il faut ${e.req.num} musiciens ou plus`;if(e.req.types&&!f.some(id=>typesOf(id).some(t=>e.req.types.includes(t))))return`il faut ${e.req.types.map(t=>U_TN[t]).join(' ou')}`;if(e.req.lvsum&&f.reduce((a,id)=>a+ulv(id),0)<e.req.lvsum)return`il faut un niveau total de ${e.req.lvsum} ou plus`;return'';}

evalLineup=function(p,L,opt){
  const r=_evalLineupV(p,L,opt);opt=opt||{};
  if(p.form!=='Concerto'||!p.slots[0]||!/[Ss]oliste/.test(p.slots[0].l))return r;
  const sid=opt.standIn===0?null:L[0];
  if(!sid){r.q-=8;r.notes.unshift('un concerto sans soliste (-8)');}
  else{
    const c=r.contrib.find(x=>x&&x.i===0);const others=r.contrib.filter(x=>x&&x.i!==0);const avg=others.length?others.reduce((a,x)=>a+x.v,0)/others.length:c.v;
    const add=(c.v-avg)*.8;r.q+=add/Math.max(1,p.slots.length/2);r.notes.unshift(`Dans un concerto, le soliste est la vedette : ${nameOf(sid)} (${add>=0?'+':''}${(add/Math.max(1,p.slots.length/2)).toFixed(1)})`);
    const real=realId(sid),cf=CONC[p.id];
    if(cf&&cf.sol.includes(real)){r.q+=4;r.notes.unshift(`★Rôle fétiche ! ${nameOf(sid)} (${p.t.replace(/ ?\(.*\)/,'')}) — ${cf.t} (+4)`);c.v+=4;c.sk.push('Rôle fétiche');}
    const best=['tech','expr','impro'].sort((a,b)=>mstat(sid,b)-mstat(sid,a))[0];const need=['tech','expr','impro'][p.w.indexOf(Math.max(...p.w))];
    if(best===need){r.q+=1.5;r.notes.push(`le style du soliste convient à l'œuvre (+1,5)`);}
    const inst=(typeof ueqOf==='function'&&G.ux&&G.ux[sid])?ueqOf(sid).filter(e=>UEQ[e.id].cat==='inst'||UEQ[e.id].cat==='bow'):[];
    const iv=inst.reduce((a,e)=>a+(eqStat(e,'tech',sid)+eqStat(e,'expr',sid)),0);
    if(iv){r.q+=iv*.5;r.notes.push(`l'instrument du soliste chante : ${inst.map(e=>eqName(e)).join('＋')} (+${(iv*.5).toFixed(1)})`);}
  }
  r.stars=r.q<13?1:r.q<17?2:r.q<21?3:r.q<25?4:5;
  let mvp=-1,bv=-99;r.contrib.forEach(c=>{if(c&&c.v>bv){bv=c.v;mvp=c.i;}});r.mvp=mvp;

};

function dudHit(B,u){
  const q=QUIRK[realId(u.id)]||[];if(!q.length)return null;const nm=nameOf(u.id);const r=Math.random();
  if(q.includes('face')&&r<.2){const tg=B.en.filter(e=>e.hp>0);if(!tg.length)return null;const e=pick(tg);const d=Math.round(e.max*.12);e.hp=Math.max(0,e.hp-d);u.dealt+=d;
    B.ev.push({k:'hit',u:u.i,e:B.en.indexOf(e),d,crit:true,txt:'Une grimace de toute son âme ! L\'adversaire s\'est tordu de rire',kill:e.hp<=0});return'stop';}
  if(q.includes('wrong')&&r<.25){B.ev.push({k:'miss',u:u.i,e:0,txt:`${nm} a manqué une note en beauté`});return'stop';}
  if(q.includes('rhythm')&&r<.2){const al=B.us.filter(x=>x.hp>0&&x!==u);if(al.length){const v=pick(al);const d=Math.max(1,Math.round(v.max*.05));v.hp=Math.max(1,v.hp-d);
    B.ev.push({k:'skip',txt:`Le rythme de ${nm} a flotté et entraîné ${nameOf(v.id)} avec lui (moral -${d})`});return'stop';}}
  if(q.includes('roukai')&&r<.12){B.ev.push({k:'skip',txt:`${nm} : « De mon temps, voyez-vous… » Les histoires d'autrefois ont commencé, en scène`});return'stop';}
  return null;
}

  for(let i=0;i<ms.length;i++){const [id,nm,lv,kai,ge]=ms[i];const im=await svgImg(ptEra(id,ge||D.sc,sz,kai?'#e9a0f0':'#c9a24a'));const X=x0+i*(sz+gap);if(im)x.drawImage(im,X,790,sz,sz*1.2);
    txt(nm.length>7?nm.slice(0,7):nm,X+sz/2,790+sz*1.2+34,24,'#f0e2c0');txt(`Lv${lv}${kai?' éveillé':''}${ge?' invité':''}`,X+sz/2,790+sz*1.2+64,20,'#c9b48a');}
  let Y=1080;if(D.se.length){txt(`Liens historiques : ${D.se.map(s=>`[${s}]`).join('')}`,W/2,Y,26,'#f0d58a');Y+=44;}
  Y=wrap(D.ep,90,Y,W-180,24,'#d8c9a8',36,3);
  const hs=D.h.slice(-Math.max(0,Math.floor((H-130-Y)/34))).slice(-6);
  if(hs.length){Y+=6;x.strokeStyle='#6b5530';x.beginPath();x.moveTo(90,Y-24);x.lineTo(W-90,Y-24);x.stroke();
    for(const [d,t] of hs){x.font=`20px ${F}`;x.fillStyle='#c9a24a';x.textAlign='left';x.fillText(d,90,Y);x.fillStyle='#d8c9a8';let s=t;while(x.measureText(s).width>W-300&&s.length>4)s=s.slice(0,-2);if(s!==t)s+='…';x.fillText(s,200,Y);Y+=34;}}
  txt('Concerto Storm',W/2,H-70,26,'#a08a5c');
  return new Promise(res=>c.toBlob(b=>res(b),'image/png'));
}

function rtStat(mv){
  let v=mstat('you',mv.st);

  if(D.second){const c=charById(D.second);if(c&&c.style===mv.st)v+=Math.ceil(mlv(D.second)/2);}
  return v;
}
function rtEff(mv){
  const R=RTS,t=R.t;let e=1,tags=[];
  if(['tech','expr','impro'].includes(mv.k)){if(BEATS[mv.k]===t.style){e*=1.4;tags.push('Point faible');}else if(mv.k===t.style){e*=.8;tags.push('Son terrain');}}
  const pm=RT_PHASES[R.ph].m[mv.k];if(pm){e*=pm;if(pm>1)tags.push('Mouvement');}
  if(R.run>3){e*=Math.max(.35,1-(R.run-3)*.08);if(R.run===6)rtSay('Toujours le même tour… le public se lasse','warn');}

function rtTap(k){

function rtHit(mv,mult,extra){
  const R=RTS;const now=performance.now()/1000;
  R.combo=now-R.lastHit<.85?R.combo+1:1;R.lastHit=now;R.maxC=Math.max(R.maxC,R.combo);

function rtLoop(){
  let prev=performance.now();

    R.time-=dt;R.phT-=dt;if(R.phT<=0){R.ph=(R.ph+1)%RT_PHASES.length;R.phT=9;const P_=RT_PHASES[R.ph];rtSay(`${P_.n}${P_.h?'――'+P_.h:''}`,'phase');}

const _performA=perform;
perform=function(){
  _performA();
  const stage=document.querySelector('#scene .stage');if(!stage||!PR)return;
  const p=PR.p,L=PR.L;
  /* 幕が開く */
  stage.insertAdjacentHTML('beforeend','<div class="curtain l"></div><div class="curtain r"></div>');
  setTimeout(()=>stage.classList.add('open'),60);
  /* 協奏曲：ソリストを前へ、スポットライトを当てる */
  if(p.form==='Concerto'&&p.slots[0]&&/[Ss]oliste/.test(p.slots[0].l)&&L[0]){const el=stage.querySelector(`.perf[data-pid="${L[0]}"]`);
    if(el){el.style.left='34%';el.style.top='50%';el.classList.add('soloist');stage.insertAdjacentHTML('beforeend','<div class="solospot" style="left:34%"></div>');
      const rest=[...stage.querySelectorAll('.perf')].filter(x=>x!==el);const cd=rest.find(x=>{const i=L.indexOf(x.dataset.pid);return i>=0&&[].concat(p.slots[i].r).includes('cond');});
      if(cd){cd.style.left='66%';cd.style.top='50%';}
      rest.filter(x=>x!==cd).forEach((x,j,arr)=>{x.style.top='20%';x.style.left=(18+64*(arr.length===1?.5:j/(arr.length-1)))+'%';x.classList.add('back');});
      const tag=document.createElement('div');tag.className='solotag';tag.textContent='Soliste';el.appendChild(tag);}}
  /* 指揮者は棒を振る */
  stage.querySelectorAll('.perf').forEach(el=>{const id=el.dataset.pid;const i=L.indexOf(id);if(i>=0&&p.slots[i]&&[].concat(p.slots[i].r).includes('cond')){el.classList.add('conductor');el.insertAdjacentHTML('beforeend','<i class="baton"></i>');}});
  /* 出番が来たら音符を飛ばし、外れ奏者はやらかす */
  const seen=new Set();
  const mo=new MutationObserver(ms=>{for(const m of ms){const el=m.target;if(!el.classList||!el.classList.contains('hl')||seen.has(el))continue;seen.add(el);
    const id=el.dataset.pid;const q=QUIRK[realId(id)]||[];
    if(q.includes('face')){el.classList.add('henkao');animSay(el,pick(['Pfff !','Cette tête !','Qu\'est-ce que c\'est que cette tête ?']),'laugh');setTimeout(()=>el.classList.remove('henkao'),1400);if(typeof audBubble==='function')audBubble(pick(['Pfft !','Ah ah ah ah','Hii !']),10+Math.random()*80,30+Math.random()*40,'good');}
    else if(q.includes('wrong')){el.classList.add('wrongnote');animBurst(el,4,{bad:true,t:pick(['♭?','♯!?','Bwah','✕'])});setTimeout(()=>el.classList.remove('wrongnote'),900);}
    else if(q.includes('rhythm')){el.classList.add('offbeat');animBurst(el,3,{t:'♩?'});setTimeout(()=>el.classList.remove('offbeat'),1200);}
    else animBurst(el,el.classList.contains('soloist')?9:5,{big:el.classList.contains('soloist')});
    if(q.includes('roukai'))animSay(el,pick(['De mon temps…','Trop vite !','Autrefois…']),'old');}});
  stage.querySelectorAll('.perf').forEach(el=>mo.observe(el,{attributes:true,attributeFilter:['class']}));
  setTimeout(()=>mo.disconnect(),20000);
};

const _uSimR=uSim;
uSim=function(B,encore){
  const ret=_uSimR(B,encore);
  try{if(!encore&&(!B.practice||B.challenge)&&!B.rsigDone){
    const bi=B.en.findIndex(e=>e.boss&&e.pt&&rsigOf(e.pt));
    if(bi>=0){const e=B.en[bi],s=rsigOf(e.pt);
      for(let j=0;j<(B.sets&&B.sets.length?4:2);j++)B.ev.unshift({k:'phase',txt:'Lever de rideau'});
      const pos=B.ev.findIndex(v=>v.k==='phase'&&v.txt==='1er mouvement');
      const deadBefore=pos<0||B.ev.slice(0,pos).some(v=>v.k==='hit'&&v.e===bi&&v.kill);
      if(!deadBefore&&Math.random()<.75){B.rsigDone=1;
        const ins=[{k:'phase',txt:`${e.n} : Coup d'éclat [${s.n}]`,rsig:bi},{k:'skip',txt:`<b>${e.n}</b>« ${s.l} »`}];
        for(const u of B.us){if(u.hp<=0)continue;const d=Math.max(1,Math.round(e.atk*.55+rnd(0,4)-udef(u.id)*.5));u.hp=Math.max(1,u.hp-d);ins.push({k:'hurt',e:bi,u:u.i,d,txt:`Coup d'éclat [${s.n}]`});}
        ins.push({k:'phase',txt:'1er mouvement'});
        B.ev.splice(pos+1,0,...ins);}}}}catch(err){}
  return ret;
};

function legacy(){
  const L=[],T=[];
  const hv=Object.entries(G.hev||{}).filter(([k,v])=>v==='great'||v==='good'||v==='dud');
  const ev=k=>(HEV[G.sc]||[]).find(e=>e.id===k);
  for(const [k,v] of hv){const e=ev(k);if(!e)continue;const w=(G.hevWho||{})[k]||'un musicien';L.push(v==='great'?`En ${e.y}, <b>${w}</b> prit part à ${e.t} et fut témoin de l'histoire.`:v==='dud'?`En ${e.y}, à ${e.t}, <b>${w}</b> causa un petit incident (qui tourmente encore les chercheurs).`:`En ${e.y}, <b>${w}</b> soutint de l'intérieur, en scène, ${e.t}.`);}
  const grad=Object.keys(G.deshiDone||{});if(grad.length)L.push(`<b>${grad.map(nameAny).join(', ')}</b>, formé comme élève, devint plus tard un virtuose accompli.`);
  const gs=(G.guests||[]).map(g=>nameOf(g.id)).filter(Boolean);if(gs.length)L.push(`<b>${gs.join(', ')}</b> vint en invité par la Porte du Temps.`);
  if(isMember('haru'))L.push('<b>Haru</b>, le violoniste venu de l\'avenir, retint tous les sons de cette époque et rentra chez lui par la porte.');
  const mc=myCities();if(mc.length)L.push(`Le monde musical de <b>${mc.map(k=>ci(k).name).join(', ')}</b> se souvient du nom de votre orchestre.`);
  const rec=G.chRec||{w:0,l:0};if(rec.w+rec.l)L.push(`Dans les matchs contre d'autres orchestres : ${rec.w} gagné(s), ${rec.l} perdu(s).`);
  const duds=[...new Set(G.members.filter(id=>isDud(id)||id==='donner'))];if(duds.length)L.push(`Grâce à <b>${duds.map(nameOf).join(', ')}</b>, le foyer ne fut jamais sans rires.`);
  if(hv.filter(([k,v])=>v==='great').length>=2)T.push('Témoin de l\'histoire');
  if(grad.length>=2)T.push('Faiseur de maîtres');
  if(gs.length>=3)T.push('Un orchestre par-delà le temps');
  if(duds.length>=2)T.push('Un orchestre plein de rires');
  if(isMember('haru'))T.push('Un orchestre qui a rencontré l\'avenir');
  if(rec.w>=3)T.push('Champion des matchs');
  if(mc.length>=Math.ceil(SC.cities.length*.7))T.push('Maître du continent');
  if((G.ueq||[]).filter(e=>UEQ[e.id]&&UEQ[e.id].fam&&!e.fake).length>=3)T.push('Un orchestre de grands instruments');
  if(G.members.filter(id=>sigOf(id)).length>=4)T.push('Panthéon des coups d\'éclat');
  return{L,T};
}

}

  const low=r.stars<=2;G.flags.akiRoll=G.flags.akiRoll||{};const key=p.id+'|'+G.month;if(G.flags.akiRoll[key]==null)G.flags.akiRoll[key]=Math.random();const roll=G.flags.akiRoll[key];
  if(low&&roll<.5){r.q+=4.5;r.notes.push('Le coup de théâtre d\'Aki ! Un soir au bord du gouffre, toute la salle s\'est levée (+4,5)');}
  else if(low){r.q-=.5;r.notes.push('Aki a visé l\'exploit et s\'est emballé (-0,5)');}
  else if(roll<.3){r.q+=1.5;r.notes.push('L\'étoffe de vedette d\'Aki a fait monter d\'un cran la fièvre de la salle (+1,5)');}

const _concertResultCR=concertResult;
concertResult=function(p,L,ev,fi){

    if(p.by&&C0.likeBy.includes(p.by)){d+=6;why='La plume du compositeur, il faut le dire, est sûre.';}
    if(p.by&&C0.hateBy.includes(p.by)){d-=8;why=C0.hl||'Pour la musique de ce compositeur, je ne sais pourquoi, je note toujours sévèrement.';}

    _critRev={st,txt:pick(REV[Math.max(1,Math.min(5,st))]),why,d,v:s.v};
    if(s.v>=100&&!s.won){s.won=true;setTimeout(()=>{addXP(40);hpush(`Vous avez arraché un murmure d'admiration à votre critique attitré, ${C0.n}`);cutin(C0.id,'Superbe…','Le critique attitré s\'extasie enfin');
