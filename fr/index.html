/* =====================================================================
   聴き当てクイズ：代表曲の一節を聴いて、作曲者・演奏者を当てる（月に3問まで）
   ===================================================================== */
function quizPool(){const ids=Object.keys(SIGM).filter(id=>MOTIFS[SIGM[id]]&&(SCEN[G.sc].chars.some(c=>c.id===id)||Object.values(SCEN).some(s=>s.chars.some(c=>c.id===id))));
  const seen=new Set(),out=[];for(const id of ids){const m=SIGM[id];if(seen.has(m))continue;seen.add(m);out.push(id);}return out;}
const QZ_PIECE={caprice24:'le Caprice n° 24 des 24 Caprices',campanella:'La campanella',nocturne:'Nocturne',surprise:'Symphonie n° 94 « La Surprise »',beethoven5:'Symphonie n° 5',tell:'Ouverture de Guillaume Tell',
  danube:'Le Beau Danube bleu',swan:'Le Lac des cygnes',ride:'La Chevauchée des Walkyries',adagietto:'l\'Adagietto de la Symphonie n° 5',rite:'Le Sacre du printemps',rach2:'Concerto pour piano n° 2',danse:'Danse macabre',
  gymno:'Gymnopédies',bach:'Fugue',hallelujah:'« Alléluia »',devil:'Le Trille du Diable',spring:'« Le Printemps », des Quatre Saisons',lullaby:'Wiegenlied (Berceuse)',verdi:'Une célèbre mélodie d\'opéra',zarathustra:'Also sprach Zarathustra',
  faune:'Prélude à l\'après-midi d\'un faune',mozart:'Eine kleine Nachtmusik',finlandia:'Finlandia',moldau:'Vltava (La Moldau)',promenade:'la Promenade des Tableaux d\'une exposition',bumblebee:'Le Vol du bourdon',
  cancan:'le cancan d\'Orphée aux enfers',habanera:'Habanera',mendvc:'Concerto pour violon en mi mineur',diesirae:'« Dies irae »',belcanto:'Un air de bel canto',alphorn:'le thème du cor des Alpes de la Symphonie n° 1',bvc:'Concerto pour violon'};
function quizOpen(){
  G.quiz=G.quiz||{m:-1,n:0,ok:0,streak:0};if(G.quiz.m!==G.month){G.quiz.m=G.month;G.quiz.n=0;}
  if(G.quiz.n>=3)return toast('Le quiz du mois est terminé. Revenez le mois prochain');
  const pool=quizPool();if(pool.length<4)return toast('Pas assez de questions');
  const ans=pick(pool);const opts=[ans];while(opts.length<4){const x=pick(pool);if(!opts.includes(x))opts.push(x);}opts.sort(()=>Math.random()-.5);
  const nm=id=>{for(const s of Object.values(SCEN)){const c=s.chars.find(c=>c.id===id)||(s.players||{})[id];if(c)return c.name;}return id;};
  const play=()=>{try{playMotif(SIGM[ans],'piano',.05);}catch(e){}};window._qzPlay=play;
  G.quiz.n++;play();
  modal(`Quiz d'écoute (question ${G.quiz.n} sur 3 ce mois-ci)`,`🎵 De qui est cette phrase musicale ?<br><br><button class="btn" style="width:100%;margin:6px 0" onclick="window._qzPlay&&window._qzPlay()">▶ Réécouter</button><span class="pmeta">La récompense grandit avec les bonnes réponses consécutives (${G.quiz.streak} de suite à présent).</span>`,
    opts.map(id=>({t:nm(id),f(){
      const ok=id===ans;if(ok){G.quiz.ok++;G.quiz.streak++;const fr=60*Math.min(5,G.quiz.streak);P().money+=fr;addXP(2);if(typeof sfx==='function')sfx('coin');}else{G.quiz.streak=0;if(typeof sfx==='function')sfx('lose');}
      setTimeout(()=>modal(ok?'Bonne réponse !':'Dommage…',`${portraitRow(ans)}La réponse est <b>${nm(ans)}</b>. ${QZ_PIECE[SIGM[ans]]?`<br>L'œuvre : ${QZ_PIECE[SIGM[ans]]}.`:''}${ok?`<br><br>+${60*Math.min(5,G.quiz.streak)} fr (${G.quiz.streak} de suite)`:''}`,G.quiz.n<3?[{t:'Question suivante',cls:'gold',f(){setTimeout(quizOpen,50);}},{t:'Fermer'}]:null,'paper'),80);save();}})),'paper');
}

/* =====================================================================
   楽団の年間まとめ（毎年1月に前年をふり返る1枚。送れる）
   G.yr = {y, conc, star5, best, pieces{}, play{}, earn, recruit, duel, bet, quiz}
   ===================================================================== */
const yrSt=()=>{const y=ymd(G.month).y;if(!G.yr||G.yr.y!==y)G.yr={y,conc:0,star5:0,best:0,pieces:{},play:{},earn:0,recruit:0,duel:0,bet:0,quiz:0,m0:P().money};return G.yr;};
const _concertResultYR=concertResult;
concertResult=function(p,L,ev,fi){const before=P().money;const r=_concertResultYR(p,L,ev,fi);try{const Y=yrSt(),s=(ev&&ev.stars)||0;Y.conc++;if(s>=5)Y.star5++;Y.best=Math.max(Y.best,s);
  Y.pieces[p.t]=(Y.pieces[p.t]||0)+1;for(const id of (L||[]).filter(Boolean))Y.play[id]=(Y.play[id]||0)+1;Y.earn+=Math.max(0,P().money-before);}catch(e){}return r;};
function yrCard(Y){
  const top=(o)=>Object.entries(o).sort((a,b)=>b[1]-a[1])[0];const tp=top(Y.pieces),tm=top(Y.play);
  const saved=Object.keys(G.fate||{}).filter(k=>G.fate[k].saved&&G.fate[k].sy===Y.y).length;
  const items=[['Concert',`${Y.conc}`],['Soirées ★5',`${Y.star5}`],['Œuvre la plus jouée',tp?`${tp[0].replace(/^\[[^\]]*\] ?/,'')} (×${tp[1]})`:'—'],['Le plus souvent en scène',tm?`${nameOf(tm[0])} (×${tm[1]})`:'—'],['Gains des concerts',`${fmt(Y.earn)}fr`],['Nouveaux compagnons accueillis',`${Y.recruit}`]];
  if(Y.dreams)items.push(['Rendez-vous de rêve',`${Y.dreams}`]);if(saved)items.push(['L\'histoire a changé',`${saved}`]);

/* "g4:1 r:.5 a4+c5:2 =.5 d5 e5" → [[音|[和音]|0, 拍], …]　=x は以後の既定の長さ */
function lvParse(str){let def=1;const out=[];for(const tk of str.trim().split(/\s+/)){if(tk[0]==='='){def=+tk.slice(1);continue;}const [n,b]=tk.split(':');out.push([n==='r'?0:n.includes('+')?n.split('+').map(lvNote):lvNote(n),b==null?def:+b]);}return out;}

const LV_TIM={vn:'violin',va:'violin',vc:'cello',cb:'cello',fl:'flute',ob:'flute',cl:'flute',br:'flute',voice:'voice',pf:'piano',hp:'piano',tim:'piano',comp:'piano'};
const LV_VOL={mel:1,mid:.5,bass:.75},LV_NAME={mel:'Mélodie',mid:'Voix intérieures',bass:'Basse'};
function lvInst(tim,m){if(tim==='piano')return'piano';if(tim==='cello')return m>=72?'violin':'cello';if(tim==='violin')return m<52?'cello':'violin';return m<51?'cello':'flute';}
function lvTone(bus,t0,m,dur,tim,vol){try{
  const k=lvInst(tim,m),arr=BUF[k];let b=null;
  if(arr&&arr.length){b=arr[0];for(const s of arr)if(Math.abs(s.m-m)<Math.abs(b.m-m))b=s;if(Math.abs(b.m-m)>10)b=null;}
  const g=AC.createGain();g.connect(bus);
  if(b){const src=AC.createBufferSource();src.buffer=b.buf;src.playbackRate.value=Math.pow(2,(m-b.m)/12);
    const v=SMP[k].vol*vol,len=k==='piano'?Math.max(dur*2.2,.7):dur+.08;
    g.gain.setValueAtTime(v,t0);g.gain.setValueAtTime(v,t0+len*.8);g.gain.linearRampToValueAtTime(.0001,t0+len+.15);
    src.connect(g);src.start(t0);src.stop(t0+len+.2);}
  else{const o=AC.createOscillator(),f=AC.createBiquadFilter();o.frequency.value=mtof(m);f.type='lowpass';o.connect(f);f.connect(g);o.start(t0);
    if(tim!=='piano'){o.type=(tim==='violin'||tim==='cello')?'sawtooth':'triangle';f.frequency.value=2200;const v=.1*vol;
      g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(v,t0+.03);g.gain.setValueAtTime(v,t0+Math.max(.04,dur*.85));g.gain.linearRampToValueAtTime(0,t0+dur+.06);o.stop(t0+dur+.2);}
    else{o.type='triangle';f.frequency.value=3200;g.gain.setValueAtTime(.22*vol,t0);g.gain.exponentialRampToValueAtTime(.001,t0+Math.max(dur*2,.5));o.stop(t0+Math.max(dur*2,.5)+.05);}}
}catch(e){}}
const LV_MAJ=[0,2,4,5,7,9,11];
function lvUp(m,key){for(let d=1;d<=2;d++)if(LV_MAJ.includes(((m+d-key)%12+12)%12))return m+d;return m+2;}

/* ---------- 誰がどの声部を弾くか ---------- */
function lvCast(p,L,ev,sc){
  const pl=[];let cond=null,condSlot=false;
  p.slots.forEach((s,i)=>{const rs=[].concat(s.r),c=ev.contrib[i],x=c?Math.max(0,Math.min(1,(c.v-11)/12)):.6;
    if(rs.includes('cond')){condSlot=true;if(L[i])cond={id:L[i],x};return;}
    pl.push({i,id:L[i]||null,r:rs[0],x});});
  const voices=['mel','mid','bass'].filter(v=>sc.segs.some(s=>s[v])),cast={};
  if(pl.length===1){for(const v of voices)cast[v]=[pl[0]];}
  else if(pl.length){const rest=pl.slice();cast.mel=[rest.shift()];
    if(voices.includes('bass')&&rest.length){let bi=-1;for(const r of ['cb','vc','pf','tim']){bi=rest.findIndex(w=>w.r===r);if(bi>=0)break;}if(bi<0)bi=rest.length-1;cast.bass=[rest.splice(bi,1)[0]];}
    if(rest.length){if(voices.includes('mid'))cast.mid=rest;else cast.mel=cast.mel.concat(rest);}
    else if(voices.includes('mid')&&cast.bass&&['pf','hp'].includes(cast.bass[0].r))cast.mid=cast.bass;}
  return{cast,cond,condSlot,voices,solo:pl.length===1};
}
/* ---------- 一区切りぶんの音を並べる。戻り値は長さ（秒） ---------- */
function lvSeg(S,si){
  const sc=S.sc,seg=sc.segs[si],last=si===sc.segs.length-1,spb=60/sc.bpm/S.tempo;
  const B=Math.max(...S.cast.voices.map(v=>seg[v]?lvBeats(seg[v]):0));
  const R=last&&sc.rit!==false?Math.min(4,B/2):0,rk=last?({big:.3,normal:.22,soft:.45})[S.fin]:0;
  const T=b=>{let t=b*spb+S.wob*spb*1.6*(Math.sin(b*.55+S.ph)-Math.sin(S.ph));if(R&&b>B-R){const u=b-(B-R);t+=u*u/(2*R)*rk*spb*2;}return t;};
  const live=!!(S.bus&&AC),base=live?S.tNext:0,wall0=live?Math.max(0,S.tNext-AC.currentTime):0;
  if(live&&last){try{const g=S.bus.gain,tg=({big:1.45,normal:1.05,soft:.5})[S.fin];if(sc.rit===false)g.setValueAtTime(tg,base);else{g.setValueAtTime(1,base);g.linearRampToValueAtTime(tg,base+Math.max(.5,T(B)*.7));}}catch(e){}}
  for(const v of S.cast.voices){const line=seg[v];if(!line)continue;
    const who=S.cast.cast[v];let x,tim,pid=null,vol=LV_VOL[v]*seg.vol;
    if(!who){x=.72;tim=(sc.tim&&sc.tim[v])||'piano';vol*=.55;}
    else{const on=who.filter(w=>w.id);if(!on.length)continue;x=on.reduce((a,w)=>a+w.x,0)/on.length;tim=LV_TIM[on[0].r]||'piano';if(!S.cast.solo||v==='mel')pid=on[0].id;}
    const lag=S.lag[v]||0,pw=(1-x)*(1-x)*.2+(S.rush?.06:0);let b=0;
    for(const [n,d] of line){
      if(n){const t=T(b);let dur=(T(b+d)-t)*(sc.gate||1),off=Math.max(0,t+lag+(Math.random()*2-1)*(1-x)*.04),ns=Array.isArray(n)?n.slice():[n],flag='';
        if(Math.random()<pw){flag='✗';if(ns.length>1)ns.splice(Math.floor(Math.random()*ns.length),1);else ns[0]+=pick([-1,1,-2,2]);}
        else if(sc.orn&&v==='mel'&&x>=.75&&ns.length===1&&d*spb>=.45&&Math.random()<.6){flag='✨';
          if(live){lvTone(S.bus,base+off,ns[0],.07,tim,vol);lvTone(S.bus,base+off+.07,lvUp(ns[0],sc.key||0),.07,tim,vol);}off+=.14;dur=Math.max(.1,dur-.14);}
        if(live)for(const m of ns)lvTone(S.bus,base+off,m,dur,tim,vol);
        if(flag&&pid)lvFlash(S,pid,flag,(wall0+off)*1000);}
      b+=d;}
  }
  const D=T(B);if(live)S.tNext+=D;return D;
}
function lvFlash(S,pid,txt,ms){S.fl[pid]=(S.fl[pid]||0)+1;if(S.fl[pid]>6)return;S.at(ms,()=>{const el=document.querySelector(`.perf[data-pid="${pid}"]`);if(!el)return;const s=document.createElement('span');s.className='lvx'+(txt==='✗'?' bad':'');s.textContent=txt==='✗'?'♪✗':'✨';el.appendChild(s);setTimeout(()=>s.remove(),800);});}

/* ---------- 指揮の判断 ---------- */
const lvAvg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
function lvStats(S){const ids=S.L.filter(Boolean),oth=ids.filter(id=>id!=='you');
  return{t:lvAvg(ids.map(id=>mstat(id,'tech')||8)),e:lvAvg(ids.map(id=>mstat(id,'expr')||8)),mood:oth.length?lvAvg(oth.map(id=>moodOf(id))):70,cond:!!S.cast.cond,small:ids.length<=2};}
const LV_AUD={quiet:'écoute dans un silence recueilli',restless:'agité et bruissant',warm:'regarde avec bienveillance'};
const LV_FIN={big:'une œuvre qui finit avec grandeur',soft:'une œuvre qui s\'éteint doucement',any:'une œuvre à qui les deux conviennent'};
function lvJudge1(S,c){const st=lvStats(S);if(c==='keep')return{b:.2,msg:'vous l\'avez menée comme c\'est écrit, nettement'};
  const fit=c==='slow'?st.e>=st.t:st.t>=st.e,af=S.aud==='warm'?.2:((c==='slow')===(S.aud==='quiet'))?.4:-.2;
  if(c==='fast'&&!fit)S.rush=true;
  return{b:(fit?.5:-.3)+af,msg:c==='slow'?(fit?'vous l\'avez laissée chanter, et la mélodie a pénétré la salle':'le chant n\'a pas tenu jusqu\'au bout, et cela a traîné'):(fit?'devant ce mouvement incisif, le public s\'est penché en avant':'vous avez pressé et l\'ensemble s\'est défait')};}
function lvJudge2(S,c){const st=lvStats(S),f=S.sc.fin;if(c==='normal')return{b:.2,msg:'vous avez conclu comme c\'est écrit'};
  const ok=c==='big'?st.mood>=55:(st.cond||st.small),nat=f==='any'?.1:f===c?.4:-.2;
  return{b:(ok?.5:-.3)+nat,msg:c==='big'?(ok?(S.sc.bang?'au coup, toute la salle a sursauté':'tous n\'ont fait qu\'un, et cela a sonné grandement'):(S.sc.bang?'le coup n\'était pas ensemble, et la surprise ne fut qu\'une demi-surprise':'les esprits n\'étaient pas ensemble, et le son s\'est dispersé')):(ok?'cela s\'est éteint dans un silence à couper le souffle':'l\'extinction n\'était pas ensemble')};}
function lvAsk(S,n,ms){
  const box=$('#lvD');if(!box)return;const st=lvStats(S),sc=S.sc;
  const d2=sc.d2||{q:'Comment terminez-vous ?',big:'Monter vers un grand sommet',normal:'Comme c\'est écrit',soft:'S\'éteindre doucement'};
  const q=n===1?'Et le tempo ?':d2.q;
  const hint=n===1?`Formation : Technique <b>${st.t.toFixed(1)}</b> / Expression <b>${st.e.toFixed(1)}</b>   Public : <b>${LV_AUD[S.aud]}</b>`
    :`Humeur de l'orchestre <b>${Math.round(st.mood)}</b> / ${st.cond?'avec chef':st.small?'petit effectif':'sans chef'}   <b>${LV_FIN[sc.fin]}</b>`;
  const opts=n===1?[['slow','Laisser chanter'],['keep','Comme c\'est écrit'],['fast','Aller de l\'avant']]:[['soft',d2.soft],['normal',d2.normal],['big',d2.big]];
  box.innerHTML=`<div class="lvq"><b>🪄 ${q}</b><div class="pmeta">${hint}</div><div class="lvo">${opts.map(o=>`<button class="btn" data-lv="${o[0]}">${o[1]}</button>`).join('')}</div><div class="lvt"><i style="animation-duration:${Math.max(.5,ms/1000)}s"></i></div></div>`;
  box.querySelectorAll('[data-lv]').forEach(b=>b.onclick=()=>{S['c'+n]=b.dataset.lv;box.querySelectorAll('[data-lv]').forEach(x=>x.classList.toggle('gold',x===b));if(typeof sfx==='function')sfx('tap');});
}
function lvLock(S,n){
  const c=S['c'+n]||(n===1?'keep':'normal'),r=n===1?lvJudge1(S,c):lvJudge2(S,c);r.b=Math.round(r.b*10)/10;S.bonus+=r.b;S.res.push(r);
  if(n===1)S.tempo=c==='slow'?.87:c==='fast'?1.13:1;else S.fin=c;
  const box=$('#lvD');if(box)box.innerHTML='';
  const lg=$('#lvLog');if(lg)lg.innerHTML+=`<div class="${r.b>=.5?'good':r.b<0?'bad':''}">${n===1?'Tempo':'Fin'} : ${r.msg} (${r.b>=0?'+':''}${r.b.toFixed(1)})</div>`;
}

let LV=null;
const LV_LINES=['','« Je ne veux plus jamais entendre cela. »','« C\'était ennuyeux. »','« Une exécution solide. »','« Une soirée superbe. »','« Une interprétation qui restera dans les annales. »'];
const liveOn=()=>soundOn&&(window.LIVE_FORCE||!navigator.webdriver)&&!(G.flags&&G.flags.liveOff);
function lvRun(p,L,ev){
  const sc=LIVE[p.id],S=LV;Object.assign(S,{p,L,ev,sc,tempo:1,fin:'normal',bonus:0,res:[],fl:{},rush:false,aud:pick(['quiet','restless','warm']),ph:Math.random()*6,timers:[],
    at(ms,fn){this.timers.push(setTimeout(()=>{if(!this.done)fn();},ms));}});
  S.cast=lvCast(p,L,ev,sc);
  const xs=[].concat(...Object.values(S.cast.cast)).filter(w=>w.id).map(w=>w.x);
  S.wob=S.cast.cond?(1-S.cast.cond.x)*.05:S.cast.condSlot?.09:(1-lvAvg(xs))*.03;
  S.lag={};if(S.cast.condSlot&&!S.cast.cond)for(const v of S.cast.voices)S.lag[v]=(Math.random()*2-1)*.06;
  const c=ac();if(c){try{S.bus=c.createGain();S.bus.gain.value=1;S.bus.connect(MASTER);S.tNext=c.currentTime+.45;}catch(e){S.bus=null;}}
  /* 画面 */
  const stage=document.querySelector('#scene .stage');if(stage){
    const who=v=>{const w=S.cast.cast[v];if(!w)return'Orchestre';const on=w.filter(x=>x.id);return on.length?on.map(x=>nameOf(x.id)).join(' ·'):'<span style="color:#e77">vacant (muet)</span>';};
    const d=document.createElement('div');d.id='live';d.className='live';
    d.innerHTML=`<div class="lvh"><span>🎧 <b>${sc.t}</b><small> (extrait) joué avec le son de votre formation actuelle</small></span><button class="btn" id="lvSkip">⏭ Passer</button></div>
     <div class="lvbar"><i id="lvProg"></i></div>
     <div class="lvcast">${S.cast.solo?`Soliste : ${who('mel')}`:S.cast.voices.map(v=>`${LV_NAME[v]} : ${who(v)}`).join('  ')}${S.cast.condSlot?`   Chef : ${S.cast.cond?nameOf(S.cast.cond.id):'<span style="color:#e77">vacant (l\'ensemble vacille)</span>'}`:''}</div>
     <div id="lvD"></div><div id="lvLog" class="lvlog"></div>`;
    stage.insertAdjacentElement('afterend',d);$('#scene').classList.add('lvplay');
    $('#lvSkip').onclick=()=>lvFinish(true);}
  const tot=sc.segs.reduce((a,s)=>a+Math.max(...S.cast.voices.map(v=>s[v]?lvBeats(s[v]):0)),0);let doneB=0;
  const prog=(si,dur)=>{const s=sc.segs[si];doneB+=Math.max(...S.cast.voices.map(v=>s[v]?lvBeats(s[v]):0));const el=$('#lvProg');if(el){el.style.transitionDuration=dur+'s';requestAnimationFrame(()=>{el.style.width=(doneB/tot*100)+'%';});}};
  const d0=lvSeg(S,0);prog(0,d0);
  S.at(700,()=>lvAsk(S,1,d0*1000-1100));
  S.at(d0*1000-400,()=>{lvLock(S,1);const d1=lvSeg(S,1);
    S.at(400,()=>{prog(1,d1);lvAsk(S,2,d1*1000-500);});
    S.at(400+d1*1000-400,()=>{lvLock(S,2);const d2=lvSeg(S,2);
      S.at(400,()=>{prog(2,d2);if(sc.bang){const big=S.fin==='big';for(let i=0;i<(big?8:S.fin==='soft'?1:4);i++)setTimeout(()=>{try{audBubble(pick(big?['Oh !','Hii !',' ! !']:['Tiens','… !']),8+Math.random()*84,15+Math.random()*60,big?'good':'');}catch(e){}},i*90);}});
      S.at(400+d2*1000+900,()=>lvFinish(false));});});
}
function lvFinish(skipped){
  const S=LV;if(!S||S.done)return;S.done=true;S.timers.forEach(clearTimeout);
  if(skipped&&S.bus&&AC){try{S.bus.gain.cancelScheduledValues(AC.currentTime);S.bus.gain.setTargetAtTime(0,AC.currentTime,.05);}catch(e){}}
  const ev=S.ev,b=skipped?0:Math.round(S.bonus*10)/10;
  if(b){ev.q+=b;ev.stars=ev.q<13?1:ev.q<17?2:ev.q<21?3:ev.q<25?4:5;}
  if(!skipped)ev.notes.push(`Direction en direct : ${S.res.map(r=>r.msg).join(' / ')} (${b>=0?'+':''}${b.toFixed(1)})`);
  if(S.cast.condSlot&&!S.cast.cond&&!skipped)ev.notes.push('sans chef, l\'ensemble n\'a pas tenu');
  if(!skipped)_lvNote=`<div class="stx">🎧 Direction en direct : ${S.res.map(r=>r.msg).join(' / ')} (accueil ${b>=0?'+':''}${b.toFixed(1)})</div>`;
  const sn=$('#scene');if(sn)sn.classList.remove('lvplay');
  const d=$('#lvD');if(d)d.innerHTML='';const lg=$('#lvLog');if(lg&&!skipped)lg.innerHTML+=`<div><b>Vos décisions de chef : accueil ${b>=0?'+':''}${b.toFixed(1)}</b></div>`;
  const sk=$('#lvSkip');if(sk)sk.remove();
  const a=$('#apl');if(a)a.style.width=(ev.stars*20)+'%';const s=$('#stx');if(s&&s.textContent)s.textContent=STARS(ev.stars);
  const cb=document.querySelector('#critic b');if(cb)cb.textContent=LV_LINES[ev.stars];
  if(S.react!=null){try{_audienceReactLV(ev.stars);}catch(e){}}

function dyMake(date){
  const R=dyRng(dyHash('concerto'+date)),pk=a=>a[Math.floor(R()*a.length)],A=dyAll(),ids=Object.keys(A);
  const pieces=[];for(const k of Object.keys(DY_ERA)){const S=SCEN[k];if(!S)continue;for(const p of S.rep){if(pieces.some(x=>x.p.id===p.id)||/^(new|my|saga|fate)/.test(p.id))continue;
    if(p.slots.length<3||p.slots.length>5||p.slots.some(s=>s.you||[].concat(s.r).includes('comp')))continue;
    if(p.slots.every(s=>ids.filter(id=>dyFits(A[id],s)).length>=3))pieces.push({p,era:DY_ERA[k]});}}
  const P0=pk(pieces),p=P0.p,hand=[];
  for(const s of p.slots){const el=ids.filter(id=>dyFits(A[id],s)&&!hand.includes(id));for(let i=0;i<2&&el.length;i++)hand.push(el.splice(Math.floor(R()*el.length),1)[0]);}
  if(p.by&&A[p.by]&&!hand.includes(p.by)&&R()<.5)hand.push(p.by);
  const any=ids.filter(id=>!hand.includes(id)&&p.slots.some(s=>dyFits(A[id],s)));
  while(hand.length<9&&any.length)hand.push(any.splice(Math.floor(R()*any.length),1)[0]);
  hand.sort((a,b)=>dyHash(a+date)-dyHash(b+date));
  const favs=[...new Set(hand.map(id=>A[id].faction))],fav=pk(favs),rule=pk(DY_RULES);
  const D={date,p,pera:P0.era,hand,fav,rule};D.best=dyBest(D);return D;
}
function dyScore(D,L){

  cs.forEach((c,i)=>{if(!c){sum-=6;return;}sum+=(c.tech*w[0]*(D.rule.k==='tech'?2:1)+c.expr*w[1]*(D.rule.k==='expr'?2:1)+c.impro*w[2])*1.6+c.lv;});

  for(const [a,b,v,l] of SYN)if(idl.includes(a)&&idl.includes(b)){q+=v;notes.push(`Entente : ${l} (${v>0?'+':''}${v})`);}
  if(p.by&&idl.includes(p.by)){q+=6;notes.push('le compositeur joue lui-même (+6)');}
  const nf=on.filter(c=>c.faction===D.fav).length;if(nf){q+=nf*.8;notes.push(`${nf} au goût du public, « ${D.fav} » (+${(nf*.8).toFixed(1)})`);}

  if(k==='same'){const m={};on.forEach(c=>m[c.era]=(m[c.era]||0)+1);if(Object.values(m).some(n=>n>=3))rb=3;}

  if(v){S.meter=clamp(S.meter+v,-60,90);setTimeout(()=>{try{bub('them',same.length?`« On me dit que vous tenez pour ${same.join(' ·')}. ${diff.length?'…Bien que certains points ne me plaisent guère.':'Nous nous entendrons, je crois.'} »`:`« J'ai entendu parler de votre réputation. Pour ma part, voyez-vous, je tiens pour ${diff.join(' ·')}. »`,Math.abs(v),v>0?'weak':'resist',`Votre credo ${v>0?'+':''}${v}`);upd();}catch(e){}},500);}
  const row=document.querySelector('#scene .rinfo');const txt=creedLine();if(row&&txt)row.insertAdjacentHTML('beforebegin',`<div class="pmeta crline">Votre credo : ${txt}</div>`);}catch(e){}};
function creedLine(){const my=creedMine();return Object.keys(my).filter(ax=>CREED[ax]&&my[ax].n>=1).map(ax=>`${creedLabel(ax,my[ax].s)}${my[ax].n>=2?` (${my[ax].n})`:''}`).join(' ·');}
/* 2小節目の返事の代わりに、相手が問いただす */
const _counterCR=counter;
counter=function(){try{if(S&&!S.done&&!S.t.isCity&&!S.creed&&S.round===1&&S.meter>-90&&creedReady()){
    const t=S.t,axs=(CREED_ERA[G.sc]||[]).filter(ax=>creedOf(t,ax));if(axs.length){S.creed=1;return creedAsk(pick(axs));}}}catch(e){}
  return _counterCR();};
function creedAsk(ax){
  const t=S.t,C=CREED[ax],ts=creedOf(t,ax),my=creedMine()[ax];
  bub('them',`« Dites-moi une chose. ${ts===C.a?C.qa:C.qb} »`,0,'',`${t.name} demande : ${C.n}`);
  const cm=$('#cmds');cm.style.display='none';
  const box=document.createElement('div');box.id='creedQ';box.className='creedq';
  box.innerHTML=`<div class="crh">🗣 Débat : <b>${C.n}</b>${my?`<span>Vous, jusqu'ici : ${creedLabel(ax,my.s)} (×${my.n})</span>`:''}</div>
    <button class="btn" data-cr="${C.a}"><b>${C.la}</b>   ${C.A}<small>${creedSrc(C.sA)}</small></button>
    <button class="btn" data-cr="${C.b}"><b>${C.lb}</b>   ${C.B}<small>${creedSrc(C.sB)}</small></button>
    <button class="btn" data-cr="mid"><b>Les deux</b>   ${C.M}<small>Ne pas prendre parti. Avec une Théorie ou une Expression élevée, vous esquivez avec adresse</small></button>
    <div class="pmeta">Prenez le même parti que l'autre et l'affinité monte fortement. Même dans le parti opposé, vous gagnez le respect si votre Théorie est supérieure (vous ${P().theory} / l'autre ${t.theory}). Changer de parti entame votre crédit.</div>`;
  cm.insertAdjacentElement('beforebegin',box);
  box.querySelectorAll('[data-cr]').forEach(b=>b.onclick=()=>creedAnswer(ax,b.dataset.cr));
  if(!G.flags.creedInfo){G.flags.creedInfo=1;setTimeout(()=>modal('Débats sur la nature de la musique',`Les musiciens de renom vous interrogeront, au milieu d'une persuasion, sur <b>votre conception de la musique</b>.<br><br> · Votre réponse devient connue du monde comme <b>votre credo</b>.<br> · Tenez toujours le même parti et les esprits proches seront plus faciles à aborder dès la première rencontre.<br> · Dites à chacun autre chose et vous passerez pour une <b>girouette</b>.<br><br><span class="pmeta">Dans l'Allemagne de la seconde moitié du XIXe siècle, le parti de Brahms et celui de Wagner se disputèrent âprement sur « ce que dit la musique ».</span>`,null,'paper'),400);}
}
function creedAnswer(ax,side){
  const t=S.t,C=CREED[ax],ts=creedOf(t,ax),all=creedMine(),my=all[ax];let val,line,cls,lab;
  if(side==='mid'){const ok=P().theory>=11||P().expr>=13;val=ok?10:-5;cls=ok?'':'resist';lab='Les deux';
    bub('you',`« ${C.M} »`,6,'','Débat');line=ok?'Joliment dit. …Soit, passons.':'Ni chair ni poisson. N\'avez-vous donc pas d\'avis à vous ?';}
  else{const flip=!!(my&&my.s!==side),keep=my&&my.s===side?my.n:0,agree=side===ts;lab=creedLabel(ax,side);
    bub('you',`« ${side===C.a?C.A:C.B} »`,10,'','Débat :'+lab);
    if(agree){val=22+Math.min(10,keep*3);line=keep>=2?'On me dit que vous le soutenez depuis longtemps. Voilà une conviction.':'Rencontrer quelqu\'un du même avis ! Cela fait gagner du temps.';cls='weak';
      if(flip){val=5;line='…J\'ai ouï dire que vous souteniez l\'inverse l\'autre jour. N\'approuvez-vous pas simplement celui que vous avez en face de vous ?';cls='resist';}}
    else{const win=P().theory+Math.min(3,keep)>=t.theory+1;val=win?12:-14;cls=win?'':'back';
      line=win?'…Hum. Nous pensons différemment, mais votre raisonnement se tient.':'Il n\'y a rien à discuter. Étudiez encore un peu et revenez.';
      if(flip){val-=8;line='L\'autre jour vous souteniez l\'inverse, me dit-on. On ne peut se fier à la parole d\'une girouette.';cls='back';}}
    if(flip){all[ax]={s:side,n:1};G.flags.creedFlip=(G.flags.creedFlip||0)+1;}else if(my)my.n++;else all[ax]={s:side,n:1};
    /* 団員も聞いている */
    try{let up=0,dn=0;for(const id of G.members){const c=charById(id);if(!c)continue;const s=creedOf(c,ax);if(!s)continue;if(s===side){setMood(id,moodOf(id)+2);up++;}else{setMood(id,moodOf(id)-2);dn++;}}
      if(up||dn)toast(`Réaction de vos musiciens : ${up} ont approuvé, ${dn} ont froncé le sourcil`);}catch(e){}
    try{if(all[ax].n===4){addXP(15);hpush(`Appelé le porte-drapeau de « ${lab} »`);toast(`On vous appelle désormais le porte-drapeau de « ${lab} » (renommée +15)`);}}catch(e){}}
  const q=$('#creedQ');if(q)q.remove();$('#cmds').style.display='';
  setTimeout(()=>{try{bub('them',`« ${line} »`,Math.abs(val),cls,`${t.name}   Affinité ${val>=0?'+':''}${val}`);
    if(val>=0){S.sy=(S.sy||0)+val;S.ny=(S.ny||0)+1;}else{S.st=(S.st||0)-val;S.nt=(S.nt||0)+1;}
    S.meter=clamp(S.meter+val,-100,100);S.round++;S.busy=false;upd();save();
    if(S.meter>=100)return setTimeout(()=>finish('win'),500);if(S.meter<=-100)return setTimeout(()=>finish('break'),500);}catch(e){}},600);
}
/* 結末の称号 */
const _legacyCR=legacy;
legacy=function(){const o=_legacyCR();try{const my=creedMine();for(const ax of Object.keys(my))if(CREED[ax]&&my[ax].n>=4)o.T.push(`Porte-drapeau : ${creedLabel(ax,my[ax].s)}`);
  if((G.flags.creedFlip||0)>=4)o.L.push('On murmurait aussi que vous étiez une « girouette », qui disait à chacun autre chose.');}catch(e){}return o;};
/* 遊びの棚に「信条」 */
function creedOpen(){const my=creedMine(),axs=CREED_ERA[G.sc]||[];
  modal('Votre credo',`Les partis que vous avez pris dans les débats, lors des persuasions, sont connus du monde comme votre credo.<div class="saga">${axs.map(ax=>{const C=CREED[ax],m=my[ax];
    return`<div class="sgera on"><div class="sgb"><b>${C.n}</b><div class="crbar"><span class="${m&&m.s===C.a?'on':''}">${C.la}</span><i>${m?`${m.n}`:'non déclaré'}</i><span class="${m&&m.s===C.b?'on':''}">${C.lb}</span></div></div></div>`;}).join('')}</div>
    <div class="pmeta">Un parti tenu deux fois ou plus est connu même de ceux que vous rencontrez pour la première fois (esprits proches +6 / parti opposé −5). À quatre fois, on vous appelle « porte-drapeau ».</div>`,null,'paper');}
const _mapHTMLCR=mapHTML;
mapHTML=function(){let h=_mapHTMLCR();try{if(creedReady()&&Object.keys(creedMine()).length)h=h.replace(/(<details class="shelf"[^>]*>[\s\S]*?<div class="hub">)/,'$1<button class="btn" id="creedBtn">🗣 Credo</button>');}catch(e){}return h;};
const _renderCR=render;
render=function(){_renderCR();const b=$('#creedBtn');if(b)b.onclick=creedOpen;};

/* =====================================================================
   最初の10分：はじめての人を迷わせない
   ・はじめての人のタイトル画面は「▶ はじめての方はここから」を一番上に。ほかの遊びは折りたたむ
   ・押すと 1781年・モーツァルト・入門 で始まり、案内のあとすぐ最初の演奏会（生演奏）へ
   ・序盤は地図をすっきり：街角・宮廷/民衆は2か月目から、お題・遊びの棚は3か月目から開く（UNL に追加）
   ・最初の3か月は、おまけの出来事の窓を出さない
   ===================================================================== */
UNL.unshift(
 {id:'street',c:()=>G.month>=1,t:'Jouer dans la rue',d:'<b>Jouer dans la rue</b> s\'ajoute à l\'écran de la ville. Jouez dans la rue, gagnez le cœur du peuple, et il se pressera à vos concerts dans cette ville. La bande <b>Cour / Peuple</b>, au-dessus de la carte, montre lequel des deux vous soutient.'},
 {id:'odai',c:()=>G.month>=2,t:'Missions du mois et Divertissements',d:'Les <b>Missions du mois</b> et les <b>Divertissements</b> s\'ajoutent à la carte. Il y a trois missions par mois, avec une récompense à la clé. Les Divertissements réunissent des chemins de traverse : carte des relations, composition, quiz. Ouvrez-les quand l\'envie vous en prend.'});
const _startFS=start;
start=function(){try{if(G&&G.flags&&G.flags.gate&&G.month>=3){G.unl=G.unl||{};G.unl.street=1;G.unl.odai=1;}}catch(e){}return _startFS();};
const _renderFS=render;
render=function(){_renderFS();try{const b=document.body.classList,on=!!(G&&G.flags);b.toggle('lk-street',on&&!unl('street'));b.toggle('lk-odai',on&&!unl('odai'));}catch(e){}};
const _odaiHitFS=odaiHit;
odaiHit=function(k){if(!unl('odai'))return;return _odaiHitFS(k);};
const _evBudgetFS=evBudget;
evBudget=function(){if(G&&G.flags&&G.flags.gate&&G.month<3)return false;return _evBudgetFS();};
/* ---------- タイトル画面 ---------- */
function firstTimer(){try{if(load())return false;if(hallLoad().length)return false;for(const k of ['concertoStormFR_Saga','concertoStormFR_Daily','concertoStormFR_First'])if(localStorage.getItem(k))return false;
  for(let i=0;i<localStorage.length;i++)if(/^concertoStormFR_Chx_/.test(localStorage.key(i)))return false;return true;}catch(e){return false;}}
const _titleFS=title;
title=function(){_titleFS();try{if(!firstTimer()||!SCEN.s1781)return;const box=document.querySelector('#main .title');if(!box)return;
  const kids=[...box.children],staff=kids.find(e=>e.classList.contains('staff')),scT=kids.find(e=>e.classList.contains('sec-t')&&/Choisir un scénario/.test(e.textContent));if(!staff||!scT)return;
  const mv=kids.slice(kids.indexOf(staff)+1,kids.indexOf(scT));
  const det=document.createElement('details');det.className='card moreplay';det.innerHTML='<summary>Autres façons de jouer<small>le concert du jour, scénarios de défi, votre histoire de la musique, Panthéon</small></summary>';mv.forEach(e=>det.appendChild(e));
  const hero=document.createElement('button');hero.className='btn firstbtn';hero.id='firstBtn';
  hero.innerHTML=`<span class="fb1">▶ Première visite ? Commencez ici</span><span class="fb2">Vienne, 1781. Devenez Mozart et donnez votre premier concert</span><span class="fb3">environ 3 minutes · avec du son</span>`;
  staff.insertAdjacentElement('afterend',hero);scT.textContent='— Choisir soi-même son époque —';
  const how=kids.find(e=>e.classList.contains('howto'));(how||box.lastElementChild).insertAdjacentElement('beforebegin',det);
  hero.onclick=firstStart;}catch(e){}};
function firstStart(){
  try{localStorage.setItem('concertoStormFR_First','1');}catch(e){}
  try{ac();}catch(e){}
  newGame('s1781','mozart','easy');G.flags.quick=1;start();
  let n=0;const iv=setInterval(()=>{n++;if(n>200||!G||!G.flags.quick){clearInterval(iv);return;}
    const busy=!$('#modal').classList.contains('hidden')||!$('#scene').classList.contains('hidden')||document.querySelector('.cardov');
    if(busy||(typeof MQ!=='undefined'&&MQ.length))return;clearInterval(iv);firstConcert();},300);
}
function firstConcert(){try{
  if(!G||!G.flags.quick||G.flags.quickDone)return;G.flags.quickDone=1;
  const p=SC.rep.find(r=>r.id==='k331')||recitalPiece();
  PR={p,L:[],hall:hallsFor(P().city)[0],mode:'concert'};autoFill();
  if(!PR.L.some(Boolean)){PR.p=recitalPiece();autoFill();}
  lineup();$('#scene').classList.remove('hidden');$('#scene').scrollTop=0;
  const sc=document.querySelector('#scene .sc'),mid=TUT_MENTOR[G.sc]||'haydn',mc=charById(mid);
  if(sc)sc.insertAdjacentHTML('afterbegin',`<div class="firstguide">${portrait(mid,52,'#c9a24a')}<div><b>${mc?mc.name:'Le maître'}</b><br>Bienvenue à Vienne. Avant tout, jouez un morceau. Vous êtes déjà à votre place. Il suffit d'appuyer sur <b>Rideau !</b> ci-dessous.<br>Une fois la musique lancée, <b>le tempo</b> et <b>la fin</b> sont à vous de décider.</div></div>`);
  const go=$('#go');if(go){go.classList.add('tut-hl');setTimeout(()=>{try{go.scrollIntoView({block:'center',behavior:'smooth'});}catch(e){}},400);}
  save();}catch(e){console.warn(e);}}

  const cur=document.documentElement.lang||'ja',base=cur==='ja'?'':'../';const L=[['ja','日本語',base||'./'],['en','English',base+'en/'],['fr','Fran\u00e7ais',base+'fr/']];
  const d=document.createElement('div');d.className='credit langs';d.innerHTML=L.map(([k,n,h])=>k===cur?`<b>${n}</b>`:`<a href="${h}">${n}</a>`).join(' \u00b7 ');t.appendChild(d);}catch(e){}};
